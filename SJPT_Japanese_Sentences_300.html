 activeUtterance=u;
 u.lang='ja-JP';u.rate=.85;u.pitch=1;u.volume=1;
 const voices=synth.getVoices();
 const japanese=voices.filter(v=>/^ja(?:-|$)/i.test(v.lang));
 const voice=japanese.find(v=>v.default)||japanese.find(v=>v.localService)||japanese[0];
 if(voice)u.voice=voice;
 $('message').textContent='음성 재생을 요청했습니다…';
 u.onstart=()=>{if(activeUtterance===u)$('message').textContent='일본어 음성 재생 중…'};
 u.onend=()=>{if(activeUtterance===u){$('message').textContent='';activeUtterance=null}};
 u.onerror=e=>{if(activeUtterance!==u)return;activeUtterance=null;if(e.error==='canceled'||e.error==='interrupted'){$('message').textContent='';return}$('message').textContent='음성을 재생하지 못했습니다. 안드로이드 설정의 텍스트 음성 변환에서 일본어 음성 데이터를 설치한 뒤 Chrome에서 다시 시도해 주세요.'};
 try{if(synth.paused)synth.resume();synth.speak(u)}catch(e){activeUtterance=null;$('message').textContent='음성 재생을 시작하지 못했습니다. Chrome에서 열고 일본어 음성 설정을 확인해 주세요.'}
}

function clearAutoTimers(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(autoTicker){clearInterval(autoTicker);autoTicker=null}}
function updateAutoStatus(){
 const button=$('autoPlay');if(!button)return;
 button.classList.toggle('active',autoPlaying);button.setAttribute('aria-pressed',autoPlaying);
 button.textContent=autoPlaying?'■':'▶';
 const label=autoPlaying?'자동 넘김 정지':'자동 넘김 시작';button.setAttribute('aria-label',label);button.title=label;
}
function stopAuto(){autoPlaying=false;clearAutoTimers();updateAutoStatus()}
function scheduleAuto(){
 clearAutoTimers();if(!autoPlaying||!filtered.length||mode!=='card'){stopAuto();return}
 autoDeadline=Date.now()+AUTO_DELAY;updateAutoStatus();autoTicker=setInterval(updateAutoStatus,200);
 autoTimer=setTimeout(()=>{clearAutoTimers();stop();let movedToNext=false;if(back){index=(index+1)%filtered.length;back=false;movedToNext=true}else back=true;render();if(movedToNext)speak(filtered[index],false);scheduleAuto()},AUTO_DELAY);
}
function toggleAuto(){
 if(autoPlaying){stopAuto();stop();return}
 if(!filtered.length)return;mode='card';back=false;autoPlaying=true;render();speak(filtered[index],false);scheduleAuto();
}

function toggleStar(id){stars.has(id)?stars.delete(id):stars.add(id);try{localStorage.setItem('jp-japanese-sentences-300-stars-v1',JSON.stringify([...stars]))}catch{$('message').textContent='이 브라우저에서는 별표를 영구 저장할 수 없습니다.'}if(onlyStars)apply();else render()}
function apply(){stopAuto();stop();const q=$('search').value.toLowerCase().trim();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('number').value||c.no==$('number').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;render()}
function render(){const c=filtered[index];$('starFilter').textContent='★ 별표 ('+stars.size+')';$('starFilter').classList.toggle('active',onlyStars);$('starFilter').setAttribute('aria-pressed',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('star').hidden=!c||mode!=='card';$('speak').hidden=!c||mode!=='card';$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`${c.title} · ${c.no}번`:'';if(!c)return;
$('star').textContent=stars.has(c.id)?'★':'☆';$('star').setAttribute('aria-pressed',stars.has(c.id));$('card').classList.toggle('back',back);$('card').innerHTML=`<div class="cardTop"><span>${c.no} | ${esc(c.title)}</span><span>${back?'한국어 번역':'일본어 원문'}</span></div><div class="sentence ${(back?c.a:c.q).length>55?'long':''}" lang="${back?'ko':'ja'}">${ruby(back?c.ar:c.qr)}</div>${back?translation(c):''}<div class="hint">${back?'다시 탭하면 일본어 원문으로 돌아갑니다':'탭하여 한국어 번역 확인'}</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';
if(mode==='list')$('listView').innerHTML=filtered.map(c=>`<article class="listitem"><div class="row"><h2>${c.no} | ${esc(c.title)}</h2><button class="star" data-star="${c.id}" aria-label="${c.no}번 별표" aria-pressed="${stars.has(c.id)}">${stars.has(c.id)?'★':'☆'}</button><button data-q="${c.id}">듣기</button></div><p class="listSentence" lang="ja">${ruby(c.qr)}</p><p class="listSentence" lang="ko">${ruby(c.ar)}</p>${translation(c)}</article>`).join('')}
function flip(){if(!filtered.length)return;stop();back=!back;render();if(autoPlaying)scheduleAuto()}
function move(n){if(!filtered.length)return;stop();index=(index+n+filtered.length)%filtered.length;back=false;render();if(autoPlaying)scheduleAuto()}
$('autoPlay').onclick=toggleAuto;$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('star').onclick=()=>toggleStar(filtered[index].id);$('speak').onclick=()=>speak(filtered[index],false);$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{stopAuto();stop();mode='card';render()};$('listMode').onclick=()=>{stopAuto();stop();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('number').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=apply;$('shuffle').onclick=()=>{stopAuto();stop();for(let i=filtered.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;back=false;render()};$('listView').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.star)toggleStar(+b.dataset.star);else speak(DATA.find(c=>c.id===+(b.dataset.q||b.dataset.a)),!!b.dataset.a)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)||mode!=='card')return;if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'){e.preventDefault();move(1)}});for(let i=1;i<=DATA.length;i++){const v=String(i).padStart(3,'0');$('number').add(new Option(v+'번',v))}render();updateAutoStatus();
</script></html>
