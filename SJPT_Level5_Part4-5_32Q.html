<script>
const QUESTION_RUBY={"1":"<ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>家<rt>いえ</rt></ruby>を<ruby>出<rt>で</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>何<rt>なに</rt></ruby>をしていますか。<ruby>順番<rt>じゅんばん</rt></ruby>が<ruby>分<rt>わ</rt></ruby>かるように<ruby>話<rt>はな</rt></ruby>してください。","2":"<ruby>平日<rt>へいじつ</rt></ruby>と<ruby>休日<rt>きゅうじつ</rt></ruby>は、<ruby>夜<rt>よる</rt></ruby>の<ruby>過<rt>す</rt></ruby>ごし<ruby>方<rt>かた</rt></ruby>がどう<ruby>違<rt>ちが</rt></ruby>いますか。それぞれ<ruby>何<rt>なに</rt></ruby>をしているか<ruby>話<rt>はな</rt></ruby>してください。","3":"<ruby>休日<rt>きゅうじつ</rt></ruby>の<ruby>予定<rt>よてい</rt></ruby>は、<ruby>前<rt>まえ</rt></ruby>もって<ruby>決<rt>き</rt></ruby>めたほうがいいと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>と<ruby>例<rt>れい</rt></ruby>を<ruby>挙<rt>あ</rt></ruby>げて<ruby>話<rt>はな</rt></ruby>してください。","4":"<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>短<rt>みじか</rt></ruby>い<ruby>休憩<rt>きゅうけい</rt></ruby>を<ruby>取<rt>と</rt></ruby>ることは<ruby>大切<rt>たいせつ</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>自分<rt>じぶん</rt></ruby>の<ruby>考<rt>かんが</rt></ruby>えと、<ruby>休憩<rt>きゅうけい</rt></ruby>の<ruby>取<rt>と</rt></ruby>り<ruby>方<rt>かた</rt></ruby>を<ruby>話<rt>はな</rt></ruby>してください。","5":"ふだん、どこで<ruby>食料<rt>しょくりょう</rt></ruby><ruby>品<rt>ひん</rt></ruby>を<ruby>買<rt>か</rt></ruby>いますか。<ruby>買<rt>か</rt></ruby>う<ruby>物<rt>もの</rt></ruby>や<ruby>店<rt>みせ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶ<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","6":"<ruby>家<rt>いえ</rt></ruby>でよく<ruby>作<rt>つく</rt></ruby>る<ruby>料理<rt>りょうり</rt></ruby>は<ruby>何<rt>なん</rt></ruby>ですか。<ruby>作<rt>つく</rt></ruby>り<ruby>方<rt>かた</rt></ruby>を<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>話<rt>はな</rt></ruby>してください。","7":"<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>用意<rt>ようい</rt></ruby>は、<ruby>家<rt>いえ</rt></ruby>で<ruby>作<rt>つく</rt></ruby>るほうがいいと<ruby>思<rt>おも</rt></ruby>いますか、<ruby>外<rt>そと</rt></ruby>で<ruby>食<rt>た</rt></ruby>べるほうがいいと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>を<ruby>挙<rt>あ</rt></ruby>げて<ruby>話<rt>はな</rt></ruby>してください。","8":"<ruby>買い物<rt>かいもの</rt></ruby>に<ruby>行<rt>い</rt></ruby>く<ruby>前<rt>まえ</rt></ruby>に、<ruby>買<rt>か</rt></ruby>う<ruby>物<rt>もの</rt></ruby>をメモしたほうがいいと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>と、メモの<ruby>使<rt>つか</rt></ruby>い<ruby>方<rt>かた</rt></ruby>を<ruby>話<rt>はな</rt></ruby>してください。","9":"<ruby>今<rt>いま</rt></ruby><ruby>住<rt>す</rt></ruby>んでいる<ruby>町<rt>まち</rt></ruby>は、どんな<ruby>所<rt>ところ</rt></ruby>ですか。<ruby>近<rt>ちか</rt></ruby>くにある<ruby>建物<rt>たてもの</rt></ruby>や、<ruby>気<rt>き</rt></ruby>に<ruby>入<rt>はい</rt></ruby>っている<ruby>点<rt>てん</rt></ruby>を<ruby>話<rt>はな</rt></ruby>してください。","10":"<ruby>家<rt>いえ</rt></ruby>でゆっくり<ruby>過<rt>す</rt></ruby>ごしたいとき、<ruby>何<rt>なに</rt></ruby>をしていますか。<ruby>場所<rt>ばしょ</rt></ruby>や<ruby>過<rt>す</rt></ruby>ごし<ruby>方<rt>かた</rt></ruby>を<ruby>話<rt>はな</rt></ruby>してください。","11":"<ruby>住<rt>す</rt></ruby>む<ruby>家<rt>いえ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶとき、<ruby>駅<rt>えき</rt></ruby>に<ruby>近<rt>ちか</rt></ruby>いことは<ruby>大切<rt>たいせつ</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。ほかに<ruby>大切<rt>たいせつ</rt></ruby>にしたい<ruby>点<rt>てん</rt></ruby>も<ruby>含<rt>ふく</rt></ruby>めて<ruby>話<rt>はな</rt></ruby>してください。","12":"<ruby>近所<rt>きんじょ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>にあいさつをすることは<ruby>大切<rt>たいせつ</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>と、どんな<ruby>場面<rt>ばめん</rt></ruby>であいさつしたいかを<ruby>話<rt>はな</rt></ruby>してください。","13":"<ruby>休日<rt>きゅうじつ</rt></ruby>は、ふだん<ruby>何<rt>なに</rt></ruby>をしていますか。<ruby>好<rt>す</rt></ruby>きな<ruby>過<rt>す</rt></ruby>ごし<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてください。","14":"<ruby>趣味<rt>しゅみ</rt></ruby>の<ruby>教室<rt>きょうしつ</rt></ruby>やイベントに<ruby>参加<rt>さんか</rt></ruby>したことがありますか。そこで<ruby>何<rt>なに</rt></ruby>をしたか<ruby>話<rt>はな</rt></ruby>してください。","15":"<ruby>休日<rt>きゅうじつ</rt></ruby>は、<ruby>家<rt>いえ</rt></ruby>で<ruby>過<rt>す</rt></ruby>ごすのと<ruby>外<rt>そと</rt></ruby>へ<ruby>出<rt>で</rt></ruby>かけるのと、どちらがいいと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","16":"<ruby>忙<rt>いそが</rt></ruby>しい<ruby>人<rt>ひと</rt></ruby>にも、<ruby>趣味<rt>しゅみ</rt></ruby>の<ruby>時間<rt>じかん</rt></ruby>は<ruby>必要<rt>ひつよう</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。あなたの<ruby>考<rt>かんが</rt></ruby>えを<ruby>話<rt>はな</rt></ruby>してください。","17":"<ruby>次<rt>つぎ</rt></ruby>の<ruby>休<rt>やす</rt></ruby>みに、どこへ<ruby>旅行<rt>りょこう</rt></ruby>したいですか。そこで<ruby>何<rt>なに</rt></ruby>をしたいですか。","18":"<ruby>電車<rt>でんしゃ</rt></ruby>やバスで<ruby>知<rt>し</rt></ruby>らない<ruby>場所<rt>ばしょ</rt></ruby>へ<ruby>行<rt>い</rt></ruby>くとき、<ruby>何<rt>なに</rt></ruby>を<ruby>調<rt>しら</rt></ruby>べますか。<ruby>準備<rt>じゅんび</rt></ruby>することを<ruby>話<rt>はな</rt></ruby>してください。","19":"<ruby>旅行<rt>りょこう</rt></ruby>では、<ruby>車<rt>くるま</rt></ruby>と<ruby>電車<rt>でんしゃ</rt></ruby>のどちらを<ruby>使<rt>つか</rt></ruby>いたいですか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","20":"<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に、<ruby>一<rt>いち</rt></ruby><ruby>日<rt>にち</rt></ruby>の<ruby>予定<rt>よてい</rt></ruby>を<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>決<rt>き</rt></ruby>めたほうがいいと<ruby>思<rt>おも</rt></ruby>いますか。あなたの<ruby>考<rt>かんが</rt></ruby>えを<ruby>話<rt>はな</rt></ruby>してください。","21":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えるために、どんなことをしていますか。ふだんの<ruby>勉強<rt>べんきょう</rt></ruby>のしかたを<ruby>話<rt>はな</rt></ruby>してください。","22":"<ruby>勉強<rt>べんきょう</rt></ruby>で<ruby>分<rt>わ</rt></ruby>からないことがあったら、どうしますか。<ruby>自分<rt>じぶん</rt></ruby>のやり<ruby>方<rt>かた</rt></ruby>を<ruby>話<rt>はな</rt></ruby>してください。","23":"<ruby>勉強<rt>べんきょう</rt></ruby>は、<ruby>一人<rt>ひとり</rt></ruby>でするのと<ruby>友達<rt>ともだち</rt></ruby>とするのと、どちらがいいと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","24":"<ruby>仕事<rt>しごと</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>めてからも、<ruby>新<rt>あたら</rt></ruby>しいことを<ruby>勉強<rt>べんきょう</rt></ruby>する<ruby>必要<rt>ひつよう</rt></ruby>があると<ruby>思<rt>おも</rt></ruby>いますか。あなたの<ruby>考<rt>かんが</rt></ruby>えを<ruby>話<rt>はな</rt></ruby>してください。","25":"あなたはスマートフォンをどんなことに<ruby>使<rt>つか</rt></ruby>っていますか。よく<ruby>使<rt>つか</rt></ruby>う<ruby>場面<rt>ばめん</rt></ruby>について<ruby>話<rt>はな</rt></ruby>してください。","26":"スマートフォンを<ruby>使<rt>つか</rt></ruby>う<ruby>時間<rt>じかん</rt></ruby>について、<ruby>気<rt>き</rt></ruby>を<ruby>付<rt>つ</rt></ruby>けていることはありますか。<ruby>自分<rt>じぶん</rt></ruby>の<ruby>使<rt>つか</rt></ruby>い<ruby>方<rt>かた</rt></ruby>を<ruby>説明<rt>せつめい</rt></ruby>してください。","27":"<ruby>学校<rt>がっこう</rt></ruby>で、<ruby>授業<rt>じゅぎょう</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>のスマートフォンの<ruby>使<rt>つか</rt></ruby>い<ruby>方<rt>かた</rt></ruby>を<ruby>決<rt>き</rt></ruby>めることに<ruby>賛成<rt>さんせい</rt></ruby>ですか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","28":"<ruby>家族<rt>かぞく</rt></ruby>や<ruby>友達<rt>ともだち</rt></ruby>と<ruby>食事<rt>しょくじ</rt></ruby>をするとき、スマートフォンを<ruby>使<rt>つか</rt></ruby>わない<ruby>時間<rt>じかん</rt></ruby>を<ruby>作<rt>つく</rt></ruby>ることは<ruby>必要<rt>ひつよう</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","29":"<ruby>友達<rt>ともだち</rt></ruby>と<ruby>会<rt>あ</rt></ruby>う<ruby>約束<rt>やくそく</rt></ruby>をするとき、どんなことを<ruby>確認<rt>かくにん</rt></ruby>しますか。いつもしていることを<ruby>説明<rt>せつめい</rt></ruby>してください。","30":"<ruby>最近<rt>さいきん</rt></ruby>、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>何<rt>なん</rt></ruby>かを<ruby>手伝<rt>てつだ</rt></ruby>ってもらいましたか。そのときのことを<ruby>話<rt>はな</rt></ruby>してください。","31":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>写<rt>うつ</rt></ruby>っている<ruby>写真<rt>しゃしん</rt></ruby>をSNSに<ruby>載<rt>の</rt></ruby>せる<ruby>前<rt>まえ</rt></ruby>に、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>聞<rt>き</rt></ruby>く<ruby>必要<rt>ひつよう</rt></ruby>があると<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。","32":"<ruby>人<rt>ひと</rt></ruby>に<ruby>助<rt>たす</rt></ruby>けてもらったとき、<ruby>言葉<rt>ことば</rt></ruby>でお<ruby>礼<rt>れい</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>えることは<ruby>大切<rt>たいせつ</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>いますか。<ruby>理由<rt>りゆう</rt></ruby>も<ruby>話<rt>はな</rt></ruby>してください。"};
const KOREAN={"1":"평일에는 7시에 일어나 가족과 아침을 먹습니다. 식사한 뒤 옷을 갈아입고 외출할 준비를 합니다. 아침에는 시간이 없어서 전날 밤에 가방을 준비합니다. 집을 나서기 전에 일정도 확인합니다.","2":"평일 저녁에는 돌아온 뒤 저녁을 먹습니다. 아침이 이르기 때문에 11시까지 자려고 합니다. 휴일 저녁에는 좋아하는 영화를 봅니다. 다음 날 일정이 없을 때는 조금 늦게 잡니다.","3":"중요한 일정만 미리 정해 두는 것이 좋다고 생각합니다. 친구와 점심을 먹는 날은 시간과 가게를 상의해 두면 안심이 됩니다. 기다리는 시간이 길면 곤란하므로 필요하다면 가게 예약도 해 둡니다. 하지만 휴일에는 쉬는 시간도 필요하므로 저는 일정을 너무 많이 잡지 않으려고 합니다. 일정이 없는 시간에는 그날 기분에 맞춰 좋아하는 일을 하고 싶습니다.","4":"짧은 휴식은 기분 전환을 위해 중요하다고 생각합니다. 저는 집에서 공부할 때 30분 정도마다 한 번 쉬려고 합니다. 앉아 있는 시간이 길어서 조금 걷거나 바깥 공기를 마시기도 합니다. 다만 휴식 중에 동영상을 보면 무심코 오래 보게 될 때가 있습니다. 그래서 먼저 쉬는 시간을 정하고 끝나면 바로 공부로 돌아갑니다.","5":"식료품은 역 앞에 있는 슈퍼마켓에서 삽니다. 퇴근길에 갈 수 있어서 편리합니다. 채소나 고기 코너에서 그날 저녁 메뉴를 생각합니다. 가격도 보고 예산에 맞는 것을 고릅니다.","6":"자주 만드는 것은 채소와 달걀 수프입니다. 먼저 당근과 양파를 작게 자릅니다. 물과 함께 냄비에 넣고 부드러워질 때까지 끓입니다. 마지막에 달걀을 넣고 소금으로 간하면 완성입니다.","7":"저는 시간이 있는 날에는 직접 요리하는 편이 좋다고 생각합니다. 사용하는 식재료와 양을 스스로 정할 수 있기 때문입니다. 예를 들어 채소를 많이 넣거나 다음 날 먹을 몫도 함께 만들 수 있습니다. 다만 피곤한 날에는 요리와 뒷정리가 힘들다고 느낍니다. 매일 직접 요리할 필요는 없으므로 바쁜 날에는 밖에서 먹어도 좋다고 생각합니다.","8":"저는 살 것을 메모한 뒤 가게에 가는 것이 좋다고 생각합니다. 무엇을 살지 정해 두면 매장에서 오래 망설이지 않고 장을 볼 수 있습니다. 예를 들어 냉장고를 보고 부족한 식재료를 스마트폰에 적어 둡니다. 다만 메모에 없는 물건이라도 저렴하고 사용할 예정이 있다면 사고 싶습니다. 필요한 물건을 확인하면서 예산 안에서 살 것을 바꿔도 좋다고 생각합니다.","9":"제가 사는 동네는 역에서 조금 먼 곳에 있습니다. 하지만 집 근처에 버스 정류장이 있어서 출퇴근에는 불편하지 않습니다. 걸어서 갈 수 있는 슈퍼마켓도 있습니다. 조용하고 공원도 많아서 저에게는 살기 좋은 동네입니다.","10":"쉬는 날에는 제 방에서 느긋하게 지냅니다. 먼저 책상 위를 정리하고 책을 준비합니다. 그다음 차를 마시면서 좋아하는 책을 읽습니다. 햇볕이 잘 들어서 낮에는 전등을 켜지 않습니다.","11":"저는 매일 전철을 이용하므로 역에서 가까운 집이 좋다고 생각합니다. 통근 시간이 짧으면 아침에도 여유 있게 준비할 수 있습니다. 다만 역에서 가까워도 밤에 자동차 소리가 큰 곳은 피하고 싶습니다. 집을 볼 때는 집세뿐만 아니라 방의 밝기와 바깥 소리도 확인합니다. 출퇴근에 편리하고 집에서도 편안히 쉴 수 있는 곳을 고르고 싶습니다.","12":"저는 이웃에게 짧게 인사하는 것이 중요하다고 생각합니다. 얼굴을 익히면 용무가 있을 때도 말을 걸기 쉽기 때문입니다. 예를 들어 동네 청소를 할 때는 작업 전에 인사합니다. 그 뒤 청소하면서 날씨 이야기를 해도 좋다고 생각합니다. 하지만 바쁜 사람에게는 오래 말을 걸지 않고 웃는 얼굴로 인사만 합니다.","13":"휴일에는 가까운 공원을 산책하는 것을 좋아합니다. 아침 공원은 조용해서 기분 전환에 좋습니다. 걷고 난 뒤에는 집에서 좋아하는 음악을 듣습니다. 저에게는 쇼핑보다 산책이 더 즐겁습니다.","14":"친구와 요리 교실에 참가한 적이 있습니다. 그때는 채소 수프를 만들었습니다. 처음이라 채소를 자르는 데 시간이 걸렸습니다. 하지만 친구와 함께 요리할 수 있어서 즐거웠습니다.","15":"저는 날씨가 좋은 휴일에는 가까운 공원에 나가고 싶습니다. 계속 집에 있는 것보다 바깥 풍경을 보는 편이 즐겁기 때문입니다. 예를 들어 공원을 걸으며 마음에 든 꽃 사진을 찍습니다. 친구와 함께라면 걸으면서 여러 이야기도 할 수 있습니다. 하지만 피곤한 날에는 동네를 조금 산책하고 나머지는 집에서 쉬고 싶습니다.","16":"바쁜 사람도 무리하지 않고 취미를 즐겼으면 합니다. 좋아하는 일이 있으면 휴일의 즐거움이 생기기 때문입니다. 저는 요리가 취미라서 휴일에 새로운 요리를 만든 적이 있습니다. 잘 만들어져서 기뻤지만 준비에는 시간이 걸렸습니다. 바쁜 날에는 좋아하는 음악을 한 곡 듣는 등 짧은 시간에 즐길 수 있는 방법도 좋다고 생각합니다.","17":"다음 휴일에는 친구와 바다 근처 마을에 갈 생각입니다. 아침 전철을 타고 점심 전에 도착하고 싶습니다. 날씨가 좋으면 바닷가를 걷겠습니다. 비 오는 날에는 미술관에 가고 기념품도 사겠습니다.","18":"처음 가는 곳에 갈 때는 전철 시간을 알아봅니다. 다음으로 환승역과 출구를 지도에서 봅니다. 짐이 많은 날에는 역에서 버스를 탈 생각입니다. 길을 잃으면 무리해서 걷지 않고 사람에게 묻습니다.","19":"저는 가고 싶은 곳이 역에서 가깝다면 전철을 선택하고 싶습니다. 운전하지 않아도 되므로 친구와 이야기하면서 풍경을 즐길 수 있습니다. 전철을 탈 때는 창가 좌석을 예약할 생각입니다. 하지만 역에서 먼 곳에 가는 날에는 자동차가 편리하다고 생각합니다. 짐의 양과 가고 싶은 곳을 고려해 이용할 교통수단을 정하고 싶습니다.","20":"하루 일정은 너무 세세하게 정하지 않는 편이 좋다고 생각합니다. 마음에 드는 가게를 발견했을 때 일정을 바꿔 들어가고 싶기 때문입니다. 다만 호텔과 돌아오는 전철은 출발 전에 예약할 생각입니다. 점심을 먹을 장소 등은 친구와 그 자리에서 상의합니다. 걷다가 피곤하면 일정 하나를 줄이고 쉬는 시간도 갖고 싶습니다.","21":"일본어로 말하기 위해 매일 조금씩 연습합니다. 아침에는 새로운 단어 세 개를 노트에 씁니다. 저녁에는 그 단어를 사용해서 짧은 이야기를 만들어 봅니다. 목소리를 녹음하면 제 말하는 방식을 확인할 수 있습니다.","22":"모르는 것이 있으면 먼저 책에서 찾아봅니다. 예문을 읽고 저도 같은 방식으로 해 봅니다. 할 수 없을 때는 어려웠던 부분을 선생님께 묻습니다. 혼자 오래 고민하는 것보다 빨리 묻는 것이 좋다고 생각합니다.","23":"저는 무엇을 공부하느냐에 따라 공부 방법을 바꾸고 싶습니다. 회화 연습이라면 친구와 함께 하는 편이 좋다고 생각합니다. 예를 들어 쇼핑 상황을 정하고 점원과 손님 역할이 되어 말해 봅니다. 반면 새로운 단어를 외울 때는 조용한 방에서 집중하고 싶습니다. 친구와 연습하기 전에 혼자 준비하는 시간도 만들고 싶습니다.","24":"일을 시작한 뒤에도 필요한 것은 조금씩 배우고 싶습니다. 스스로 할 수 있는 일을 늘리기 위해 공부를 계속하면 좋다고 생각합니다. 예를 들어 새로운 도구를 사용할 때는 설명을 읽은 뒤 시험해 봅니다. 모르는 부분은 선배에게 상의하고 사용법을 확인하고 싶습니다. 다만 매일 오래 공부하기보다는 쉬는 시간도 중요하게 여기고 싶습니다.","25":"스마트폰은 가족과 연락하거나 쇼핑할 때 사용합니다. 쇼핑할 때는 가족에게 필요한 물건을 묻습니다. 돌아오는 전철에서는 일본어 음성도 듣습니다. 다만 너무 많이 사용하지 않도록 한 번에 보는 시간을 정해 두고 있습니다.","26":"동영상을 보기 전에 그만 볼 시간을 정합니다. 전에는 동영상을 너무 많이 봐서 아침에 일어나는 것이 힘들었습니다. 지금은 밤 10시에 알람을 울립니다. 그 뒤에는 책상에 놓고 침대에서는 보지 않으려고 합니다.","27":"학교에서 스마트폰 사용 방법을 정하는 것에 찬성합니다. 수업 중에 자유롭게 사용하면 다른 화면이 신경 쓰여 선생님의 말씀을 듣기 어려워진다고 생각하기 때문입니다. 예를 들어 조사할 때만 책상 위에 꺼내고 그 외에는 가방에 넣습니다. 다만 가족에게서 급한 연락이 왔을 때는 선생님께 말씀드리고 사용해도 좋다고 생각합니다. 무엇을 위한 규칙인지 모두 함께 이야기하는 것도 중요합니다.","28":"식사 중에는 스마트폰을 사용하지 않고 이야기하는 시간을 만들고 싶습니다. 가까이 있는 사람의 이야기를 듣는 것도 식사의 즐거움이라고 생각하기 때문입니다. 예를 들어 음식이 나오면 스마트폰을 가방에 넣습니다. 약속 관련 연락이 있을 때는 먼저 상대에게 말한 뒤 확인합니다. 상대를 너무 오래 기다리게 하지 않도록 보는 시간을 짧게 하고 싶습니다.","29":"친구를 만나기 전에 시간과 장소를 메시지로 확인합니다. 처음 가는 장소라면 지도를 보내 달라고 합니다. 늦을 때는 일찍 연락해야 합니다. 몇 분 정도 늦는지도 짧게 전합니다.","30":"지난달 친구에게 일본어 작문을 봐 달라고 했습니다. 같은 단어를 여러 번 사용해서 다른 표현을 알려 주었습니다. 설명이 이해하기 쉬워서 정말 도움이 되었습니다. 나중에 감사 인사를 하고 친구의 이사를 도왔습니다.","31":"친구가 나온 사진은 게시하기 전에 본인에게 물어볼 필요가 있습니다. 사진에 나온 얼굴이나 장소를 다른 사람에게 보여 주고 싶지 않은 경우도 있다고 생각하기 때문입니다. 예를 들어 함께 찍은 사진을 보내고 SNS에 올려도 되는지 묻습니다. 싫다고 하면 저만 나온 사진을 다시 고릅니다. 허락을 받을 때 어디에 올릴지도 전하고 싶습니다.","32":"도움을 받았다면 어떤 점에서 도움이 되었는지도 말로 전하고 싶습니다. 감사하다는 말만 해도 좋지만 이유도 전하면 마음이 더 잘 전달된다고 생각합니다. 예를 들어 비 오는 날 역까지 마중 나와 주었다면 정말 도움이 되었다고 전합니다. 다만 감사의 뜻으로 비싼 물건을 사야 한다고는 생각하지 않습니다. 나중에 만났을 때도 짧게 감사 인사를 전하고 싶습니다."};
const DATA=[{"id":1,"code":"1-4A","part":4,"round":"1A","topic":"일상생활","q":"毎朝、家を出る前に何をしていますか。順番が分かるように話してください。","qko":"매일 아침 집을 나서기 전에 무엇을 합니까? 순서를 알 수 있도록 말해 주십시오.","a":"平日は七時に起きて、家族と朝ご飯を食べます。食べたあとで、服を着替えて出かける準備をします。朝は時間がないので、前の晩にかばんを用意します。家を出る前に、予定も確認します。"},{"id":2,"code":"1-4B","part":4,"round":"1B","topic":"일상생활","q":"平日と休日は、夜の過ごし方がどう違いますか。それぞれ何をしているか話してください。","qko":"평일과 휴일은 저녁을 보내는 방법이 어떻게 다릅니까? 각각 무엇을 하는지 말해 주십시오.","a":"平日の夜は、帰ったあとで晩ご飯を食べます。朝が早いので、十一時までに寝るようにしています。休日の夜は、好きな映画を見ます。次の日に予定がないときは、少し遅く寝ます。"},{"id":3,"code":"1-5A","part":5,"round":"1A","topic":"일상생활","q":"休日の予定は、前もって決めたほうがいいと思いますか。理由と例を挙げて話してください。","qko":"휴일 계획은 미리 정하는 편이 좋다고 생각합니까? 이유와 예를 들어 말해 주십시오.","a":"大事な予定だけ、前もって決めておくといいと思います。友達と昼ご飯を食べる日は、時間や店を相談しておくと安心です。待つ時間が長いと困るので、必要なら店の予約もしておきます。でも、休日は休む時間も必要なので、私は予定を入れすぎないようにしています。予定のない時間には、その日の気分に合わせて好きなことをしたいです。"},{"id":4,"code":"1-5B","part":5,"round":"1B","topic":"일상생활","q":"毎日、短い休憩を取ることは大切だと思いますか。自分の考えと、休憩の取り方を話してください。","qko":"매일 짧은 휴식을 취하는 것은 중요하다고 생각합니까? 자신의 생각과 휴식하는 방법을 말해 주십시오.","a":"短い休憩は、気分を変えるために大切だと思います。私は家で勉強するとき、三十分ぐらいで一度休むようにしています。座っている時間が長いので、少し歩いたり外の空気を吸ったりします。ただ、休憩中に動画を見ると、つい長く見てしまうことがあります。そのため、先に休む時間を決め、終わったらすぐ勉強に戻ります。"},{"id":5,"code":"2-4A","part":4,"round":"2A","topic":"식사와 쇼핑","q":"ふだん、どこで食料品を買いますか。買う物や店を選ぶ理由も話してください。","qko":"평소에 어디에서 식료품을 삽니까? 사는 물건과 가게를 선택하는 이유도 말해 주십시오.","a":"食料品は、駅の前にあるスーパーで買います。仕事の帰りに行くことができるので、便利です。野菜や肉の売り場で、その日の晩ご飯を考えます。値段も見て、予算に合う物を選びます。"},{"id":6,"code":"2-4B","part":4,"round":"2B","topic":"식사와 쇼핑","q":"家でよく作る料理は何ですか。作り方を簡単に話してください。","qko":"집에서 자주 만드는 요리는 무엇입니까? 만드는 방법을 간단히 말해 주십시오.","a":"よく作るのは、野菜と卵のスープです。まず、にんじんと玉ねぎを小さく切ります。水と一緒になべに入れて、柔らかくなるまで煮ます。最後に卵を入れて、塩で味をつけると出来上がりです。"},{"id":7,"code":"2-5A","part":5,"round":"2A","topic":"식사와 쇼핑","q":"食事の用意は、家で作るほうがいいと思いますか、外で食べるほうがいいと思いますか。理由を挙げて話してください。","qko":"식사는 집에서 만드는 편이 좋다고 생각합니까, 밖에서 먹는 편이 좋다고 생각합니까? 이유를 들어 말해 주십시오.","a":"私は、時間がある日は、自炊をするほうがいいと思います。使う食材や量を自分で決めることができるからです。例えば、野菜を多く入れたり、次の日の分も一緒に作ったりできます。ただ、疲れている日は、料理と片づけが大変だと感じます。毎日自炊をする必要はないので、忙しい日は外で食べてもいいと思います。"},{"id":8,"code":"2-5B","part":5,"round":"2B","topic":"식사와 쇼핑","q":"買い物に行く前に、買う物をメモしたほうがいいと思いますか。理由と、メモの使い方を話してください。","qko":"쇼핑하러 가기 전에 살 것을 메모하는 편이 좋다고 생각합니까? 이유와 메모를 사용하는 방법을 말해 주십시오.","a":"私は、買う物をメモしてから店に行くといいと思います。何を買うか決めておけば、売り場で長く迷わずに買い物ができます。例えば、冷蔵庫を見て、足りない食材をスマートフォンに書いておきます。ただ、メモにない物でも、安くて使う予定があれば買いたいです。必要な物を確認しながら、予算の中で買う物を変えてもいいと思います。"},{"id":9,"code":"3-4A","part":4,"round":"3A","topic":"주거와 생활","q":"今住んでいる町は、どんな所ですか。近くにある建物や、気に入っている点を話してください。","qko":"지금 사는 동네는 어떤 곳입니까? 근처에 있는 건물과 마음에 드는 점을 말해 주십시오.","a":"私の住んでいる町は、駅から少し遠い所にあります。でも、家の近くにバス停があるので、通勤には困りません。歩いて行けるスーパーもあります。静かで公園も多いので、私には住みやすい町です。"},{"id":10,"code":"3-4B","part":4,"round":"3B","topic":"주거와 생활","q":"家でゆっくり過ごしたいとき、何をしていますか。場所や過ごし方を話してください。","qko":"집에서 느긋하게 보내고 싶을 때 무엇을 합니까? 장소와 시간을 보내는 방법을 말해 주십시오.","a":"休みの日は、自分の部屋でゆっくり過ごします。まず、机の上を片づけて本を用意します。そのあとで、お茶を飲みながら好きな本を読みます。日当たりがいいので、昼間は電気をつけません。"},{"id":11,"code":"3-5A","part":5,"round":"3A","topic":"주거와 생활","q":"住む家を選ぶとき、駅に近いことは大切だと思いますか。ほかに大切にしたい点も含めて話してください。","qko":"살 집을 고를 때 역에서 가까운 것은 중요하다고 생각합니까? 그 밖에 중요하게 생각하는 점도 포함해서 말해 주십시오.","a":"私は毎日電車を使うので、駅に近い家がいいと思います。通勤時間が短いと、朝もゆっくり準備ができます。ただ、駅に近くても、夜に車の音が大きい所は避けたいです。家を見るときは、家賃だけでなく、部屋の明るさや外の音も確認します。通勤に便利で、家でも落ち着いて休める所を選びたいです。"},{"id":12,"code":"3-5B","part":5,"round":"3B","topic":"주거와 생활","q":"近所の人にあいさつをすることは大切だと思いますか。理由と、どんな場面であいさつしたいかを話してください。","qko":"이웃에게 인사하는 것은 중요하다고 생각합니까? 이유와 어떤 상황에서 인사하고 싶은지 말해 주십시오.","a":"私は、近所の人に短くあいさつをすることは大切だと思います。顔を覚えると、用事があるときにも話しかけやすいからです。例えば、町の掃除では、作業の前にあいさつをします。そのあと、掃除をしながら天気の話をしてもいいと思います。でも、急いでいる人には長く話しかけず、笑顔であいさつするだけにします。"},{"id":13,"code":"4-4A","part":4,"round":"4A","topic":"여가와 취미","q":"休日は、ふだん何をしていますか。好きな過ごし方を教えてください。","qko":"휴일에는 평소 무엇을 하나요? 좋아하는 휴일 보내는 방법을 알려 주세요.","a":"休日は、近くの公園を散歩するのが好きです。朝の公園は静かで、いい気分転換になります。歩いたあとは、家で好きな音楽を聞きます。私には、買い物より散歩のほうが楽しいです。"},{"id":14,"code":"4-4B","part":4,"round":"4B","topic":"여가와 취미","q":"趣味の教室やイベントに参加したことがありますか。そこで何をしたか話してください。","qko":"취미 교실이나 행사에 참가한 적이 있나요? 그곳에서 무엇을 했는지 이야기해 주세요.","a":"友達と料理教室に参加したことがあります。そのときは、野菜のスープを作りました。初めてで、野菜を切るのに時間がかかりました。でも、友達と一緒に料理ができて楽しかったです。"},{"id":15,"code":"4-5A","part":5,"round":"4A","topic":"여가와 취미","q":"休日は、家で過ごすのと外へ出かけるのと、どちらがいいと思いますか。理由も話してください。","qko":"휴일에는 집에서 지내는 것과 밖에 나가는 것 중 어느 쪽이 좋다고 생각하나요? 이유도 이야기해 주세요.","a":"私は、天気のいい休日は近くの公園へ出かけたいです。ずっと家にいるより、外の景色を見るほうが楽しいからです。例えば、公園を歩いて、気に入った花の写真を撮ります。友達と一緒なら、歩きながらいろいろな話もできます。でも、疲れている日は近所を少し散歩して、あとは家で休みたいです。"},{"id":16,"code":"4-5B","part":5,"round":"4B","topic":"여가와 취미","q":"忙しい人にも、趣味の時間は必要だと思いますか。あなたの考えを話してください。","qko":"바쁜 사람에게도 취미 시간이 필요하다고 생각하나요? 자신의 생각을 이야기해 주세요.","a":"忙しい人にも、無理をせず趣味を楽しんでほしいです。好きなことがあると、休みの日の楽しみができるからです。私は料理が趣味で、休日に新しい料理を作ったことがあります。うまくできてうれしかったですが、準備には時間がかかりました。忙しい日は、好きな音楽を一曲聞くなど、短い時間で楽しめる方法でもいいと思います。"},{"id":17,"code":"5-4A","part":4,"round":"5A","topic":"여행과 교통","q":"次の休みに、どこへ旅行したいですか。そこで何をしたいですか。","qko":"다음 휴일에 어디로 여행 가고 싶나요? 그곳에서 무엇을 하고 싶나요?","a":"次の休みは、友達と海の近くの町へ行くつもりです。朝の電車に乗って、昼前に着きたいです。天気がよかったら、海の近くを歩きます。雨の日は美術館に行き、お土産も買います。"},{"id":18,"code":"5-4B","part":4,"round":"5B","topic":"여행과 교통","q":"電車やバスで知らない場所へ行くとき、何を調べますか。準備することを話してください。","qko":"전철이나 버스로 모르는 곳에 갈 때 무엇을 알아보나요? 준비할 일을 이야기해 주세요.","a":"初めての場所へ行くときは、電車の時間を調べます。次に、乗り換えの駅と出口を地図で見ます。荷物が多い日は、駅からバスに乗るつもりです。道に迷ったら、無理に歩かず人に聞きます。"},{"id":19,"code":"5-5A","part":5,"round":"5A","topic":"여행과 교통","q":"旅行では、車と電車のどちらを使いたいですか。理由も話してください。","qko":"여행할 때 자동차와 기차 중 어느 쪽을 이용하고 싶나요? 이유도 이야기해 주세요.","a":"私は、行きたい場所が駅に近いなら、電車を選びたいです。運転をしなくていいので、友達と話しながら景色を楽しめます。電車に乗るときは、窓の近くの席を予約するつもりです。でも、駅から遠い所へ行く日は、車が便利だと思います。荷物の量や行きたい場所を考えて、使う乗り物を決めたいです。"},{"id":20,"code":"5-5B","part":5,"round":"5B","topic":"여행과 교통","q":"旅行の前に、一日の予定を全部決めたほうがいいと思いますか。あなたの考えを話してください。","qko":"여행 전에 하루 일정을 전부 정하는 것이 좋다고 생각하나요? 자신의 생각을 이야기해 주세요.","a":"一日の予定は、細かく決めすぎないほうがいいと思います。気になる店を見つけたとき、予定を変えて入りたいからです。ただ、ホテルと帰りの電車は、出発する前に予約するつもりです。昼ご飯を食べる場所などは、友達とその場で相談します。歩いて疲れたら、予定を一つ減らして休む時間も取りたいです。"},{"id":21,"code":"6-4A","part":4,"round":"6A","topic":"공부와 학습","q":"日本語を覚えるために、どんなことをしていますか。ふだんの勉強のしかたを話してください。","qko":"일본어를 익히기 위해 어떤 일을 하고 있나요? 평소 공부하는 방법을 이야기해 주세요.","a":"日本語で話すために、毎日少しずつ練習します。朝は新しい言葉を三つノートに書きます。夜はその言葉を使って、短い話を作ってみます。声を録音すると、自分の話し方を確認できます。"},{"id":22,"code":"6-4B","part":4,"round":"6B","topic":"공부와 학습","q":"勉強で分からないことがあったら、どうしますか。自分のやり方を話してください。","qko":"공부하다가 모르는 것이 생기면 어떻게 하나요? 자신의 방법을 이야기해 주세요.","a":"分からないことがあったら、まず本で調べます。例を読んで、自分でも同じようにやってみます。できないときは、難しかった所を先生に聞きます。一人で長く悩むより、早く聞くといいと思います。"},{"id":23,"code":"6-5A","part":5,"round":"6A","topic":"공부와 학습","q":"勉強は、一人でするのと友達とするのと、どちらがいいと思いますか。理由も話してください。","qko":"공부는 혼자 하는 것과 친구와 하는 것 중 어느 쪽이 좋다고 생각하나요? 이유도 이야기해 주세요.","a":"私は、何を勉強するかによって、勉強のしかたを変えたいです。会話の練習なら、友達と一緒にしたほうがいいと思います。例えば、買い物の場面を決めて、店の人と客になって話してみます。一方、新しい言葉を覚えるときは、静かな部屋で集中したいです。友達と練習する前に、一人で準備する時間も作りたいです。"},{"id":24,"code":"6-5B","part":5,"round":"6B","topic":"공부와 학습","q":"仕事を始めてからも、新しいことを勉強する必要があると思いますか。あなたの考えを話してください。","qko":"직장 생활을 시작한 뒤에도 새로운 것을 공부할 필요가 있다고 생각하나요? 자신의 생각을 이야기해 주세요.","a":"仕事を始めてからも、必要なことは少しずつ学びたいです。自分でできる仕事を増やすために、勉強を続けるといいと思います。例えば、新しい道具を使うときは、説明を読んでから試してみます。分からない所は先輩に相談し、使い方を確かめたいです。ただ、毎日長く勉強するのではなく、休む時間も大切にしたいです。"},{"id":25,"code":"7-4A","part":4,"round":"7A","topic":"스마트폰 사용","q":"あなたはスマートフォンをどんなことに使っていますか。よく使う場面について話してください。","qko":"여러분은 스마트폰을 어떤 일에 사용하나요? 자주 사용하는 상황에 관해 말해 주세요.","a":"スマートフォンは、家族への連絡や買い物に使っています。買い物のときは、家族に必要な物を聞きます。帰りの電車では、日本語の音声も聞きます。ただ、使いすぎないように、一度に見る時間を決めています。"},{"id":26,"code":"7-4B","part":4,"round":"7B","topic":"스마트폰 사용","q":"スマートフォンを使う時間について、気を付けていることはありますか。自分の使い方を説明してください。","qko":"스마트폰을 사용하는 시간과 관련해 주의하는 점이 있나요? 자신의 사용 방법을 설명해 주세요.","a":"動画を見る前に、やめる時間を決めています。前は動画を見すぎて、朝起きるのが大変でした。今は夜十時にアラームを鳴らします。その後は机に置き、ベッドでは見ないようにしています。"},{"id":27,"code":"7-5A","part":5,"round":"7A","topic":"스마트폰 사용","q":"学校で、授業中のスマートフォンの使い方を決めることに賛成ですか。理由も話してください。","qko":"학교에서 수업 중 스마트폰 사용 방법을 정하는 것에 찬성하나요? 이유도 말해 주세요.","a":"学校でスマートフォンの使い方を決めることに賛成です。授業中に自由に使うと、別の画面が気になって、先生の話を聞きにくくなると思うからです。例えば、調べ物をするときだけ机に出し、それ以外はかばんに入れます。ただ、家族から急な連絡が来たときは、先生に伝えて使ってもいいと思います。何のための決まりか、みんなで話すことも大切です。"},{"id":28,"code":"7-5B","part":5,"round":"7B","topic":"스마트폰 사용","q":"家族や友達と食事をするとき、スマートフォンを使わない時間を作ることは必要だと思いますか。理由も話してください。","qko":"가족이나 친구와 식사할 때 스마트폰을 사용하지 않는 시간을 만드는 것이 필요하다고 생각하나요? 이유도 말해 주세요.","a":"食事中は、スマートフォンを使わないで話す時間を作りたいです。近くにいる人の話を聞くことも、食事の楽しみだと思うからです。例えば、料理が来たら、スマートフォンをかばんに入れます。待ち合わせの連絡があるときは、先に相手に話してから確認します。相手を待たせすぎないように、見る時間を短くしたいです。"},{"id":29,"code":"8-4A","part":4,"round":"8A","topic":"친구와 관계","q":"友達と会う約束をするとき、どんなことを確認しますか。いつもしていることを説明してください。","qko":"친구와 만날 약속을 할 때 어떤 것을 확인하나요? 평소에 하는 일을 설명해 주세요.","a":"友達と会う前に、時間と場所をメッセージで確かめます。初めての場所なら、地図を送ってもらいます。遅れるときは、早めに連絡しなければなりません。何分ぐらい遅れるかも、短く伝えます。"},{"id":30,"code":"8-4B","part":4,"round":"8B","topic":"친구와 관계","q":"最近、友達に何かを手伝ってもらいましたか。そのときのことを話してください。","qko":"최근에 친구에게 도움을 받은 일이 있나요? 그때의 일을 말해 주세요.","a":"先月、友達に日本語の作文を見てもらいました。同じ言葉を何度も使っていたので、別の言い方を教えてもらいました。説明が分かりやすくて、とても助かりました。後でお礼を言い、友達の引っ越しを手伝いました。"},{"id":31,"code":"8-5A","part":5,"round":"8A","topic":"친구와 관계","q":"友達が写っている写真をSNSに載せる前に、友達に聞く必要があると思いますか。理由も話してください。","qko":"친구가 나온 사진을 SNS에 올리기 전에 친구에게 물어볼 필요가 있다고 생각하나요? 이유도 말해 주세요.","a":"友達が写っている写真は、載せる前に本人に聞く必要があります。写真に写った顔や場所を、ほかの人に見せたくない場合もあると思うからです。例えば、一緒に撮った写真を送り、SNSに載せてもいいか聞きます。嫌だと言われたら、自分だけが写っている写真を選び直します。許可をもらうときに、どこに載せるかも伝えたいです。"},{"id":32,"code":"8-5B","part":5,"round":"8B","topic":"친구와 관계","q":"人に助けてもらったとき、言葉でお礼を伝えることは大切だと思いますか。理由も話してください。","qko":"다른 사람에게 도움받았을 때 말로 감사 인사를 전하는 것이 중요하다고 생각하나요? 이유도 말해 주세요.","a":"助けてもらったら、どんな点で助かったかも言葉で伝えたいです。ありがとうだけでもいいですが、理由も伝えると気持ちが伝わりやすいと思います。例えば、雨の日に駅まで迎えに来てもらったら、とても助かったと伝えます。ただ、お礼に高い物を買わなければならないとは思いません。後で会ったときにも、短くお礼を伝えたいです。"}];

ruby>連絡<rt>れんらく</rt></ruby>が<ruby>来<rt>き</rt></ruby>たときは、<ruby>先生<rt>せんせい</rt></ruby>に<ruby>伝<rt>つた</rt></ruby>えて<ruby>使<rt>つか</rt></ruby>ってもいいと<ruby>思<rt>おも</rt></ruby>います。<ruby>何<rt>なん</rt></ruby>のための<ruby>決<rt>き</rt></ruby>まりか、みんなで<ruby>話<rt>はな</rt></ruby>すことも<ruby>大切<rt>たいせつ</rt></ruby>です。","28":"<ruby>食事<rt>しょくじ</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>は、スマートフォンを<ruby>使<rt>つか</rt></ruby>わないで<ruby>話<rt>はな</rt></ruby>す<ruby>時間<rt>じかん</rt></ruby>を<ruby>作<rt>つく</rt></ruby>りたいです。<ruby>近<rt>ちか</rt></ruby>くにいる<ruby>人<rt>ひと</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くことも、<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>楽<rt>たの</rt></ruby>しみだと<ruby>思<rt>おも</rt></ruby>うからです。<ruby>例<rt>たと</rt></ruby>えば、<ruby>料理<rt>りょうり</rt></ruby>が<ruby>来<rt>き</rt></ruby>たら、スマートフォンをかばんに<ruby>入<rt>い</rt></ruby>れます。<ruby>待ち合<rt>まちあ</rt></ruby>わせの<ruby>連絡<rt>れんらく</rt></ruby>があるときは、<ruby>先<rt>さき</rt></ruby>に<ruby>相手<rt>あいて</rt></ruby>に<ruby>話<rt>はな</rt></ruby>してから<ruby>確認<rt>かくにん</rt></ruby>します。<ruby>相手<rt>あいて</rt></ruby>を<ruby>待<rt>ま</rt></ruby>たせすぎないように、<ruby>見<rt>み</rt></ruby>る<ruby>時間<rt>じかん</rt></ruby>を<ruby>短<rt>みじか</rt></ruby>くしたいです。","29":"<ruby>友達<rt>ともだち</rt></ruby>と<ruby>会<rt>あ</rt></ruby>う<ruby>前<rt>まえ</rt></ruby>に、<ruby>時間<rt>じかん</rt></ruby>と<ruby>場所<rt>ばしょ</rt></ruby>をメッセージで<ruby>確<rt>たし</rt></ruby>かめます。<ruby>初<rt>はじ</rt></ruby>めての<ruby>場所<rt>ばしょ</rt></ruby>なら、<ruby>地図<rt>ちず</rt></ruby>を<ruby>送<rt>おく</rt></ruby>ってもらいます。<ruby>遅<rt>おく</rt></ruby>れるときは、<ruby>早<rt>はや</rt></ruby>めに<ruby>連絡<rt>れんらく</rt></ruby>しなければなりません。<ruby>何分<rt>なんぷん</rt></ruby>ぐらい<ruby>遅<rt>おく</rt></ruby>れるかも、<ruby>短<rt>みじか</rt></ruby>く<ruby>伝<rt>つた</rt></ruby>えます。","30":"<ruby>先月<rt>せんげつ</rt></ruby>、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>作文<rt>さくぶん</rt></ruby>を<ruby>見<rt>み</rt></ruby>てもらいました。<ruby>同<rt>おな</rt></ruby>じ<ruby>言葉<rt>ことば</rt></ruby>を<ruby>何<rt>なん</rt></ruby><ruby>度<rt>ど</rt></ruby>も<ruby>使<rt>つか</rt></ruby>っていたので、<ruby>別<rt>べつ</rt></ruby>の<ruby>言<rt>い</rt></ruby>い<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてもらいました。<ruby>説明<rt>せつめい</rt></ruby>が<ruby>分<rt>わ</rt></ruby>かりやすくて、とても<ruby>助<rt>たす</rt></ruby>かりました。<ruby>後<rt>あと</rt></ruby>でお<ruby>礼<rt>れい</rt></ruby>を<ruby>言<rt>い</rt></ruby>い、<ruby>友達<rt>ともだち</rt></ruby>の<ruby>引っ越<rt>ひっこ</rt></ruby>しを<ruby>手伝<rt>てつだ</rt></ruby>いました。","31":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>写<rt>うつ</rt></ruby>っている<ruby>写真<rt>しゃしん</rt></ruby>は、<ruby>載<rt>の</rt></ruby>せる<ruby>前<rt>まえ</rt></ruby>に<ruby>本人<rt>ほんにん</rt></ruby>に<ruby>聞<rt>き</rt></ruby>く<ruby>必要<rt>ひつよう</rt></ruby>があります。<ruby>写真<rt>しゃしん</rt></ruby>に<ruby>写<rt>うつ</rt></ruby>った<ruby>顔<rt>かお</rt></ruby>や<ruby>場所<rt>ばしょ</rt></ruby>を、ほかの<ruby>人<rt>ひと</rt></ruby>に<ruby>見<rt>み</rt></ruby>せたくない<ruby>場合<rt>ばあい</rt></ruby>もあると<ruby>思<rt>おも</rt></ruby>うからです。<ruby>例<rt>たと</rt></ruby>えば、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>撮<rt>と</rt></ruby>った<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>送<rt>おく</rt></ruby>り、SNSに<ruby>載<rt>の</rt></ruby>せてもいいか<ruby>聞<rt>き</rt></ruby>きます。<ruby>嫌<rt>いや</rt></ruby>だと<ruby>言<rt>い</rt></ruby>われたら、<ruby>自分<rt>じぶん</rt></ruby>だけが<ruby>写<rt>うつ</rt></ruby>っている<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>選び直<rt>えらびなお</rt></ruby>します。<ruby>許可<rt>きょか</rt></ruby>をもらうときに、どこに<ruby>載<rt>の</rt></ruby>せるかも<ruby>伝<rt>つた</rt></ruby>えたいです。","32":"<ruby>助<rt>たす</rt></ruby>けてもらったら、どんな<ruby>点<rt>てん</rt></ruby>で<ruby>助<rt>たす</rt></ruby>かったかも<ruby>言葉<rt>ことば</rt></ruby>で<ruby>伝<rt>つた</rt></ruby>えたいです。ありがとうだけでもいいですが、<ruby>理由<rt>りゆう</rt></ruby>も<ruby>伝<rt>つた</rt></ruby>えると<ruby>気持<rt>きも</rt></ruby>ちが<ruby>伝<rt>つた</rt></ruby>わりやすいと<ruby>思<rt>おも</rt></ruby>います。<ruby>例<rt>たと</rt></ruby>えば、<ruby>雨<rt>あめ</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>に<ruby>駅<rt>えき</rt></ruby>まで<ruby>迎<rt>むか</rt></ruby>えに<ruby>来<rt>き</rt></ruby>てもらったら、とても<ruby>助<rt>たす</rt></ruby>かったと<ruby>伝<rt>つた</rt></ruby>えます。ただ、お<ruby>礼<rt>れい</rt></ruby>に<ruby>高<rt>たか</rt></ruby>い<ruby>物<rt>もの</rt></ruby>を<ruby>買<rt>か</rt></ruby>わなければならないとは<ruby>思<rt>おも</rt></ruby>いません。<ruby>後<rt>あと</rt></ruby>で<ruby>会<rt>あ</rt></ruby>ったときにも、<ruby>短<rt>みじか</rt></ruby>くお<ruby>礼<rt>れい</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>えたいです。"};
const $=id=>document.getElementById(id),AUTO_DELAY=3000;let filtered=[...DATA],index=0,back=false,showKorean=false,showFurigana=false,onlyStars=false,mode='card',autoPlaying=false,autoTimer=null;let stars=new Set(JSON.parse(localStorage.getItem('sjpt-l5-stars-v1')||'[]'));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
function speak(c,answer,done){if(!c||!('speechSynthesis'in window)){if(done)done();return}stopSpeech();const u=new SpeechSynthesisUtterance(answer?c.a:c.q);u.lang='ja-JP';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));if(voices[0])u.voice=voices.find(v=>v.default)||voices[0];u.onstart=()=>{$('message').textContent='일본어 음성 재생 중…'};u.onend=()=>{$('message').textContent='';if(done)done()};u.onerror=()=>{if(done)done()};speechSynthesis.speak(u)}
function bounds(){let start=filtered.findIndex(c=>String(c.id)==$('rangeStart').value),end=filtered.findIndex(c=>String(c.id)==$('rangeEnd').value);return{start:start<0?0:start,end:end<0?Math.max(0,filtered.length-1):end}}
function updateRanges(){const a=$('rangeStart'),b=$('rangeEnd'),av=a.value,bv=b.value;a.innerHTML=b.innerHTML='';filtered.forEach(c=>{const label=c.code;a.add(new Option(label,c.id));b.add(new Option(label,c.id))});a.disabled=b.disabled=!filtered.length;if(!filtered.length)return;a.value=filtered.some(c=>String(c.id)===av)?av:filtered[0].id;b.value=filtered.some(c=>String(c.id)===bv)?bv:filtered.at(-1).id;if(bounds().end<bounds().start)b.value=a.value}
function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);$('autoPlay').textContent='▶';$('autoPlay').classList.remove('active')}
function schedule(){clearTimeout(autoTimer);if(!autoPlaying||!filtered.length)return;autoTimer=setTimeout(()=>{if(back){const x=bounds();index=index>=x.end?x.start:index+1;back=false}else back=true;showKorean=false;showFurigana=false;render();speak(filtered[index],back,schedule)},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stopSpeech();return}if(!filtered.length)return;const x=bounds();index=x.start;back=false;showKorean=false;showFurigana=false;autoPlaying=true;$('autoPlay').textContent='■';$('autoPlay').classList.add('active');render();speak(filtered[index],false,schedule)}
function apply(){stopAuto();stopSpeech();const q=$('search').value.trim().toLowerCase();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('round').value||c.round==$('round').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;showKorean=false;showFurigana=false;updateRanges();render()}
function cardActions(){return `<div class="cardActions"><button id="furiganaToggle" class="${showFurigana?'active':''}" type="button">${showFurigana?'후리가나 숨기기':'후리가나'}</button><button id="koreanToggle" class="${showKorean?'active':''}" type="button">${showKorean?'해석 숨기기':'해석'}</button></div>`}
function render(){const c=filtered[index];$('starFilter').textContent=`★ 별표 (${stars.size})`;$('starFilter').classList.toggle('active',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`${c.code} · Part ${c.part} · ${c.topic}`:'';if(!c)return;$('star').textContent=stars.has(c.id)?'★':'☆';$('card').classList.toggle('back',back);$('card').innerHTML=back?`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>모범답안</span></div><p class="answer" lang="ja">A. ${showFurigana?RUBY[c.id]:esc(c.a)}</p>${showKorean?`<p class="korean answerKo">${esc(KOREAN[c.id])}</p>`:''}${cardActions()}<div class="hint">다시 탭하면 질문으로 돌아갑니다</div>`:`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>질문</span></div><p class="prompt" lang="ja">Q. ${showFurigana?QUESTION_RUBY[c.id]:esc(c.q)}</p>${showKorean?`<p class="korean">${esc(c.qko)}</p>`:''}${cardActions()}<div class="hint">탭하여 모범답안 확인</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';if(mode==='list')$('listView').innerHTML=filtered.map(x=>`<article class="listitem"><div class="row"><h2>${x.code} · Part ${x.part} · ${esc(x.topic)}</h2><button data-speak="${x.id}">듣기</button></div><p class="listQ">Q. ${esc(x.q)}</p><p class="korean">${esc(x.qko)}</p><p class="listA">A. ${esc(x.a)}</p></article>`).join('')}
function flip(){if(!filtered.length)return;stopSpeech();back=!back;showKorean=false;showFurigana=false;render()}
function move(n){if(!filtered.length)return;stopSpeech();index=(index+n+filtered.length)%filtered.length;back=false;showKorean=false;showFurigana=false;render()}
$('card').onclick=e=>{if(e.target.closest('#furiganaToggle')){showFurigana=!showFurigana;render();return}if(e.target.closest('#koreanToggle')){showKorean=!showKorean;render();return}flip()};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('speak').onclick=()=>speak(filtered[index],back);$('autoPlay').onclick=toggleAuto;$('star').onclick=()=>{const id=filtered[index].id;stars.has(id)?stars.delete(id):stars.add(id);localStorage.setItem('sjpt-l5-stars-v1',JSON.stringify([...stars]));render()};$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{mode='card';render()};$('listMode').onclick=()=>{stopAuto();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('round').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=()=>{$('search').value='';$('part').value=$('round').value='';onlyStars=false;apply()};$('shuffle').onclick=()=>{stopAuto();for(let i=filtered.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;showFurigana=false;updateRanges();render()};$('rangeStart').onchange=()=>{stopAuto();const x=bounds();if(x.end<x.start)$('rangeEnd').value=$('rangeStart').value;index=bounds().start;back=false;showFurigana=false;render()};$('rangeEnd').onchange=()=>{stopAuto();const x=bounds();if(x.end<x.start)$('rangeStart').value=$('rangeEnd').value;index=bounds().start;back=false;showFurigana=false;render()};$('listView').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(DATA.find(c=>c.id==b.dataset.speak),false)};for(let i=1;i<=8;i++)for(const x of ['A','B'])$('round').add(new Option(`${i}${x}`,`${i}${x}`));apply();
</script>
