:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font:calc(16px + 1pt)/1.7 Arial,'Malgun Gothic',sans-serif}header{background:#1e293b;border-bottom:1px solid #334155;padding:18px}header>div,main{max-width:1000px;margin:auto}h1{font-size:calc(16px + 1pt);margin:0}small,.hint,footer{font-size:calc(12px + 1pt);color:#94a3b8}main{padding:20px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}header>div{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}button,input,select{font:calc(14px + 1pt)/1.5 Arial,'Malgun Gothic',sans-serif;border:1px solid #475569;border-radius:9px;padding:10px 13px;color:#f1f5f9;background:#1e293b}button,select{cursor:pointer}button:hover{background:#475569}button.active,.primary{background:#4f46e5}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}input{flex:1;min-width:180px}.filters{background:#1e293b88;padding:12px;border:1px solid #334155;border-radius:12px}.status{justify-content:space-between;margin:20px 0;font-size:calc(12px + 1pt)}.badge{color:#a5b4fc}.star{color:#fbbf24}#autoPlay,#star{width:44px;height:44px;padding:0;display:inline-grid;place-items:center}#autoPlay{background:#ea580c;border-color:#fb923c;color:#fff}#autoPlay:hover{background:#c2410c;border-color:#fdba74}#autoPlay.active{background:#f97316;border-color:#fed7aa}.card{border:1px solid #475569;background:linear-gradient(130deg,#1e293b,#162036);border-radius:22px;padding:30px;min-height:400px;box-shadow:0 20px 50px #02061766;cursor:pointer;display:flex;flex-direction:column;gap:26px}.card.back{background:linear-gradient(130deg,#28244c,#0f172a);border-color:#6366f1}.cardTop{display:flex;justify-content:space-between;gap:10px;font-size:calc(12px + 1pt);color:#a5b4fc}.sentence{font-size:calc(48px + 1pt);line-height:2.1;font-weight:bold;overflow-wrap:anywhere;margin:auto 0;padding:20px 0}.sentence.long{font-size:calc(30px + 1pt)}ruby{ruby-position:over}rt{font-size:calc(14px + 1pt);color:#a5b4fc;font-weight:normal}rp{display:none}.translations{margin:1em 0 0;border-top:1px solid #454563;padding-top:24px;display:grid;grid-template-columns:46px 1fr;gap:12px;font-size:calc(16px + 1pt);line-height:1.8}dt{font-weight:bold;color:#a5b4fc}dd{margin:0}dt:last-of-type,dd:last-child{color:#6ee7b7}.hint{text-align:center}.progress{height:6px;border-radius:5px;background:#1e293b;margin:20px 0;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#6366f1,#34d399)}.controls{justify-content:center}.controls button{padding:14px 22px}.help{text-align:center;color:#94a3b8;font-size:calc(12px + 1pt);margin:24px 0}.listitem{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px;margin:15px 0}.listitem h2{font-size:calc(14px + 1pt);color:#a5b4fc}.listSentence{font-size:calc(20px + 1pt);line-height:2.3}footer{text-align:center;padding:20px}.empty{text-align:center;padding:60px 20px;color:#94a3b8}#message{color:#fbbf24;font-size:calc(12px + 1pt)}[hidden]{display:none!important}@media(max-width:640px){main{padding:12px}.card{padding:22px 18px;min-height:380px}.sentence{font-size:calc(36px + 1pt)}.sentence.long{font-size:calc(28px + 1pt)}rt{font-size:calc(12px + 1pt)}.filters input{flex-basis:100%}select{max-width:100%}.translations{grid-template-columns:38px 1fr}.controls button{padding:12px 18px}}
</style><header><div><div><h1>▣ SJPT 플래시카드</h1><small>제2부 · 제3부 · 제4부 — 각 50문항</small></div><nav class="row"><button id="cardsMode" class="active">카드 모드</button><button id="listMode">목록 모드</button><button id="starFilter" class="star">★ 별표 (0)</button></nav></div></header><main><section class="row filters"><input id="search" aria-label="검색" placeholder="질문, 답변, 읽는 법, 한국어, 주제 검색…"><button id="clear">지우기</button><select id="part" aria-label="부 선택"><option value="">전체 부</option><option value="2">제2부 · 그림 보고 답하기</option><option value="3" selected>제3부 · 대화 완성</option><option value="4">제4부 · 일상 화제 설명</option></select><select id="number" aria-label="문항 번호"><option value="">전체 번호</option></select><button id="shuffle">⇄ 셔플</button><button id="reset">↺ 순서 복원</button></section><div class="row status"><div class="row"><strong id="count" aria-live="polite"></strong><span id="tag" class="badge"></span></div><div class="row"><button id="autoPlay" aria-label="자동 넘김 시작" title="자동 넘김 시작" aria-pressed="false">▶</button><button id="star" class="star" aria-label="현재 문항 별표">☆</button><button id="speak">♫ 발음 듣기</button></div></div><p id="message" role="status"></p><section id="cardView"><div id="card" class="card" role="button" tabindex="0" aria-label="카드 뒤집기"></div><div class="progress"><div id="progress"></div></div><div class="row controls"><button id="prev">← 이전</button><button id="flip" class="primary">↻ 뒤집기</button><button id="next">다음 →</button></div><p class="help">탭 또는 Space 키: 뒤집기 · Ctrl+Space: 자동재생 시작/정지 · ← →: 이전/다음<br>제2부 그림의 상황 설명은 뒷면에서 확인할 수 있습니다.</p></section><section id="listView" hidden aria-label="문항 목록"></section><div id="empty" class="empty" hidden>조건에 맞는 문항이 없습니다.<br>검색어 또는 필터를 변경해 주세요.</div></main><footer>SJPT 150문항 학습기 · 요미가나 · 한국어 해석 · 일본어 발음 듣기</footer><script>
const DATA=[{"id": 1, "part": 2, "no": "01", "title": "위치·번호", "q": "電車は何番線から出ますか。", "a": "3番線から出ます。", "qr": "電車(でんしゃ)は何番線(なんばんせん)から出(で)ますか。", "ar": "3番線(ばんせん)から出(で)ます。", "situation": "전철 안내판에 3번 승강장이 표시되어 있다.", "qko": "전철은 몇 번 승강장에서 출발합니까?", "ako": "3번 승강장에서 출발합니다."}, {"id": 2, "part": 2, "no": "02", "title": "사물 명칭", "q": "これは何ですか。", "a": "傘です。", "qr": "これは何(なん)ですか。", "ar": "傘(かさ)です。", "situation": "그림에 우산이 한 개 놓여 있다.", "qko": "이것은 무엇입니까?", "ako": "우산입니다."}, {"id": 3, "part": 2, "no": "03", "title": "착용 여부", "q": "男の人は帽子をかぶっていますか。", "a": "はい、かぶっています。", "qr": "男(おとこ)の人(ひと)は帽子(ぼうし)をかぶっていますか。", "ar": "はい、かぶっています。", "situation": "남자가 모자를 쓰고 있다.", "qko": "남자는 모자를 쓰고 있습니까?", "ako": "네, 쓰고 있습니다."}, {"id": 4, "part": 2, "no": "04", "title": "표지·허가", "q": "ここで写真を撮ってもいいですか。", "a": "いいえ、撮ってはいけません。", "qr": "ここで写真(しゃしん)を撮(と)ってもいいですか。", "ar": "いいえ、撮(と)ってはいけません。", "situation": "‘撮影禁止’ 표지가 있다.", "qko": "여기에서 사진을 찍어도 됩니까?", "ako": "아니요, 찍으면 안 됩니다."}, {"id": 5, "part": 2, "no": "05", "title": "수량", "q": "りんごはいくつありますか。", "a": "五つあります。", "qr": "りんごはいくつありますか。", "ar": "五(いつ)つあります。", "situation": "바구니 안에 사과가 다섯 개 있다.", "qko": "사과는 몇 개 있습니까?", "ako": "다섯 개 있습니다."}, {"id": 6, "part": 2, "no": "06", "title": "색상", "q": "かばんは何色ですか。", "a": "赤です。", "qr": "かばんは何色(なにいろ)ですか。", "ar": "赤(あか)です。", "situation": "빨간 가방이 진열되어 있다.", "qko": "가방은 무슨 색입니까?", "ako": "빨간색입니다."}, {"id": 7, "part": 2, "no": "07", "title": "위치", "q": "猫はどこにいますか。", "a": "テーブルの下にいます。", "qr": "猫(ねこ)はどこにいますか。", "ar": "テーブルの下(した)にいます。", "situation": "고양이가 탁자 아래에 있다.", "qko": "고양이는 어디에 있습니까?", "ako": "탁자 아래에 있습니다."}, {"id": 8, "part": 2, "no": "08", "title": "시간", "q": "図書館は何時に開きますか。", "a": "午前九時に開きます。", "qr": "図書(としょ)館(かん)は何時(なんじ)に開(あ)きますか。", "ar": "午前(ごぜん)九時(くじ)に開(あ)きます。", "situation": "도서관 안내판에 오전 9시 개관이라고 적혀 있다.", "qko": "도서관은 몇 시에 문을 엽니까?", "ako": "오전 9시에 문을 엽니다."}, {"id": 9, "part": 2, "no": "09", "title": "비교", "q": "どちらが安いですか。", "a": "バナナのほうが安いです。", "qr": "どちらが安(やす)いですか。", "ar": "バナナのほうが安(やす)いです。", "situation": "바나나는 200엔, 오렌지는 300엔이다.", "qko": "어느 쪽이 더 쌉니까?", "ako": "바나나가 더 쌉니다."}, {"id": 10, "part": 2, "no": "10", "title": "행동", "q": "女の人は何をしていますか。", "a": "料理をしています。", "qr": "女(おんな)の人(ひと)は何(なに)をしていますか。", "ar": "料理(りょうり)をしています。", "situation": "여자가 주방에서 요리하고 있다.", "qko": "여자는 무엇을 하고 있습니까?", "ako": "요리하고 있습니다."}, {"id": 11, "part": 2, "no": "11", "title": "층수", "q": "何階へ行きますか。", "a": "八階へ行きます。", "qr": "何階(なんがい)へ行(い)きますか。", "ar": "八階(はっかい)へ行(い)きます。", "situation": "엘리베이터 표시가 8층을 가리킨다.", "qko": "몇 층으로 갑니까?", "ako": "8층으로 갑니다."}, {"id": 12, "part": 2, "no": "12", "title": "방향", "q": "銀行はどちらにありますか。", "a": "左側にあります。", "qr": "銀行(ぎんこう)はどちらにありますか。", "ar": "左側(ひだりがわ)にあります。", "situation": "은행이 길 왼쪽에 있다.", "qko": "은행은 어느 쪽에 있습니까?", "ako": "왼쪽에 있습니다."}, {"id": 13, "part": 2, "no": "13", "title": "날씨", "q": "天気はどうですか。", "a": "雪が降っています。", "qr": "天気(てんき)はどうですか。", "ar": "雪(ゆき)が降(ふ)っています。", "situation": "창밖에 눈이 내리고 있다.", "qko": "날씨가 어떻습니까?", "ako": "눈이 내리고 있습니다."}, {"id": 14, "part": 2, "no": "14", "title": "사용 가능", "q": "ここで携帯電話を使えますか。", "a": "はい、使えます。", "qr": "ここで携帯(けいたい)電話(でんわ)を使(つか)えますか。", "ar": "はい、使(つか)えます。", "situation": "‘携帯電話使用可’ 안내가 있다.", "qko": "여기에서 휴대전화를 사용할 수 있습니까?", "ako": "네, 사용할 수 있습니다."}, {"id": 15, "part": 2, "no": "15", "title": "층수", "q": "診察室は何階ですか。", "a": "二階です。", "qr": "診察(しんさつ)室(しつ)は何階(なんがい)ですか。", "ar": "二(に)階(かい)です。", "situation": "병원 진료실이 2층에 표시되어 있다.", "qko": "진료실은 몇 층입니까?", "ako": "2층입니다."}, {"id": 16, "part": 2, "no": "16", "title": "소지품", "q": "男の人は何を持っていますか。", "a": "スーツケースを持っています。", "qr": "男(おとこ)の人(ひと)は何(なに)を持(も)っていますか。", "ar": "スーツケースを持(も)っています。", "situation": "남자가 여행 가방을 들고 있다.", "qko": "남자는 무엇을 가지고 있습니까?", "ako": "여행 가방을 가지고 있습니다."}, {"id": 17, "part": 2, "no": "17", "title": "수량", "q": "自転車は何台ありますか。", "a": "三台あります。", "qr": "自転(じてん)車(しゃ)は何台(なんだい)ありますか。", "ar": "三(さん)台(だい)あります。", "situation": "자전거가 세 대 세워져 있다.", "qko": "자전거는 몇 대 있습니까?", "ako": "세 대 있습니다."}, {"id": 18, "part": 2, "no": "18", "title": "위치", "q": "植木鉢はどこにありますか。", "a": "椅子の隣にあります。", "qr": "植木(うえき)鉢(ばち)はどこにありますか。", "ar": "椅子(いす)の隣(となり)にあります。", "situation": "화분이 의자 옆에 있다.", "qko": "화분은 어디에 있습니까?", "ako": "의자 옆에 있습니다."}, {"id": 19, "part": 2, "no": "19", "title": "요일", "q": "店は何曜日が休みですか。", "a": "水曜日が休みです。", "qr": "店(みせ)は何曜日(なんようび)が休(やす)みですか。", "ar": "水曜日(すいようび)が休(やす)みです。", "situation": "가게 안내판에 수요일 휴무라고 적혀 있다.", "qko": "가게는 무슨 요일에 쉽니까?", "ako": "수요일에 쉽니다."}, {"id": 20, "part": 2, "no": "20", "title": "가격", "q": "ラーメンはいくらですか。", "a": "八百円です。", "qr": "ラーメンはいくらですか。", "ar": "八百(はっぴゃく)円(えん)です。", "situation": "메뉴판에 라멘 800엔이라고 적혀 있다.", "qko": "라멘은 얼마입니까?", "ako": "800엔입니다."}, {"id": 21, "part": 2, "no": "21", "title": "영업 상태", "q": "店は開いていますか。", "a": "いいえ、閉まっています。", "qr": "店(みせ)は開(あ)いていますか。", "ar": "いいえ、閉(し)まっています。", "situation": "가게 문에 ‘閉店’ 팻말이 걸려 있다.", "qko": "가게는 열려 있습니까?", "ako": "아니요, 닫혀 있습니다."}, {"id": 22, "part": 2, "no": "22", "title": "착용 여부", "q": "男の人は眼鏡をかけていますか。", "a": "はい、かけています。", "qr": "男(おとこ)の人(ひと)は眼鏡(めがね)をかけていますか。", "ar": "はい、かけています。", "situation": "남자가 안경을 쓰고 있다.", "qko": "남자는 안경을 쓰고 있습니까?", "ako": "네, 쓰고 있습니다."}, {"id": 23, "part": 2, "no": "23", "title": "착용 여부", "q": "女の人はコートを着ていますか。", "a": "いいえ、着ていません。", "qr": "女(おんな)の人(ひと)はコートを着(き)ていますか。", "ar": "いいえ、着(き)ていません。", "situation": "여자가 재킷만 입고 코트는 입지 않았다.", "qko": "여자는 코트를 입고 있습니까?", "ako": "아니요, 입고 있지 않습니다."}, {"id": 24, "part": 2, "no": "24", "title": "소요 시간", "q": "駅までどのくらいかかりますか。", "a": "歩いて五分かかります。", "qr": "駅(えき)までどのくらいかかりますか。", "ar": "歩(ある)いて五(ご)分(ふん)かかります。", "situation": "집에서 역까지 도보 5분이라고 표시되어 있다.", "qko": "역까지 얼마나 걸립니까?", "ako": "걸어서 5분 걸립니다."}, {"id": 25, "part": 2, "no": "25", "title": "상태", "q": "コップは空ですか。", "a": "いいえ、水がいっぱい入っています。", "qr": "コップは空(から)ですか。", "ar": "いいえ、水(みず)がいっぱい入(はい)っています。", "situation": "컵 안에 물이 가득 차 있다.", "qko": "컵은 비어 있습니까?", "ako": "아니요, 물이 가득 들어 있습니다."}, {"id": 26, "part": 2, "no": "26", "title": "표지·허가", "q": "ここに車を止めてもいいですか。", "a": "いいえ、止めてはいけません。", "qr": "ここに車(くるま)を止(と)めてもいいですか。", "ar": "いいえ、止(と)めてはいけません。", "situation": "‘駐車禁止’ 표지가 있다.", "qko": "여기에 차를 세워도 됩니까?", "ako": "아니요, 세우면 안 됩니다."}, {"id": 27, "part": 2, "no": "27", "title": "색상", "q": "信号は何色ですか。", "a": "青です。", "qr": "信号(しんごう)は何色(なにいろ)ですか。", "ar": "青(あお)です。", "situation": "신호등의 초록불이 켜져 있다.", "qko": "신호등은 무슨 색입니까?", "ako": "초록불입니다."}, {"id": 28, "part": 2, "no": "28", "title": "내용물", "q": "箱の中に何が入っていますか。", "a": "靴が入っています。", "qr": "箱(はこ)の中(なか)に何(なに)が入(はい)っていますか。", "ar": "靴(くつ)が入(はい)っています。", "situation": "상자 안에 신발이 들어 있다.", "qko": "상자 안에 무엇이 들어 있습니까?", "ako": "신발이 들어 있습니다."}, {"id": 29, "part": 2, "no": "29", "title": "시간", "q": "予約は何時ですか。", "a": "午前十一時半です。", "qr": "予約(よやく)は何時(なんじ)ですか。", "ar": "午前(ごぜん)十(じゅう)一(いち)時(じ)半(はん)です。", "situation": "예약표에 오전 11시 30분이라고 적혀 있다.", "qko": "예약은 몇 시입니까?", "ako": "오전 11시 30분입니다."}, {"id": 30, "part": 2, "no": "30", "title": "비교", "q": "どちらの建物が高いですか。", "a": "Aの建物のほうが高いです。", "qr": "どちらの建物(たてもの)が高(たか)いですか。", "ar": "Aの建物(たてもの)のほうが高(たか)いです。", "situation": "A 건물이 B 건물보다 높다.", "qko": "어느 건물이 더 높습니까?", "ako": "A 건물이 더 높습니다."}, {"id": 31, "part": 2, "no": "31", "title": "행동", "q": "子どもは泳いでいますか。", "a": "はい、泳いでいます。", "qr": "子(こ)どもは泳(およ)いでいますか。", "ar": "はい、泳(およ)いでいます。", "situation": "아이가 수영장에서 수영하고 있다.", "qko": "아이는 수영하고 있습니까?", "ako": "네, 수영하고 있습니다."}, {"id": 32, "part": 2, "no": "32", "title": "위치", "q": "傘はどこにありますか。", "a": "玄関の横にあります。", "qr": "傘(かさ)はどこにありますか。", "ar": "玄関(げんかん)の横(よこ)にあります。", "situation": "우산이 현관문 옆에 세워져 있다.", "qko": "우산은 어디에 있습니까?", "ako": "현관 옆에 있습니다."}, {"id": 33, "part": 2, "no": "33", "title": "결제", "q": "クレジットカードで払えますか。", "a": "はい、払えます。", "qr": "クレジットカードで払(はら)えますか。", "ar": "はい、払(はら)えます。", "situation": "계산대에 카드 결제 가능 표시가 있다.", "qko": "신용카드로 결제할 수 있습니까?", "ako": "네, 결제할 수 있습니다."}, {"id": 34, "part": 2, "no": "34", "title": "수량", "q": "本は何冊ありますか。", "a": "六冊あります。", "qr": "本(ほん)は何冊(なんさつ)ありますか。", "ar": "六(ろく)冊(さつ)あります。", "situation": "책장 한 칸에 책이 여섯 권 있다.", "qko": "책은 몇 권 있습니까?", "ako": "여섯 권 있습니다."}, {"id": 35, "part": 2, "no": "35", "title": "날짜", "q": "イベントはいつですか。", "a": "五月十日です。", "qr": "イベントはいつですか。", "ar": "五月十日(ごがつとおか)です。", "situation": "행사 포스터에 5월 10일이라고 적혀 있다.", "qko": "행사는 언제입니까?", "ako": "5월 10일입니다."}, {"id": 36, "part": 2, "no": "36", "title": "영업시간", "q": "薬局は何時に閉まりますか。", "a": "午後七時に閉まります。", "qr": "薬局(やっきょく)は何時(なんじ)に閉(し)まりますか。", "ar": "午後(ごご)七(しち)時(じ)に閉(し)まります。", "situation": "약국 안내판에 오후 7시 폐점이라고 적혀 있다.", "qko": "약국은 몇 시에 문을 닫습니까?", "ako": "오후 7시에 문을 닫습니다."}, {"id": 37, "part": 2, "no": "37", "title": "행동", "q": "子どもは何を飲んでいますか。", "a": "牛乳を飲んでいます。", "qr": "子(こ)どもは何(なに)を飲(の)んでいますか。", "ar": "牛乳(ぎゅうにゅう)を飲(の)んでいます。", "situation": "아이가 우유를 마시고 있다.", "qko": "아이는 무엇을 마시고 있습니까?", "ako": "우유를 마시고 있습니다."}, {"id": 38, "part": 2, "no": "38", "title": "인원", "q": "部屋に何人いますか。", "a": "四人います。", "qr": "部屋(へや)に何人(なんにん)いますか。", "ar": "四人(よにん)います。", "situation": "회의실 안에 네 명이 앉아 있다.", "qko": "방에 몇 명 있습니까?", "ako": "네 명 있습니다."}, {"id": 39, "part": 2, "no": "39", "title": "상태", "q": "窓は開いていますか。", "a": "はい、開いています。", "qr": "窓(まど)は開(あ)いていますか。", "ar": "はい、開(あ)いています。", "situation": "창문이 열려 있다.", "qko": "창문은 열려 있습니까?", "ako": "네, 열려 있습니다."}, {"id": 40, "part": 2, "no": "40", "title": "사물 명칭", "q": "この道具は何ですか。", "a": "ホッチキスです。", "qr": "この道具(どうぐ)は何(なん)ですか。", "ar": "ホッチキスです。", "situation": "그림에 스테이플러가 있다.", "qko": "이것은 무엇입니까?", "ako": "스테이플러입니다."}, {"id": 41, "part": 2, "no": "41", "title": "사물 위치", "q": "テーブルの上に何がありますか。", "a": "ノートパソコンがあります。", "qr": "テーブルの上(うえ)に何(なに)がありますか。", "ar": "ノートパソコンがあります。", "situation": "테이블 위에 노트북 컴퓨터가 있다.", "qko": "테이블 위에 무엇이 있습니까?", "ako": "노트북 컴퓨터가 있습니다."}, {"id": 42, "part": 2, "no": "42", "title": "출구", "q": "どの出口から出ますか。", "a": "東口から出ます。", "qr": "どの出口(でぐち)から出(で)ますか。", "ar": "東口(ひがしぐち)から出(で)ます。", "situation": "지도에 동쪽 출구가 목적지로 표시되어 있다.", "qko": "어느 출구로 나갑니까?", "ako": "동쪽 출구로 나갑니다."}, {"id": 43, "part": 2, "no": "43", "title": "목적지", "q": "この電車はどこへ行きますか。", "a": "大阪へ行きます。", "qr": "この電車(でんしゃ)はどこへ行(い)きますか。", "ar": "大阪(おおさか)へ行(い)きます。", "situation": "전광판에 오사카행이라고 표시되어 있다.", "qko": "이 전철은 어디로 갑니까?", "ako": "오사카로 갑니다."}, {"id": 44, "part": 2, "no": "44", "title": "행동", "q": "犬は寝ていますか。", "a": "いいえ、走っています。", "qr": "犬(いぬ)は寝(ね)ていますか。", "ar": "いいえ、走(はし)っています。", "situation": "개가 공원에서 달리고 있다.", "qko": "개는 자고 있습니까?", "ako": "아니요, 달리고 있습니다."}, {"id": 45, "part": 2, "no": "45", "title": "착용 여부", "q": "女の人は手袋をしていますか。", "a": "はい、しています。", "qr": "女(おんな)の人(ひと)は手袋(てぶくろ)をしていますか。", "ar": "はい、しています。", "situation": "여자가 장갑을 끼고 있다.", "qko": "여자는 장갑을 끼고 있습니까?", "ako": "네, 끼고 있습니다."}, {"id": 46, "part": 2, "no": "46", "title": "위치", "q": "タクシー乗り場はどこですか。", "a": "駅の前です。", "qr": "タクシー乗り場(のりば)はどこですか。", "ar": "駅(えき)の前(まえ)です。", "situation": "택시 승강장이 역 앞에 있다.", "qko": "택시 승강장은 어디입니까?", "ako": "역 앞입니다."}, {"id": 47, "part": 2, "no": "47", "title": "시설 상태", "q": "エスカレーターは使えますか。", "a": "いいえ、点検中なので使えません。", "qr": "エスカレーターは使(つか)えますか。", "ar": "いいえ、点検(てんけん)中(ちゅう)なので使(つか)えません。", "situation": "에스컬레이터에 점검 중 표시가 있다.", "qko": "에스컬레이터를 사용할 수 있습니까?", "ako": "아니요, 점검 중이라 사용할 수 없습니다."}, {"id": 48, "part": 2, "no": "48", "title": "선택", "q": "何を注文しますか。", "a": "コーヒーを注文します。", "qr": "何(なに)を注文(ちゅうもん)しますか。", "ar": "コーヒーを注文(ちゅうもん)します。", "situation": "주문표에서 커피에 체크되어 있다.", "qko": "무엇을 주문합니까?", "ako": "커피를 주문합니다."}, {"id": 49, "part": 2, "no": "49", "title": "상태", "q": "そのかばんは重いですか。", "a": "いいえ、軽いです。", "qr": "そのかばんは重(おも)いですか。", "ar": "いいえ、軽(かる)いです。", "situation": "여자가 작은 가방을 가볍게 들고 있다.", "qko": "그 가방은 무겁습니까?", "ako": "아니요, 가볍습니다."}, {"id": 50, "part": 2, "no": "50", "title": "가격", "q": "チケットはいくらですか。", "a": "千二百円です。", "qr": "チケットはいくらですか。", "ar": "千(せん)二百(にひゃく)円(えん)です。", "situation": "입장권에 1,200엔이라고 적혀 있다.", "qko": "입장권은 얼마입니까?", "ako": "1,200엔입니다."}, {"id": 51, "part": 3, "no": "01", "title": "친구·제안", "q": "昼ご飯のあと、コーヒーを飲みに行かない？", "a": "いいね。近くのカフェに行こう。", "qr": "昼ご飯(ひるごはん)のあと、コーヒーを飲(の)みに行(い)かない？", "ar": "いいね。近(ちか)くのカフェに行(い)こう。", "situation": "점심 먹고 커피 마시러 갈래?", "qko": "점심을 먹은 뒤 커피 마시러 가지 않을래?", "ako": "좋아. 근처 카페에 가자."}, {"id": 52, "part": 3, "no": "02", "title": "직장·확인", "q": "会議が三時に変更になったけど、聞いた？", "a": "うん、聞いたよ。予定表も直しておいた。", "qr": "会議(かいぎ)が三(さん)時(じ)に変更(へんこう)になったけど、聞(き)いた？", "ar": "うん、聞(き)いたよ。予定(よてい)表(ひょう)も直(なお)しておいた。", "situation": "회의가 3시로 변경됐는데 들었어?", "qko": "회의가 3시로 변경됐는데 들었어?", "ako": "응, 들었어. 일정표도 수정해 두었어."}, {"id": 53, "part": 3, "no": "03", "title": "친구·요청", "q": "窓を開けてもいい？", "a": "もちろん。少し空気を入れ替えよう。", "qr": "窓(まど)を開(あ)けてもいい？", "ar": "もちろん。少(すこ)し空気(くうき)を入れ替えよう(いれかえよう)。", "situation": "창문 좀 열어도 될까?", "qko": "창문을 열어도 될까?", "ako": "물론이지. 공기를 조금 환기하자."}, {"id": 54, "part": 3, "no": "04", "title": "친구·부탁", "q": "その辞書、貸してくれる？", "a": "いいよ。使い終わったら返してね。", "qr": "その辞書(じしょ)、貸(か)してくれる？", "ar": "いいよ。使(つか)い終(お)わったら返(かえ)してね。", "situation": "그 사전 좀 빌려줄 수 있어?", "qko": "그 사전 좀 빌려줄 수 있어?", "ako": "좋아. 다 쓰면 돌려줘."}, {"id": 55, "part": 3, "no": "05", "title": "친구·질문", "q": "そのスニーカー、どこで買ったの？", "a": "駅前の店で買ったよ。今、セール中だった。", "qr": "そのスニーカー、どこで買(か)ったの？", "ar": "駅前(えきまえ)の店(みせ)で買(か)ったよ。今(いま)、セール中(ちゅう)だった。", "situation": "그 운동화 어디서 샀어?", "qko": "그 운동화 어디에서 샀어?", "ako": "역 앞 가게에서 샀어. 지금 세일 중이었어."}, {"id": 56, "part": 3, "no": "06", "title": "약속·확인", "q": "長く待った？", "a": "ううん、十分くらいだよ。気にしないで。", "qr": "長(なが)く待(ま)った？", "ar": "ううん、十分(じゅっぷん)くらいだよ。気(き)にしないで。", "situation": "많이 기다렸어?", "qko": "오래 기다렸어?", "ako": "아니, 10분 정도야. 신경 쓰지 마."}, {"id": 57, "part": 3, "no": "07", "title": "직장·도움", "q": "この箱を運ぶのを手伝いましょうか。", "a": "ありがとうございます。では、そちらをお願いします。", "qr": "この箱(はこ)を運(はこ)ぶのを手伝い(てつだい)ましょうか。", "ar": "ありがとうございます。では、そちらをお願(ねが)いします。", "situation": "이 상자 옮기는 것 좀 도와줄까요?", "qko": "이 상자를 옮기는 것을 도와드릴까요?", "ako": "감사합니다. 그러면 그쪽 것을 부탁드립니다."}, {"id": 58, "part": 3, "no": "08", "title": "친구·이유", "q": "今日はどうして遅れたの？", "a": "電車が遅れたんだ。連絡できなくてごめん。", "qr": "今日(きょう)はどうして遅(おく)れたの？", "ar": "電車(でんしゃ)が遅(おく)れたんだ。連絡(れんらく)できなくてごめん。", "situation": "오늘 왜 늦었어?", "qko": "오늘은 왜 늦었어?", "ako": "전철이 지연됐어. 연락하지 못해서 미안해."}, {"id": 59, "part": 3, "no": "09", "title": "친구·제안", "q": "週末、山登りに行かない？", "a": "土曜日なら行けるよ。朝早く出発しよう。", "qr": "週末(しゅうまつ)、山登り(やまのぼり)に行(い)かない？", "ar": "土曜日(どようび)なら行(い)けるよ。朝(あさ)早(はや)く出発(しゅっぱつ)しよう。", "situation": "주말에 등산하러 갈래?", "qko": "주말에 등산하러 가지 않을래?", "ako": "토요일이라면 갈 수 있어. 아침 일찍 출발하자."}, {"id": 60, "part": 3, "no": "10", "title": "업무·기한", "q": "明日までに予約していただけますか。", "a": "はい、今日中に手配いたします。", "qr": "明日(あした)までに予約(よやく)していただけますか。", "ar": "はい、今日中(きょうじゅう)に手配(てはい)いたします。", "situation": "내일까지 예약해 주실 수 있습니까?", "qko": "내일까지 예약해 주실 수 있습니까?", "ako": "네, 오늘 안에 예약을 처리하겠습니다."}, {"id": 61, "part": 3, "no": "11", "title": "친구·상태", "q": "今日は少し疲れて見えるけど、大丈夫？", "a": "昨夜あまり眠れなかったんだ。今日は早く帰るよ。", "qr": "今日(きょう)は少(すこ)し疲(つか)れて見(み)えるけど、大丈夫(だいじょうぶ)？", "ar": "昨夜(さくや)あまり眠(ねむ)れなかったんだ。今日(きょう)は早(はや)く帰(かえ)るよ。", "situation": "오늘 좀 피곤해 보이는데 괜찮아?", "qko": "오늘 조금 피곤해 보이는데 괜찮아?", "ako": "어젯밤에 별로 못 잤어. 오늘은 일찍 돌아갈게."}, {"id": 62, "part": 3, "no": "12", "title": "친구·상황", "q": "傘を持ってこなかった。", "a": "私の傘に一緒に入って。駅までなら大丈夫だよ。", "qr": "傘(かさ)を持(も)ってこなかった。", "ar": "私(わたし)の傘(かさ)に一緒(いっしょ)に入(はい)って。駅(えき)までなら大丈夫(だいじょうぶ)だよ。", "situation": "우산을 안 가져왔어.", "qko": "우산을 가져오지 않았어.", "ako": "내 우산을 같이 쓰자. 역까지라면 괜찮아."}, {"id": 63, "part": 3, "no": "13", "title": "직장·문제", "q": "プリンターが動かないんですが。", "a": "紙が詰まっているようです。すぐ確認します。", "qr": "プリンターが動(うご)かないんですが。", "ar": "紙(かみ)が詰(つ)まっているようです。すぐ確認(かくにん)します。", "situation": "프린터가 작동하지 않는데요.", "qko": "프린터가 작동하지 않는데요.", "ako": "종이가 걸린 것 같습니다. 바로 확인하겠습니다."}, {"id": 64, "part": 3, "no": "14", "title": "업무·기한", "q": "金曜日までに報告書を提出できますか。", "a": "はい、木曜日までに仕上げる予定です。", "qr": "金曜日(きんようび)までに報告(ほうこく)書(しょ)を提出(ていしゅつ)できますか。", "ar": "はい、木曜日(もくようび)までに仕上げる(しあげる)予定(よてい)です。", "situation": "금요일까지 보고서를 제출할 수 있습니까?", "qko": "금요일까지 보고서를 제출할 수 있습니까?", "ako": "네, 목요일까지 완성할 예정입니다."}, {"id": 65, "part": 3, "no": "15", "title": "직장·환경", "q": "部屋が少し寒いですね。", "a": "そうですね。暖房の温度を少し上げましょう。", "qr": "部屋(へや)が少(すこ)し寒(さむ)いですね。", "ar": "そうですね。暖房(だんぼう)の温度(おんど)を少(すこ)し上(あ)げましょう。", "situation": "방이 조금 추운 것 같아요.", "qko": "방이 조금 춥네요.", "ako": "그러네요. 난방 온도를 조금 올립시다."}, {"id": 66, "part": 3, "no": "16", "title": "친구·상담", "q": "誕生日のプレゼント、何がいいかな。", "a": "普段使えるマグカップはどう？きっと喜ぶと思うよ。", "qr": "誕生日(たんじょうび)のプレゼント、何(なに)がいいかな。", "ar": "普段(ふだん)使(つか)えるマグカップはどう？きっと喜(よろこ)ぶと思(おも)うよ。", "situation": "생일 선물로 무엇이 좋을까?", "qko": "생일 선물로 무엇이 좋을까?", "ako": "평소에 쓸 수 있는 머그컵은 어때? 분명 좋아할 것 같아."}, {"id": 67, "part": 3, "no": "17", "title": "친구·초대", "q": "今日の夕食、一緒に食べない？", "a": "ごめん、今日は予定があるんだ。また今度誘って。", "qr": "今日(きょう)の夕食(ゆうしょく)、一緒(いっしょ)に食(た)べない？", "ar": "ごめん、今日(きょう)は予定(よてい)があるんだ。また今度(こんど)誘(さそ)って。", "situation": "오늘 저녁 같이 먹을래?", "qko": "오늘 저녁 같이 먹지 않을래?", "ako": "미안, 오늘은 일정이 있어. 다음에 또 불러 줘."}, {"id": 68, "part": 3, "no": "18", "title": "교통·상황", "q": "バスがまだ来ませんね。", "a": "そうですね。案内を見ると、あと五分で来るそうです。", "qr": "バスがまだ来(き)ませんね。", "ar": "そうですね。案内(あんない)を見(み)ると、あと五(ご)分(ふん)で来(く)るそうです。", "situation": "버스가 아직 안 오네요.", "qko": "버스가 아직 오지 않네요.", "ako": "그러네요. 안내를 보니 5분 뒤에 온다고 합니다."}, {"id": 69, "part": 3, "no": "19", "title": "시설·허가", "q": "この図書館では飲み物を飲んでもいいですか。", "a": "ふた付きの飲み物なら大丈夫です。", "qr": "この図書(としょ)館(かん)では飲み物(のみもの)を飲(の)んでもいいですか。", "ar": "ふた付(つ)きの飲み物(のみもの)なら大丈夫(だいじょうぶ)です。", "situation": "이 도서관에서 음료를 마셔도 될까요?", "qko": "이 도서관에서는 음료를 마셔도 될까요?", "ako": "뚜껑이 있는 음료라면 괜찮습니다."}, {"id": 70, "part": 3, "no": "20", "title": "약속·변경", "q": "約束を月曜日に変更できますか。", "a": "はい、月曜日の午後なら大丈夫です。", "qr": "約束(やくそく)を月曜日(げつようび)に変更(へんこう)できますか。", "ar": "はい、月曜日(げつようび)の午後(ごご)なら大丈夫(だいじょうぶ)です。", "situation": "약속을 월요일로 바꿀 수 있을까요?", "qko": "약속을 월요일로 변경할 수 있을까요?", "ako": "네, 월요일 오후라면 괜찮습니다."}, {"id": 71, "part": 3, "no": "21", "title": "친구·문제", "q": "財布をなくしたみたい。", "a": "まず交番に行こう。通った道も一緒に探すよ。", "qr": "財布(さいふ)をなくしたみたい。", "ar": "まず交番(こうばん)に行(い)こう。通(とお)った道(みち)も一緒(いっしょ)に探(さが)すよ。", "situation": "지갑을 잃어버린 것 같아.", "qko": "지갑을 잃어버린 것 같아.", "ako": "우선 파출소에 가자. 지나온 길도 같이 찾아볼게."}, {"id": 72, "part": 3, "no": "22", "title": "교통·제안", "q": "この電車はとても混んでいますね。", "a": "次の電車を待ちませんか。少し空いているかもしれません。", "qr": "この電車(でんしゃ)はとても混(こ)んでいますね。", "ar": "次(つぎ)の電車(でんしゃ)を待(ま)ちませんか。少(すこ)し空(あ)いているかもしれません。", "situation": "이 전철은 너무 붐비네요.", "qko": "이 전철은 매우 붐비네요.", "ako": "다음 전철을 기다리지 않겠습니까? 조금 덜 붐빌지도 모릅니다."}, {"id": 73, "part": 3, "no": "23", "title": "친구·질문", "q": "休みには何をする予定？", "a": "北海道へ旅行するつもりだよ。自然を楽しみたいんだ。", "qr": "休(やす)みには何(なに)をする予定(よてい)？", "ar": "北海道(ほっかいどう)へ旅行(りょこう)するつもりだよ。自然(しぜん)を楽(たの)しみたいんだ。", "situation": "휴가 때 무엇을 할 거야?", "qko": "휴가 때 무엇을 할 예정이야?", "ako": "홋카이도로 여행할 생각이야. 자연을 즐기고 싶어."}, {"id": 74, "part": 3, "no": "24", "title": "친구·칭찬", "q": "料理が本当に上手だね。", "a": "ありがとう。最近、毎週末練習しているんだ。", "qr": "料理(りょうり)が本当(ほんとう)に上手(じょうず)だね。", "ar": "ありがとう。最近(さいきん)、毎(まい)週末(しゅうまつ)練習(れんしゅう)しているんだ。", "situation": "요리를 정말 잘하네.", "qko": "요리를 정말 잘하네.", "ako": "고마워. 요즘 매주 주말에 연습하고 있어."}, {"id": 75, "part": 3, "no": "25", "title": "배송·문의", "q": "商品はいつ届きますか。", "a": "予定通りに明日の午前中に届く予定です。", "qr": "商品(しょうひん)はいつ届(とど)きますか。", "ar": "予定(よてい)通(どお)りに明日(あした)の午前中(ごぜんちゅう)に届(とど)く予定(よてい)です。", "situation": "상품은 언제 도착합니까?", "qko": "상품은 언제 도착합니까?", "ako": "예정대로 내일 오전 중에 도착할 예정입니다."}, {"id": 76, "part": 3, "no": "26", "title": "시설·안내", "q": "授乳室はどこにありますか。", "a": "二階のエレベーターの隣にございます。", "qr": "授乳(じゅにゅう)室(しつ)はどこにありますか。", "ar": "二(に)階(かい)のエレベーターの隣(となり)にございます。", "situation": "수유실은 어디에 있습니까?", "qko": "수유실은 어디에 있습니까?", "ako": "2층 엘리베이터 옆에 있습니다."}, {"id": 77, "part": 3, "no": "27", "title": "친구·문제", "q": "携帯電話の電池がもうほとんどない。", "a": "私の充電器を使って。かばんの中にあるよ。", "qr": "携帯(けいたい)電話(でんわ)の電池(でんち)がもうほとんどない。", "ar": "私(わたし)の充電(じゅうでん)器(き)を使(つか)って。かばんの中(なか)にあるよ。", "situation": "휴대전화 배터리가 거의 없어.", "qko": "휴대전화 배터리가 거의 없어.", "ako": "내 충전기를 써. 가방 안에 있어."}, {"id": 78, "part": 3, "no": "28", "title": "동료·제안", "q": "来月、社内のバドミントン大会に参加しませんか。", "a": "いいですね。日程を確認してから申し込みます。", "qr": "来月(らいげつ)、社内(しゃない)のバドミントン大会(たいかい)に参加(さんか)しませんか。", "ar": "いいですね。日程(にってい)を確認(かくにん)してから申し込み(もうしこみ)ます。", "situation": "다음 달 사내 배드민턴 대회에 참가하지 않을래요?", "qko": "다음 달 사내 배드민턴 대회에 참가하지 않겠습니까?", "ako": "좋습니다. 일정을 확인한 뒤 신청하겠습니다."}, {"id": 79, "part": 3, "no": "29", "title": "친구·요청", "q": "音楽の音が少し大きいと思う。", "a": "ごめん。すぐ音を小さくするね。", "qr": "音楽(おんがく)の音(おと)が少(すこ)し大(おお)きいと思(おも)う。", "ar": "ごめん。すぐ音(おと)を小(ちい)さくするね。", "situation": "음악 소리가 조금 큰 것 같아.", "qko": "음악 소리가 조금 큰 것 같아.", "ako": "미안해. 바로 소리를 줄일게."}, {"id": 80, "part": 3, "no": "30", "title": "식당·추천", "q": "どのメニューが一番人気ですか。", "a": "この店の定番はやはりオムライスですね。週に1回は食べに来ていると思います。", "qr": "どのメニューが一番(いちばん)人気(にんき)ですか。", "ar": "この店(みせ)の定番(ていばん)はやはりオムライスですね。週(しゅう)に1回(いっかい)は食(た)べに来(き)ていると思(おも)います。", "situation": "식당에서 가장 인기 있는 메뉴를 묻고 대표 메뉴를 소개하는 대화", "qko": "어떤 메뉴가 가장 인기 있습니까?", "ako": "이 가게의 대표 메뉴는 역시 오므라이스네요. 일주일에 한 번은 먹으러 오는 것 같습니다."}, {"id": 81, "part": 3, "no": "31", "title": "업무·가능", "q": "この仕事を今日中に終えられますか。", "a": "はい、優先して進めれば終えられます。", "qr": "この仕事(しごと)を今日中(きょうじゅう)に終(お)えられますか。", "ar": "はい、優先(ゆうせん)して進(すす)めれば終(お)えられます。", "situation": "이 일을 오늘 안에 끝낼 수 있습니까?", "qko": "이 일을 오늘 안에 끝낼 수 있습니까?", "ako": "네, 우선해서 진행하면 끝낼 수 있습니다."}, {"id": 82, "part": 3, "no": "32", "title": "직장·부탁", "q": "この資料を十部コピーしてください。", "a": "承知しました。会議の前までに用意します。", "qr": "この資料(しりょう)を十(じゅう)部(ぶ)コピーしてください。", "ar": "承知(しょうち)しました。会議(かいぎ)の前(まえ)までに用意(ようい)します。", "situation": "이 자료를 열 부 복사해 주세요.", "qko": "이 자료를 열 부 복사해 주세요.", "ako": "알겠습니다. 회의 전까지 준비하겠습니다."}, {"id": 83, "part": 3, "no": "33", "title": "공공장소·확인", "q": "この席、空いていますか。", "a": "はい、空いています。どうぞお座りください。", "qr": "この席(せき)、空(あ)いていますか。", "ar": "はい、空(あ)いています。どうぞお座(すわ)りください。", "situation": "이 자리 비어 있습니까?", "qko": "이 자리 비어 있습니까?", "ako": "네, 비어 있습니다. 앉으세요."}, {"id": 84, "part": 3, "no": "34", "title": "대화·요청", "q": "もう少しゆっくり話していただけますか。", "a": "はい、分かりました。ゆっくり説明します。", "qr": "もう少(すこ)しゆっくり話(はな)していただけますか。", "ar": "はい、分(わ)かりました。ゆっくり説明(せつめい)します。", "situation": "조금 천천히 말씀해 주실 수 있습니까?", "qko": "조금 더 천천히 말씀해 주실 수 있습니까?", "ako": "네, 알겠습니다. 천천히 설명하겠습니다."}, {"id": 85, "part": 3, "no": "35", "title": "친구·칭찬", "q": "新しい髪型、よく似合っているね。", "a": "ありがとう。少し短くしてみたんだ。", "qr": "新(あたら)しい髪型(かみがた)、よく似合っ(にあっ)ているね。", "ar": "ありがとう。少(すこ)し短(みじか)くしてみたんだ。", "situation": "새로 자른 머리가 잘 어울려.", "qko": "새로 자른 머리가 잘 어울려.", "ako": "고마워. 조금 짧게 잘라 봤어."}, {"id": 86, "part": 3, "no": "36", "title": "친구·알림", "q": "午後から雨が降るそうだよ。", "a": "そうなんだ。出かける前に傘を用意するよ。", "qr": "午後(ごご)から雨(あめ)が降(ふ)るそうだよ。", "ar": "そうなんだ。出(で)かける前(まえ)に傘(かさ)を用意(ようい)するよ。", "situation": "오후부터 비가 온대.", "qko": "오후부터 비가 온다고 해.", "ako": "그렇구나. 나가기 전에 우산을 준비할게."}, {"id": 87, "part": 3, "no": "37", "title": "예약·확인", "q": "ご予約のお名前をお願いします。", "a": "キム・ミナです。二名で予約しました。", "qr": "ご予約(よやく)のお名前(なまえ)をお願(ねが)いします。", "ar": "キム・ミナです。二(に)名(めい)で予約(よやく)しました。", "situation": "예약하신 성함을 말씀해 주세요.", "qko": "예약하신 성함을 말씀해 주세요.", "ako": "김미나입니다. 두 명으로 예약했습니다."}, {"id": 88, "part": 3, "no": "38", "title": "친구·부탁", "q": "場所の住所を送ってくれる？", "a": "もちろん。今、地図と一緒に送るね。", "qr": "場所(ばしょ)の住所(じゅうしょ)を送(おく)ってくれる？", "ar": "もちろん。今(いま)、地図(ちず)と一緒(いっしょ)に送(おく)るね。", "situation": "장소 주소를 보내 줄래?", "qko": "장소 주소를 보내 줄래?", "ako": "물론이지. 지금 지도와 함께 보낼게."}, {"id": 89, "part": 3, "no": "39", "title": "직장·확인", "q": "会議室は今使えますか。", "a": "三時までは空いているので、使えます。", "qr": "会議(かいぎ)室(しつ)は今(いま)使(つか)えますか。", "ar": "三(さん)時(じ)までは空(あ)いているので、使(つか)えます。", "situation": "회의실을 지금 사용할 수 있습니까?", "qko": "회의실을 지금 사용할 수 있습니까?", "ako": "3시까지는 비어 있으므로 사용할 수 있습니다."}, {"id": 90, "part": 3, "no": "40", "title": "친구·제안", "q": "今日はどんな映画を見る？", "a": "気楽に見られるコメディーはどう？", "qr": "今日(きょう)はどんな映画(えいが)を見(み)る？", "ar": "気楽(きらく)に見(み)られるコメディーはどう？", "situation": "오늘은 어떤 영화를 볼까?", "qko": "오늘은 어떤 영화를 볼까?", "ako": "편하게 볼 수 있는 코미디는 어때?"}, {"id": 91, "part": 3, "no": "41", "title": "직장·부탁", "q": "土曜日の勤務を代わってもらえますか。", "a": "午前中なら代われます。時間を確認しましょう。", "qr": "土曜日(どようび)の勤務(きんむ)を代(か)わってもらえますか。", "ar": "午前(ごぜん)中(ちゅう)なら代(か)われます。時間(じかん)を確認(かくにん)しましょう。", "situation": "토요일 근무를 대신해 줄 수 있습니까?", "qko": "토요일 근무를 대신해 줄 수 있습니까?", "ako": "오전이라면 대신할 수 있습니다. 시간을 확인합시다."}, {"id": 92, "part": 3, "no": "42", "title": "친구·관심", "q": "新しい携帯電話はどう？", "a": "画面が大きくて使いやすいよ。写真もきれいに撮れる。", "qr": "新(あたら)しい携帯(けいたい)電話(でんわ)はどう？", "ar": "画面(がめん)が大(おお)きくて使(つか)いやすいよ。写真(しゃしん)もきれいに撮(と)れる。", "situation": "새 휴대전화는 어때?", "qko": "새 휴대전화는 어때?", "ako": "화면이 커서 사용하기 편해. 사진도 선명하게 찍을 수 있어."}, {"id": 93, "part": 3, "no": "43", "title": "식당·확인", "q": "食べ物のアレルギーはありますか。", "a": "はい、えびにアレルギーがあります。", "qr": "食べ物(たべもの)のアレルギーはありますか。", "ar": "はい、えびにアレルギーがあります。", "situation": "음식 알레르기가 있으십니까?", "qko": "음식 알레르기가 있으십니까?", "ako": "네, 새우 알레르기가 있습니다."}, {"id": 94, "part": 3, "no": "44", "title": "업무·사과", "q": "資料の提出期限を過ぎています。", "a": "申し訳ありません。本日の午後までに必ず提出します。", "qr": "資料(しりょう)の提出(ていしゅつ)期限(きげん)を過(す)ぎています。", "ar": "申し訳(もうしわけ)ありません。本日(ほんじつ)の午後(ごご)までに必(かなら)ず提出(ていしゅつ)します。", "situation": "자료 제출 기한이 지났습니다.", "qko": "자료 제출 기한이 지났습니다.", "ako": "죄송합니다. 오늘 오후까지 반드시 제출하겠습니다."}, {"id": 95, "part": 3, "no": "45", "title": "직장·요청", "q": "エアコンの温度を少し下げてもいいですか。", "a": "はい、大丈夫です。ただ、下げすぎないでください。", "qr": "エアコンの温度(おんど)を少(すこ)し下(さ)げてもいいですか。", "ar": "はい、大丈夫(だいじょうぶ)です。ただ、下(さ)げすぎないでください。", "situation": "에어컨 온도를 조금 낮춰도 될까요?", "qko": "에어컨 온도를 조금 낮춰도 될까요?", "ako": "네, 괜찮습니다. 다만 너무 낮추지는 말아 주세요."}, {"id": 96, "part": 3, "no": "46", "title": "친구·제안", "q": "今週末、水族館に行かない？", "a": "いいね。午後は混みそうだから、午前中に行こう。", "qr": "今週(こんしゅう)末(まつ)、水族(すいぞく)館(かん)に行(い)かない？", "ar": "いいね。午後(ごご)は混(こ)みそうだから、午前(ごぜん)中(ちゅう)に行(い)こう。", "situation": "이번 주말에 수족관에 갈래?", "qko": "이번 주말에 수족관에 가지 않을래?", "ako": "좋아. 오후에는 붐빌 것 같으니 오전에 가자."}, {"id": 97, "part": 3, "no": "47", "title": "친구·부탁", "q": "自転車を一日だけ借りてもいい？", "a": "いいよ。でも、夜までには返してね。", "qr": "自転(じてん)車(しゃ)を一日(いちにち)だけ借(か)りてもいい？", "ar": "いいよ。でも、夜(よる)までには返(かえ)してね。", "situation": "자전거를 하루만 빌려도 될까?", "qko": "자전거를 하루만 빌려도 될까?", "ako": "좋아. 하지만 밤까지는 돌려줘."}, {"id": 98, "part": 3, "no": "48", "title": "동료·격려", "q": "明日の発表が心配で、とても緊張しています。", "a": "準備をしっかりしたので大丈夫ですよ。今夜は早く休んでください。", "qr": "明日(あした)の発表(はっぴょう)が心配(しんぱい)で、とても緊張(きんちょう)しています。", "ar": "準備(じゅんび)をしっかりしたので大丈夫(だいじょうぶ)ですよ。今夜(こんや)は早(はや)く休(やす)んでください。", "situation": "내일 발표라서 너무 긴장돼요.", "qko": "내일 발표가 걱정되어서 매우 긴장됩니다.", "ako": "준비를 충분히 했으니 괜찮습니다. 오늘 밤은 일찍 쉬세요."}, {"id": 99, "part": 3, "no": "49", "title": "배송·문제", "q": "届いた荷物がつぶれています。", "a": "申し訳ございません。状態を確認して、交換の手続きをいたします。", "qr": "届(とど)いた荷物(にもつ)がつぶれています。", "ar": "申し訳(もうしわけ)ございません。状態(じょうたい)を確認(かくにん)して、交換(こうかん)の手続き(てつづき)をいたします。", "situation": "받은 소포가 찌그러져 있습니다.", "qko": "도착한 소포가 찌그러져 있습니다.", "ako": "죄송합니다. 상태를 확인하고 교환 절차를 진행하겠습니다."}, {"id": 100, "part": 3, "no": "50", "title": "직장·상황", "q": "今日は社員食堂が休みだそうです。", "a": "では、近くの定食屋へ行きませんか。", "qr": "今日(きょう)は社員(しゃいん)食堂(しょくどう)が休(やす)みだそうです。", "ar": "では、近(ちか)くの定食(ていしょく)屋(や)へ行(い)きませんか。", "situation": "오늘은 사원식당이 문을 닫았대요.", "qko": "오늘은 사원식당이 쉰다고 합니다.", "ako": "그러면 근처의 백반집에 가지 않겠습니까?"}, {"id": 101, "part": 4, "no": "01", "title": "일상 습관", "q": "朝起きて、最初にすることは何ですか。", "a": "朝起きたら、まずカーテンを開けて水を一杯飲みます。そのあと、簡単にストレッチをして一日の予定を確認します。こうすると、気持ちよく一日を始められます。", "qr": "朝(あさ)起(お)きて、最初(さいしょ)にすることは何(なん)ですか。", "ar": "朝(あさ)起(お)きたら、まずカーテンを開(あ)けて水(みず)を一杯(いっぱい)飲(の)みます。そのあと、簡単(かんたん)にストレッチをして一日(いちにち)の予定(よてい)を確認(かくにん)します。こうすると、気持ち(きもち)よく一日(いちにち)を始(はじ)められます。", "situation": "", "qko": "아침에 일어나서 가장 먼저 하는 일은 무엇입니까?", "ako": "아침에 일어나면 먼저 커튼을 열고 물을 한 잔 마십니다. 그다음 간단히 스트레칭을 하고 하루 일정을 확인합니다. 이렇게 하면 기분 좋게 하루를 시작할 수 있습니다."}, {"id": 102, "part": 4, "no": "02", "title": "요리", "q": "普段、どのくらい料理をしますか。", "a": "平日は忙しいので簡単な料理を作り、週末には少し時間をかけて作ります。特に野菜を使った料理をよく作ります。自分で作ると健康にもよく、食費も節約できます。", "qr": "普段(ふだん)、どのくらい料理(りょうり)をしますか。", "ar": "平日(へいじつ)は忙(いそが)しいので簡単(かんたん)な料理(りょうり)を作(つく)り、週末(しゅうまつ)には少(すこ)し時間(じかん)をかけて作(つく)ります。特(とく)に野菜(やさい)を使(つか)った料理(りょうり)をよく作(つく)ります。自分(じぶん)で作(つく)ると健康(けんこう)にもよく、食費(しょくひ)も節約(せつやく)できます。", "situation": "", "qko": "평소에 얼마나 자주 요리합니까?", "ako": "평일에는 바빠서 간단한 요리를 만들고, 주말에는 조금 시간을 들여 요리합니다. 특히 채소를 사용한 요리를 자주 만듭니다. 직접 만들면 건강에도 좋고 식비도 절약할 수 있습니다."}, {"id": 103, "part": 4, "no": "03", "title": "운동", "q": "健康のためにしている運動がありますか。", "a": "私は週に三回、家の近くを三十分ほど歩いています。天気が悪い日は家で動画を見ながら運動します。無理なく続けられるので、体調管理に役立っています。", "qr": "健康(けんこう)のためにしている運動(うんどう)がありますか。", "ar": "私(わたし)は週(しゅう)に三(さん)回(かい)、家(いえ)の近(ちか)くを三十分(さんじゅっぷん)ほど歩(ある)いています。天気(てんき)が悪(わる)い日(ひ)は家(いえ)で動画(どうが)を見(み)ながら運動(うんどう)します。無理(むり)なく続(つづ)けられるので、体調(たいちょう)管理(かんり)に役立っ(やくだっ)ています。", "situation": "", "qko": "건강을 위해 하고 있는 운동이 있습니까?", "ako": "저는 일주일에 세 번 집 근처를 30분 정도 걷습니다. 날씨가 나쁜 날에는 집에서 영상을 보며 운동합니다. 무리 없이 계속할 수 있어서 건강 관리에 도움이 됩니다."}, {"id": 104, "part": 4, "no": "04", "title": "교통", "q": "普段、どんな交通手段をよく利用しますか。", "a": "私は主に地下鉄を利用します。時間が正確で、道路が混んでいても予定どおりに移動できるからです。短い距離なら、健康のために歩くようにしています。", "qr": "普段(ふだん)、どんな交通(こうつう)手段(しゅだん)をよく利用(りよう)しますか。", "ar": "私(わたし)は主(おも)に地下(ちか)鉄(てつ)を利用(りよう)します。時間(じかん)が正確(せいかく)で、道路(どうろ)が混(こ)んでいても予定(よてい)どおりに移動(いどう)できるからです。短(みじか)い距離(きょり)なら、健康(けんこう)のために歩(ある)くようにしています。", "situation": "", "qko": "평소 어떤 교통수단을 자주 이용합니까?", "ako": "저는 주로 지하철을 이용합니다. 시간이 정확하고 도로가 막혀도 예정대로 이동할 수 있기 때문입니다. 짧은 거리라면 건강을 위해 걸으려고 합니다."}, {"id": 105, "part": 4, "no": "05", "title": "여행 경험", "q": "今までで一番印象に残っている旅行について話してください。", "a": "一番印象に残っているのは、家族と済州島へ行った旅行です。海の景色がきれいで、地元の料理も楽しめました。久しぶりに家族とゆっくり話せたことが特に心に残っています。", "qr": "今(いま)までで一番(いちばん)印象(いんしょう)に残(のこ)っている旅行(りょこう)について話(はな)してください。", "ar": "一番(いちばん)印象(いんしょう)に残(のこ)っているのは、家族(かぞく)と済州島(ちぇじゅど)へ行(い)った旅行(りょこう)です。海(うみ)の景色(けしき)がきれいで、地元(じもと)の料理(りょうり)も楽(たの)しめました。久(ひさ)しぶりに家族(かぞく)とゆっくり話(はな)せたことが特(とく)に心(こころ)に残(のこ)っています。", "situation": "", "qko": "지금까지 가장 인상에 남은 여행에 대해 말해 주세요.", "ako": "가장 인상에 남은 것은 가족과 제주도에 간 여행입니다. 바다 풍경이 아름다웠고 현지 음식도 즐길 수 있었습니다. 오랜만에 가족과 여유롭게 이야기할 수 있었던 것이 특히 기억에 남습니다."}, {"id": 106, "part": 4, "no": "06", "title": "계절", "q": "一年の中で、どの季節が一番好きですか。", "a": "私は秋が一番好きです。暑すぎず寒すぎないので、外で活動しやすいからです。また、紅葉を見ながら散歩すると気分転換になります。", "qr": "一(いち)年(ねん)の中(なか)で、どの季節(きせつ)が一番(いちばん)好(す)きですか。", "ar": "私(わたし)は秋(あき)が一番(いちばん)好(す)きです。暑(あつ)すぎず寒(さむ)すぎないので、外(そと)で活動(かつどう)しやすいからです。また、紅葉(こうよう)を見(み)ながら散歩(さんぽ)すると気分(きぶん)転換(てんかん)になります。", "situation": "", "qko": "일 년 중 어느 계절을 가장 좋아합니까?", "ako": "저는 가을을 가장 좋아합니다. 너무 덥지도 춥지도 않아서 야외 활동을 하기 좋기 때문입니다. 또한 단풍을 보며 산책하면 기분 전환이 됩니다."}, {"id": 107, "part": 4, "no": "07", "title": "독서", "q": "本を読む習慣がありますか。", "a": "はい、寝る前に二十分ほど本を読むようにしています。最近は仕事や生活に役立つ実用書をよく読みます。本を読むと新しい考え方を学べるので、これからも続けたいです。", "qr": "本(ほん)を読(よ)む習慣(しゅうかん)がありますか。", "ar": "はい、寝(ね)る前(まえ)に二十分(にじゅっぷん)ほど本(ほん)を読(よ)むようにしています。最近(さいきん)は仕事(しごと)や生活(せいかつ)に役立つ(やくだつ)実用(じつよう)書(しょ)をよく読(よ)みます。本(ほん)を読(よ)むと新(あたら)しい考(かんが)え方(かた)を学(まな)べるので、これからも続(つづ)けたいです。", "situation": "", "qko": "책을 읽는 습관이 있습니까?", "ako": "네, 자기 전에 20분 정도 책을 읽으려고 합니다. 요즘은 일이나 생활에 도움이 되는 실용서를 자주 읽습니다. 책을 읽으면 새로운 사고방식을 배울 수 있어서 앞으로도 계속하고 싶습니다."}, {"id": 108, "part": 4, "no": "08", "title": "음악", "q": "普段、どんな音楽を聞きますか。", "a": "私は通勤中に明るいポップスをよく聞きます。音楽を聞くと気分がよくなり、仕事を始める前に元気が出ます。疲れた日は落ち着いた曲を選びます。", "qr": "普段(ふだん)、どんな音楽(おんがく)を聞(き)きますか。", "ar": "私(わたし)は通勤(つうきん)中(ちゅう)に明(あか)るいポップスをよく聞(き)きます。音楽(おんがく)を聞(き)くと気分(きぶん)がよくなり、仕事(しごと)を始(はじ)める前(まえ)に元気(げんき)が出(で)ます。疲(つか)れた日(ひ)は落ち着い(おちつい)た曲(きょく)を選(えら)びます。", "situation": "", "qko": "평소 어떤 음악을 듣습니까?", "ako": "저는 출퇴근 중에 밝은 팝 음악을 자주 듣습니다. 음악을 들으면 기분이 좋아지고 일을 시작하기 전에 활력이 생깁니다. 피곤한 날에는 차분한 곡을 고릅니다."}, {"id": 109, "part": 4, "no": "09", "title": "영화", "q": "映画館で映画を見ることがありますか。", "a": "はい、二、三か月に一度ぐらい映画館へ行きます。大きな画面と迫力のある音で見ると、作品に集中できます。特に話題になった映画は映画館で見たいと思います。", "qr": "映画(えいが)館(かん)で映画(えいが)を見(み)ることがありますか。", "ar": "はい、二(に)、三(さん)か月(かげつ)に一(いち)度(ど)ぐらい映画(えいが)館(かん)へ行(い)きます。大(おお)きな画面(がめん)と迫力(はくりょく)のある音(おと)で見(み)ると、作品(さくひん)に集中(しゅうちゅう)できます。特(とく)に話題(わだい)になった映画(えいが)は映画(えいが)館(かん)で見(み)たいと思(おも)います。", "situation": "", "qko": "영화관에서 영화를 보는 일이 있습니까?", "ako": "네, 두세 달에 한 번 정도 영화관에 갑니다. 큰 화면과 박력 있는 소리로 보면 작품에 집중할 수 있습니다. 특히 화제가 된 영화는 영화관에서 보고 싶습니다."}, {"id": 110, "part": 4, "no": "10", "title": "반려동물", "q": "動物を飼ったことがありますか。", "a": "子どものころに犬を飼ったことがあります。毎日散歩をしたので、責任を持って世話をする大切さを学びました。機会があれば、また動物と暮らしたいです。", "qr": "動物(どうぶつ)を飼(か)ったことがありますか。", "ar": "子(こ)どものころに犬(いぬ)を飼(か)ったことがあります。毎日(まいにち)散歩(さんぽ)をしたので、責任(せきにん)を持(も)って世話(せわ)をする大切(たいせつ)さを学(まな)びました。機会(きかい)があれば、また動物(どうぶつ)と暮(く)らしたいです。", "situation": "", "qko": "동물을 키워 본 적이 있습니까?", "ako": "어렸을 때 개를 키운 적이 있습니다. 매일 산책을 했기 때문에 책임감을 가지고 돌보는 중요성을 배웠습니다. 기회가 있다면 다시 동물과 함께 살고 싶습니다."}, {"id": 111, "part": 4, "no": "11", "title": "학습 동기", "q": "日本語を勉強し始めた理由は何ですか。", "a": "日本の旅行番組を見て、文化や言葉に興味を持ったことがきっかけです。勉強を続けるうちに、日本人と直接話してみたいと思うようになりました。今は自然な会話ができることを目標にしています。", "qr": "日本語(にほんご)を勉強(べんきょう)し始(はじ)めた理由(りゆう)は何(なん)ですか。", "ar": "日本(にほん)の旅行(りょこう)番組(ばんぐみ)を見(み)て、文化(ぶんか)や言葉(ことば)に興味(きょうみ)を持(も)ったことがきっかけです。勉強(べんきょう)を続(つづ)けるうちに、日本人(にほんじん)と直接(ちょくせつ)話(はな)してみたいと思(おも)うようになりました。今(いま)は自然(しぜん)な会話(かいわ)ができることを目標(もくひょう)にしています。", "situation": "", "qko": "일본어 공부를 시작한 이유는 무엇입니까?", "ako": "일본 여행 프로그램을 보고 문화와 언어에 관심을 갖게 된 것이 계기입니다. 공부를 계속하면서 일본인과 직접 이야기해 보고 싶다고 생각하게 되었습니다. 지금은 자연스럽게 대화하는 것을 목표로 하고 있습니다."}, {"id": 112, "part": 4, "no": "12", "title": "스마트폰", "q": "一日にどのくらいスマートフォンを使いますか。", "a": "仕事の連絡や調べ物を含めると、二時間ぐらい使います。ただし、寝る前はなるべく見ないようにしています。使う時間を決めると、生活のリズムを守りやすくなります。", "qr": "一日(いちにち)にどのくらいスマートフォンを使(つか)いますか。", "ar": "仕事(しごと)の連絡(れんらく)や調べ物(しらべもの)を含(ふく)めると、二(に)時間(じかん)ぐらい使(つか)います。ただし、寝(ね)る前(まえ)はなるべく見(み)ないようにしています。使(つか)う時間(じかん)を決(き)めると、生活(せいかつ)のリズムを守(まも)りやすくなります。", "situation": "", "qko": "하루에 스마트폰을 얼마나 사용합니까?", "ako": "업무 연락이나 검색을 포함하면 두 시간 정도 사용합니다. 다만 자기 전에는 되도록 보지 않으려고 합니다. 사용하는 시간을 정하면 생활 리듬을 지키기 쉬워집니다."}, {"id": 113, "part": 4, "no": "13", "title": "주말", "q": "週末はどのように過ごすことが多いですか。", "a": "土曜日は外出して用事を済ませ、日曜日は家でゆっくりすることが多いです。時間があれば友人に会ったり、好きな番組を見たりします。週末に十分休むと、翌週も頑張れます。", "qr": "週末(しゅうまつ)はどのように過(す)ごすことが多(おお)いですか。", "ar": "土曜日(どようび)は外出(がいしゅつ)して用事(ようじ)を済(す)ませ、日曜日(にちようび)は家(いえ)でゆっくりすることが多(おお)いです。時間(じかん)があれば友人(ゆうじん)に会(あ)ったり、好(す)きな番組(ばんぐみ)を見(み)たりします。週末(しゅうまつ)に十分(じゅうぶん)休(やす)むと、翌週(よくしゅう)も頑張れ(がんばれ)ます。", "situation": "", "qko": "주말에는 어떻게 보내는 경우가 많습니까?", "ako": "토요일에는 외출해서 볼일을 보고, 일요일에는 집에서 쉬는 경우가 많습니다. 시간이 있으면 친구를 만나거나 좋아하는 프로그램을 봅니다. 주말에 충분히 쉬면 다음 주에도 힘낼 수 있습니다."}, {"id": 114, "part": 4, "no": "14", "title": "아침 식사", "q": "毎朝、朝ご飯を食べますか。", "a": "はい、忙しくても必ず何か食べるようにしています。普段は果物とヨーグルト、卵などを簡単に食べます。朝ご飯を食べると午前中に集中しやすくなります。", "qr": "毎朝(まいあさ)、朝ご飯(あさごはん)を食(た)べますか。", "ar": "はい、忙(いそが)しくても必(かなら)ず何(なに)か食(た)べるようにしています。普段(ふだん)は果物(くだもの)とヨーグルト、卵(たまご)などを簡単(かんたん)に食(た)べます。朝ご飯(あさごはん)を食(た)べると午前(ごぜん)中(ちゅう)に集中(しゅうちゅう)しやすくなります。", "situation": "", "qko": "매일 아침 아침 식사를 합니까?", "ako": "네, 바빠도 반드시 무언가를 먹으려고 합니다. 평소에는 과일과 요구르트, 달걀 등을 간단히 먹습니다. 아침을 먹으면 오전에 집중하기 쉬워집니다."}, {"id": 115, "part": 4, "no": "15", "title": "인간관계", "q": "友人とはどのように連絡を取りますか。", "a": "普段はメッセージアプリで連絡を取ります。急いでいるときや大切な話があるときは電話をします。時々直接会って話すことも、関係を保つために大切だと思います。", "qr": "友人(ゆうじん)とはどのように連絡(れんらく)を取(と)りますか。", "ar": "普段(ふだん)はメッセージアプリで連絡(れんらく)を取(と)ります。急(いそ)いでいるときや大切(たいせつ)な話(はなし)があるときは電話(でんわ)をします。時々(ときどき)直接(ちょくせつ)会(あ)って話(はな)すことも、関係(かんけい)を保(たも)つために大切(たいせつ)だと思(おも)います。", "situation": "", "qko": "친구와는 어떻게 연락합니까?", "ako": "평소에는 메신저 앱으로 연락합니다. 급할 때나 중요한 이야기가 있을 때는 전화합니다. 가끔 직접 만나서 이야기하는 것도 관계를 유지하는 데 중요하다고 생각합니다."}, {"id": 116, "part": 4, "no": "16", "title": "가사", "q": "家ではどんな家事を担当していますか。", "a": "私は主に洗濯とごみ出しを担当しています。家族と役割を分けることで、一人に負担が集中しないようにしています。忙しいときはお互いに手伝うことも大切です。", "qr": "家(いえ)ではどんな家事(かじ)を担当(たんとう)していますか。", "ar": "私(わたし)は主(おも)に洗濯(せんたく)とごみ出し(ごみだし)を担当(たんとう)しています。家族(かぞく)と役割(やくわり)を分(わ)けることで、一人(ひとり)に負担(ふたん)が集中(しゅうちゅう)しないようにしています。忙(いそが)しいときはお互(たが)いに手伝う(てつだう)ことも大切(たいせつ)です。", "situation": "", "qko": "집에서는 어떤 집안일을 담당하고 있습니까?", "ako": "저는 주로 빨래와 쓰레기 버리기를 담당합니다. 가족과 역할을 나누어 한 사람에게 부담이 집중되지 않도록 합니다. 바쁠 때는 서로 돕는 것도 중요합니다."}, {"id": 117, "part": 4, "no": "17", "title": "저축", "q": "お金を貯めるために工夫していることはありますか。", "a": "毎月、給料をもらったら先に一定の金額を貯金します。また、必要のない物はすぐに買わず、一日考えるようにしています。この方法で無駄な出費がかなり減りました。", "qr": "お金(かね)を貯(た)めるために工夫(くふう)していることはありますか。", "ar": "毎月(まいつき)、給料(きゅうりょう)をもらったら先(さき)に一定(いってい)の金額(きんがく)を貯金(ちょきん)します。また、必要(ひつよう)のない物(もの)はすぐに買(か)わず、一日(いちにち)考(かんが)えるようにしています。この方法(ほうほう)で無駄(むだ)な出費(しゅっぴ)がかなり減(へ)りました。", "situation": "", "qko": "돈을 모으기 위해 노력하는 것이 있습니까?", "ako": "매달 월급을 받으면 먼저 일정 금액을 저축합니다. 또한 필요하지 않은 물건은 바로 사지 않고 하루 동안 생각하려고 합니다. 이 방법으로 불필요한 지출이 상당히 줄었습니다."}, {"id": 118, "part": 4, "no": "18", "title": "온라인 수업", "q": "オンライン授業を受けたことがありますか。", "a": "はい、資格の勉強のために受けたことがあります。移動時間がなく、自分のペースで復習できる点が便利でした。ただ、集中できる環境を作ることが必要だと思います。", "qr": "オンライン授業(じゅぎょう)を受(う)けたことがありますか。", "ar": "はい、資格(しかく)の勉強(べんきょう)のために受(う)けたことがあります。移動(いどう)時間(じかん)がなく、自分(じぶん)のペースで復習(ふくしゅう)できる点(てん)が便利(べんり)でした。ただ、集中(しゅうちゅう)できる環境(かんきょう)を作(つく)ることが必要(ひつよう)だと思(おも)います。", "situation": "", "qko": "온라인 수업을 들어 본 적이 있습니까?", "ako": "네, 자격증 공부를 위해 들어 본 적이 있습니다. 이동 시간이 들지 않고 자신의 속도에 맞춰 복습할 수 있다는 점이 편리했습니다. 다만 집중할 수 있는 환경을 만드는 것이 필요하다고 생각합니다."}, {"id": 119, "part": 4, "no": "19", "title": "사진", "q": "写真を撮るのが好きですか。", "a": "はい、旅行先や日常の小さな出来事を撮るのが好きです。あとで写真を見ると、そのときの気持ちまで思い出せます。ただし、撮ることに夢中になりすぎないようにしています。", "qr": "写真(しゃしん)を撮(と)るのが好(す)きですか。", "ar": "はい、旅行(りょこう)先(さき)や日常(にちじょう)の小(ちい)さな出来事(できごと)を撮(と)るのが好(す)きです。あとで写真(しゃしん)を見(み)ると、そのときの気持ち(きもち)まで思い出せ(おもいだせ)ます。ただし、撮(と)ることに夢中(むちゅう)になりすぎないようにしています。", "situation": "", "qko": "사진 찍는 것을 좋아합니까?", "ako": "네, 여행지나 일상의 작은 일을 찍는 것을 좋아합니다. 나중에 사진을 보면 그때의 감정까지 떠올릴 수 있습니다. 다만 사진을 찍는 데 너무 몰두하지 않으려고 합니다."}, {"id": 120, "part": 4, "no": "20", "title": "선물", "q": "人にプレゼントを選ぶとき、何を大切にしますか。", "a": "相手の趣味や普段の生活を考えて選びます。高い物よりも、実際に使える物のほうが喜ばれると思います。また、短いメッセージを添えるようにしています。", "qr": "人(ひと)にプレゼントを選(えら)ぶとき、何(なに)を大切(たいせつ)にしますか。", "ar": "相手(あいて)の趣味(しゅみ)や普段(ふだん)の生活(せいかつ)を考(かんが)えて選(えら)びます。高(たか)い物(もの)よりも、実際(じっさい)に使(つか)える物(もの)のほうが喜(よろこ)ばれると思(おも)います。また、短(みじか)いメッセージを添(そ)えるようにしています。", "situation": "", "qko": "다른 사람에게 선물을 고를 때 무엇을 중요하게 생각합니까?", "ako": "상대방의 취미와 평소 생활을 생각해서 고릅니다. 비싼 물건보다 실제로 사용할 수 있는 실용적인 물건이 더 환영받는다고 생각합니다. 또한 짧은 메시지를 함께 적으려고 합니다."}, {"id": 121, "part": 4, "no": "21", "title": "외식", "q": "外食するとき、どんな店を選びますか。", "a": "料理がおいしいことはもちろんですが、店内が清潔で落ち着いている店を選びます。友人と行く場合は、みんなが食べられるメニューがあるかも確認します。予約できる店なら、待ち時間も減らせます。", "qr": "外食(がいしょく)するとき、どんな店(みせ)を選(えら)びますか。", "ar": "料理(りょうり)がおいしいことはもちろんですが、店内(てんない)が清潔(せいけつ)で落ち着い(おちつい)ている店(みせ)を選(えら)びます。友人(ゆうじん)と行(い)く場合(ばあい)は、みんなが食(た)べられるメニューがあるかも確認(かくにん)します。予約(よやく)できる店(みせ)なら、待(ま)ち時間(じかん)も減(へ)らせます。", "situation": "", "qko": "외식할 때 어떤 가게를 고릅니까?", "ako": "음식이 맛있는 것은 물론이고 매장이 깨끗하고 편안한 가게를 고릅니다. 친구와 갈 경우에는 모두가 먹을 수 있는 메뉴가 있는지도 확인합니다. 예약할 수 있는 가게라면 대기 시간도 줄일 수 있습니다."}, {"id": 122, "part": 4, "no": "22", "title": "날씨", "q": "どんな天気の日が好きですか。", "a": "私は晴れていて風が少しある日が好きです。外を歩いても気持ちがよく、洗濯物もよく乾くからです。そんな日は公園を散歩したくなります。", "qr": "どんな天気(てんき)の日(ひ)が好(す)きですか。", "ar": "私(わたし)は晴(は)れていて風(かぜ)が少(すこ)しある日(ひ)が好(す)きです。外(そと)を歩(ある)いても気持ち(きもち)がよく、洗濯(せんたく)物(もの)もよく乾(かわ)くからです。そんな日(ひ)は公園(こうえん)を散歩(さんぽ)したくなります。", "situation": "", "qko": "어떤 날씨의 날을 좋아합니까?", "ako": "저는 맑고 바람이 조금 부는 날을 좋아합니다. 밖을 걸어도 기분이 좋고 빨래도 잘 마르기 때문입니다. 그런 날에는 공원을 산책하고 싶어집니다."}, {"id": 123, "part": 4, "no": "23", "title": "통근", "q": "通勤や通学にどのくらい時間がかかりますか。", "a": "家から職場まで約四十分かかります。地下鉄を一回乗り換える必要がありますが、車内ではニュースを読んで過ごします。混雑を避けるため、少し早めに家を出ています。", "qr": "通勤(つうきん)や通学(つうがく)にどのくらい時間(じかん)がかかりますか。", "ar": "家(いえ)から職場(しょくば)まで約(やく)四十分(よんじゅっぷん)かかります。地下(ちか)鉄(てつ)を一回(いっかい)乗り換える(のりかえる)必要(ひつよう)がありますが、車内(しゃない)ではニュースを読(よ)んで過(す)ごします。混雑(こんざつ)を避(さ)けるため、少(すこ)し早(はや)めに家(いえ)を出(で)ています。", "situation": "", "qko": "출퇴근이나 통학에 얼마나 시간이 걸립니까?", "ako": "집에서 직장까지 약 40분 걸립니다. 지하철을 한 번 갈아타야 하지만, 차 안에서는 뉴스를 읽으며 시간을 보냅니다. 혼잡을 피하기 위해 조금 일찍 집을 나섭니다."}, {"id": 124, "part": 4, "no": "24", "title": "스트레스 해소", "q": "ストレスがたまったとき、どうしますか。", "a": "私は一人で散歩をしたり、好きな音楽を聞いたりします。少し体を動かすと、考えが整理されて気持ちが落ち着きます。それでも大変なときは、信頼できる人に相談します。", "qr": "ストレスがたまったとき、どうしますか。", "ar": "私(わたし)は一人(ひとり)で散歩(さんぽ)をしたり、好(す)きな音楽(おんがく)を聞(き)いたりします。少(すこ)し体(からだ)を動(うご)かすと、考(かんが)えが整理(せいり)されて気持ち(きもち)が落ち着き(おちつき)ます。それでも大変(たいへん)なときは、信頼(しんらい)できる人(ひと)に相談(そうだん)します。", "situation": "", "qko": "스트레스가 쌓였을 때 어떻게 합니까?", "ako": "저는 혼자 산책하거나 좋아하는 음악을 듣습니다. 몸을 조금 움직이면 생각이 정리되고 마음이 안정됩니다. 그래도 힘들 때는 믿을 수 있는 사람에게 상담합니다."}, {"id": 125, "part": 4, "no": "25", "title": "지역 활동", "q": "地域の行事に参加したことがありますか。", "a": "はい、近所の清掃活動に参加したことがあります。普段話す機会がない近所の人と知り合うことができました。町もきれいになったので、参加してよかったと思います。", "qr": "地域(ちいき)の行事(ぎょうじ)に参加(さんか)したことがありますか。", "ar": "はい、近所(きんじょ)の清掃(せいそう)活動(かつどう)に参加(さんか)したことがあります。普段(ふだん)話(はな)す機会(きかい)がない近所(きんじょ)の人(ひと)と知り合う(しりあう)ことができました。町(まち)もきれいになったので、参加(さんか)してよかったと思(おも)います。", "situation": "", "qko": "지역 행사에 참가한 적이 있습니까?", "ako": "네, 동네 청소 활동에 참가한 적이 있습니다. 평소 이야기할 기회가 없는 이웃과 알게 되었습니다. 동네도 깨끗해져서 참가하기를 잘했다고 생각합니다."}, {"id": 126, "part": 4, "no": "26", "title": "수면", "q": "よく眠るために気をつけていることは何ですか。", "a": "寝る一時間前からは、なるべくスマートフォンを見ないようにしています。また、午後遅くにはコーヒーを飲まないようにしています。毎日同じ時間に寝ると、朝も起きやすくなります。", "qr": "よく眠(ねむ)るために気(き)をつけていることは何(なん)ですか。", "ar": "寝(ね)る一(いち)時間(じかん)前(まえ)からは、なるべくスマートフォンを見(み)ないようにしています。また、午後(ごご)遅(おそ)くにはコーヒーを飲(の)まないようにしています。毎日(まいにち)同(おな)じ時間(じかん)に寝(ね)ると、朝(あさ)も起(お)きやすくなります。", "situation": "", "qko": "잘 자기 위해 주의하고 있는 것은 무엇입니까?", "ako": "잠들기 한 시간 전부터는 되도록 스마트폰을 보지 않으려고 합니다. 또한 늦은 오후에는 커피를 마시지 않으려고 합니다. 매일 같은 시간에 자면 아침에도 일어나기 쉬워집니다."}, {"id": 127, "part": 4, "no": "27", "title": "혼자 여행", "q": "一人で旅行することについてどう思いますか。", "a": "自分の好きな場所へ自由に行けるので、よい経験だと思います。一方で、安全や荷物の管理には十分注意する必要があります。短い旅行から始めれば、安心して楽しめると思います。", "qr": "一人(ひとり)で旅行(りょこう)することについてどう思(おも)いますか。", "ar": "自分(じぶん)の好(す)きな場所(ばしょ)へ自由(じゆう)に行(い)けるので、よい経験(けいけん)だと思(おも)います。一方(いっぽう)で、安全(あんぜん)や荷物(にもつ)の管理(かんり)には十分(じゅうぶん)注意(ちゅうい)する必要(ひつよう)があります。短(みじか)い旅行(りょこう)から始(はじ)めれば、安心(あんしん)して楽(たの)しめると思(おも)います。", "situation": "", "qko": "혼자 여행하는 것에 대해 어떻게 생각합니까?", "ako": "자신이 좋아하는 장소에 자유롭게 갈 수 있어서 좋은 경험이라고 생각합니다. 한편 안전과 짐 관리에는 충분히 주의할 필요가 있습니다. 짧은 여행부터 시작하면 안심하고 즐길 수 있다고 생각합니다."}, {"id": 128, "part": 4, "no": "28", "title": "편의점", "q": "コンビニエンスストアをよく利用しますか。", "a": "はい、飲み物や日用品を急いで買いたいときに利用します。遅い時間でも開いているので便利です。ただ、必要以上に買わないように気をつけています。", "qr": "コンビニエンスストアをよく利用(りよう)しますか。", "ar": "はい、飲み物(のみもの)や日用(にちよう)品(ひん)を急(いそ)いで買(か)いたいときに利用(りよう)します。遅(おそ)い時間(じかん)でも開(あ)いているので便利(べんり)です。ただ、必要(ひつよう)以上(いじょう)に買(か)わないように気(き)をつけています。", "situation": "", "qko": "편의점을 자주 이용합니까?", "ako": "네, 음료나 생활용품을 급하게 사고 싶을 때 이용합니다. 늦은 시간에도 열려 있어서 편리합니다. 다만 필요 이상으로 사지 않도록 주의하고 있습니다."}, {"id": 129, "part": 4, "no": "29", "title": "카페", "q": "カフェではどのように過ごしますか。", "a": "静かなカフェでは、本を読んだり予定を整理したりします。家とは違う環境なので、短い時間でも集中できます。混んでいるときは長く席を使わないようにしています。", "qr": "カフェではどのように過(す)ごしますか。", "ar": "静(しず)かなカフェでは、本(ほん)を読(よ)んだり予定(よてい)を整理(せいり)したりします。家(いえ)とは違(ちが)う環境(かんきょう)なので、短(みじか)い時間(じかん)でも集中(しゅうちゅう)できます。混(こ)んでいるときは長(なが)く席(せき)を使(つか)わないようにしています。", "situation": "", "qko": "카페에서는 어떻게 시간을 보냅니까?", "ako": "조용한 카페에서는 책을 읽거나 일정을 정리합니다. 집과 다른 환경이라 짧은 시간이라도 집중할 수 있습니다. 붐빌 때는 오랫동안 자리를 차지하지 않으려고 합니다."}, {"id": 130, "part": 4, "no": "30", "title": "요리 경험", "q": "家族や友人のために料理を作ったことがありますか。", "a": "はい、友人の誕生日にパスタとサラダを作ったことがあります。事前に好きな味を聞いて準備したので、とても喜んでくれました。誰かのために作ると、料理がもっと楽しく感じられます。", "qr": "家族(かぞく)や友人(ゆうじん)のために料理(りょうり)を作(つく)ったことがありますか。", "ar": "はい、友人(ゆうじん)の誕生日(たんじょうび)にパスタとサラダを作(つく)ったことがあります。事前(じぜん)に好(す)きな味(あじ)を聞(き)いて準備(じゅんび)したので、とても喜(よろこ)んでくれました。誰(だれ)かのために作(つく)ると、料理(りょうり)がもっと楽(たの)しく感(かん)じられます。", "situation": "", "qko": "가족이나 친구를 위해 요리한 적이 있습니까?", "ako": "네, 친구 생일에 파스타와 샐러드를 만든 적이 있습니다. 미리 좋아하는 맛을 물어보고 준비했더니 친구가 매우 기뻐해 주었습니다. 누군가를 위해 만들면 요리가 더 즐겁게 느껴집니다."}, {"id": 131, "part": 4, "no": "31", "title": "스포츠 관람", "q": "スポーツの試合を見るのが好きですか。", "a": "はい、特にサッカーの試合をよく見ます。応援しているチームの試合は、家族と一緒に見るとさらに楽しいです。選手の努力を見ると、私も頑張ろうという気持ちになります。", "qr": "スポーツの試合(しあい)を見(み)るのが好(す)きですか。", "ar": "はい、特(とく)にサッカーの試合(しあい)をよく見(み)ます。応援(おうえん)しているチームの試合(しあい)は、家族(かぞく)と一緒(いっしょ)に見(み)るとさらに楽(たの)しいです。選手(せんしゅ)の努力(どりょく)を見(み)ると、私(わたし)も頑張ろう(がんばろう)という気持ち(きもち)になります。", "situation": "", "qko": "스포츠 경기를 보는 것을 좋아합니까?", "ako": "네, 특히 축구 경기를 자주 봅니다. 응원하는 팀의 경기는 가족과 함께 보면 더욱 즐겁습니다. 선수들의 노력을 보면 저도 힘내야겠다는 마음이 듭니다."}, {"id": 132, "part": 4, "no": "32", "title": "소셜 미디어", "q": "SNSを使うとき、気をつけていることは何ですか。", "a": "個人情報が分かる写真や内容は載せないようにしています。また、情報をすぐ信じず、必要なら他の資料も確認します。使う時間が長くなりすぎないことも大切です。", "qr": "SNSを使(つか)うとき、気(き)をつけていることは何(なん)ですか。", "ar": "個人(こじん)情報(じょうほう)が分(わ)かる写真(しゃしん)や内容(ないよう)は載(の)せないようにしています。また、情報(じょうほう)をすぐ信(しん)じず、必要(ひつよう)なら他(ほか)の資料(しりょう)も確認(かくにん)します。使(つか)う時間(じかん)が長(なが)くなりすぎないことも大切(たいせつ)です。", "situation": "", "qko": "소셜 미디어를 사용할 때 주의하는 것은 무엇입니까?", "ako": "개인정보를 알 수 있는 사진이나 내용은 올리지 않으려고 합니다. 또한 정보를 바로 믿지 않고 필요하면 다른 자료도 확인합니다. 사용하는 시간이 너무 길어지지 않도록 하는 것도 중요합니다."}, {"id": 133, "part": 4, "no": "33", "title": "공원", "q": "家の近くに、よく行く公園がありますか。", "a": "はい、歩いて十分ほどの場所に大きな公園があります。週末にはそこで散歩したり、ベンチで休んだりします。木が多くて静かなので、よい気分転換になります。", "qr": "家(いえ)の近(ちか)くに、よく行(い)く公園(こうえん)がありますか。", "ar": "はい、歩(ある)いて十分(じゅっぷん)ほどの場所(ばしょ)に大(おお)きな公園(こうえん)があります。週末(しゅうまつ)にはそこで散歩(さんぽ)したり、ベンチで休(やす)んだりします。木(き)が多(おお)くて静(しず)かなので、よい気分(きぶん)転換(てんかん)になります。", "situation": "", "qko": "집 근처에 자주 가는 공원이 있습니까?", "ako": "네, 걸어서 10분 정도인 곳에 큰 공원이 있습니다. 주말에는 그곳에서 산책하거나 벤치에서 쉽니다. 나무가 많고 조용해서 좋은 기분 전환이 됩니다."}, {"id": 134, "part": 4, "no": "34", "title": "학습 도구", "q": "語学学習のアプリを使ったことがありますか。", "a": "はい、単語を復習するために毎日使っています。短い時間でも勉強でき、間違えた問題を繰り返し練習できる点が便利です。ただ、会話練習は人と直接する必要もあると思います。", "qr": "語学(ごがく)学習(がくしゅう)のアプリを使(つか)ったことがありますか。", "ar": "はい、単語(たんご)を復習(ふくしゅう)するために毎日(まいにち)使(つか)っています。短(みじか)い時間(じかん)でも勉強(べんきょう)でき、間違え(まちがえ)た問題(もんだい)を繰り返し(くりかえし)練習(れんしゅう)できる点(てん)が便利(べんり)です。ただ、会話(かいわ)練習(れんしゅう)は人(ひと)と直接(ちょくせつ)する必要(ひつよう)もあると思(おも)います。", "situation": "", "qko": "어학 학습 앱을 사용해 본 적이 있습니까?", "ako": "네, 단어를 복습하기 위해 매일 사용하고 있습니다. 짧은 시간에도 공부할 수 있고 틀린 문제를 반복해서 연습할 수 있다는 점이 편리합니다. 다만 회화 연습은 사람과 직접 할 필요도 있다고 생각합니다."}, {"id": 135, "part": 4, "no": "35", "title": "시간 관리", "q": "忙しいとき、どのように時間を管理しますか。", "a": "まず、その日に必ず終える仕事を三つ決めます。そして、時間がかかる仕事から先に始めます。予定を細かく入れすぎないことで、急な用事にも対応できます。", "qr": "忙(いそが)しいとき、どのように時間(じかん)を管理(かんり)しますか。", "ar": "まず、その日(ひ)に必(かなら)ず終(お)える仕事(しごと)を三(みっ)つ決(き)めます。そして、時間(じかん)がかかる仕事(しごと)から先(さき)に始(はじ)めます。予定(よてい)を細(こま)かく入(い)れすぎないことで、急(きゅう)な用事(ようじ)にも対応(たいおう)できます。", "situation": "", "qko": "바쁠 때 어떻게 시간을 관리합니까?", "ako": "먼저 그날 반드시 끝낼 일을 세 가지 정합니다. 그리고 시간이 많이 걸리는 일부터 먼저 시작합니다. 일정을 너무 빽빽하게 잡지 않으면 갑작스러운 일에도 대응할 수 있습니다."}, {"id": 136, "part": 4, "no": "36", "title": "의복 선택", "q": "服を選ぶとき、どんな点を重視しますか。", "a": "私はデザインよりも、着心地と動きやすさを重視します。また、持っている服と合わせやすい色を選びます。長く着られる物を選ぶことが、無駄を減らすことにもつながります。", "qr": "服(ふく)を選(えら)ぶとき、どんな点(てん)を重視(じゅうし)しますか。", "ar": "私(わたし)はデザインよりも、着心地(きごこち)と動(うご)きやすさを重視(じゅうし)します。また、持(も)っている服(ふく)と合(あ)わせやすい色(いろ)を選(えら)びます。長(なが)く着(き)られる物(もの)を選(えら)ぶことが、無駄(むだ)を減(へ)らすことにもつながります。", "situation": "", "qko": "옷을 고를 때 어떤 점을 중요하게 생각합니까?", "ako": "저는 디자인보다 착용감과 활동하기 편한지를 중요하게 생각합니다. 또한 가지고 있는 옷과 맞추기 쉬운 색을 고릅니다. 오래 입을 수 있는 옷을 고르는 것이 낭비를 줄이는 데도 도움이 됩니다."}, {"id": 137, "part": 4, "no": "37", "title": "환경 보호", "q": "環境のために普段していることはありますか。", "a": "買い物には自分の袋を持って行き、使い捨ての物を減らしています。また、使っていない部屋の電気はすぐ消します。小さな行動でも、毎日続けることが大切だと思います。", "qr": "環境(かんきょう)のために普段(ふだん)していることはありますか。", "ar": "買い物(かいもの)には自分(じぶん)の袋(ふくろ)を持(も)って行(い)き、使い捨て(つかいすて)の物(もの)を減(へ)らしています。また、使(つか)っていない部屋(へや)の電気(でんき)はすぐ消(け)します。小(ちい)さな行動(こうどう)でも、毎日(まいにち)続(つづ)けることが大切(たいせつ)だと思(おも)います。", "situation": "", "qko": "환경을 위해 평소 실천하는 것이 있습니까?", "ako": "장을 볼 때 개인 가방을 가지고 가서 일회용품을 줄이고 있습니다. 또한 사용하지 않는 방의 불은 바로 끕니다. 작은 행동이라도 매일 계속하는 것이 중요하다고 생각합니다."}, {"id": 138, "part": 4, "no": "38", "title": "도서관", "q": "図書館を利用することがありますか。", "a": "はい、静かな場所で勉強したいときに利用します。必要な本を借りられるだけでなく、集中しやすい環境も魅力です。返却日を忘れないように、予定表に記録しています。", "qr": "図書(としょ)館(かん)を利用(りよう)することがありますか。", "ar": "はい、静(しず)かな場所(ばしょ)で勉強(べんきょう)したいときに利用(りよう)します。必要(ひつよう)な本(ほん)を借(か)りられるだけでなく、集中(しゅうちゅう)しやすい環境(かんきょう)も魅力(みりょく)です。返却日(へんきゃくび)を忘(わす)れないように、予定(よてい)表(ひょう)に記録(きろく)しています。", "situation": "", "qko": "도서관을 이용하는 일이 있습니까?", "ako": "네, 조용한 곳에서 공부하고 싶을 때 이용합니다. 필요한 책을 빌릴 수 있을 뿐 아니라 집중하기 쉬운 환경도 매력적입니다. 반납일을 잊지 않도록 일정표에 기록합니다."}, {"id": 139, "part": 4, "no": "39", "title": "회의", "q": "会議で意見を言うとき、気をつけていることは何ですか。", "a": "最初に結論を簡潔に話し、そのあとに理由を説明します。また、他の人の意見を最後まで聞いてから発言します。短く分かりやすく話すことが大切だと思います。", "qr": "会議(かいぎ)で意見(いけん)を言(い)うとき、気(き)をつけていることは何(なん)ですか。", "ar": "最初(さいしょ)に結論(けつろん)を簡潔(かんけつ)に話(はな)し、そのあとに理由(りゆう)を説明(せつめい)します。また、他(た)の人(ひと)の意見(いけん)を最後(さいご)まで聞(き)いてから発言(はつげん)します。短(みじか)く分(わ)かりやすく話(はな)すことが大切(たいせつ)だと思(おも)います。", "situation": "", "qko": "회의에서 의견을 말할 때 주의하는 것은 무엇입니까?", "ako": "먼저 결론을 간단히 말하고 그다음 이유를 설명합니다. 또한 다른 사람의 의견을 끝까지 들은 후 발언합니다. 짧고 이해하기 쉽게 말하는 것이 중요하다고 생각합니다."}, {"id": 140, "part": 4, "no": "40", "title": "휴가", "q": "長い休みが取れたら、何をしたいですか。", "a": "一週間ほど休めたら、自然が多い場所でゆっくり過ごしたいです。観光地をたくさん回るより、地元の料理を食べたり散歩したりしたいです。十分休んで、新しい気持ちで仕事に戻りたいです。", "qr": "長(なが)い休(やす)みが取(と)れたら、何(なに)をしたいですか。", "ar": "一週間(いっしゅうかん)ほど休(やす)めたら、自然(しぜん)が多(おお)い場所(ばしょ)でゆっくり過(す)ごしたいです。観光(かんこう)地(ち)をたくさん回(まわ)るより、地元(じもと)の料理(りょうり)を食(た)べたり散歩(さんぽ)したりしたいです。十分(じゅうぶん)休(やす)んで、新(あたら)しい気持ち(きもち)で仕事(しごと)に戻(もど)りたいです。", "situation": "", "qko": "긴 휴가를 받을 수 있다면 무엇을 하고 싶습니까?", "ako": "일주일 정도 쉴 수 있다면 자연이 많은 곳에서 여유롭게 지내고 싶습니다. 관광지를 많이 돌아보기보다 현지 음식을 먹거나 산책하고 싶습니다. 충분히 쉬고 새로운 마음으로 업무에 돌아오고 싶습니다."}, {"id": 141, "part": 4, "no": "41", "title": "공연 경험", "q": "音楽のライブに行ったことがありますか。", "a": "はい、一度友人と好きな歌手のライブに行きました。会場の雰囲気がとてもよく、観客と一緒に歌ったことが印象に残っています。また機会があれば行きたいです。", "qr": "音楽(おんがく)のライブに行(い)ったことがありますか。", "ar": "はい、一(いち)度(ど)友人(ゆうじん)と好(す)きな歌手(かしゅ)のライブに行(い)きました。会場(かいじょう)の雰囲気(ふんいき)がとてもよく、観客(かんきゃく)と一緒(いっしょ)に歌(うた)ったことが印象(いんしょう)に残(のこ)っています。また機会(きかい)があれば行(い)きたいです。", "situation": "", "qko": "음악 공연에 가 본 적이 있습니까?", "ako": "네, 한 번 친구와 좋아하는 가수의 공연에 갔습니다. 공연장 분위기가 매우 좋았고 관객과 함께 노래한 것이 기억에 남습니다. 다시 기회가 있다면 가고 싶습니다."}, {"id": 142, "part": 4, "no": "42", "title": "건강 관리", "q": "体調を崩さないために、どんなことをしていますか。", "a": "できるだけ決まった時間に食事をし、十分に眠るようにしています。また、手洗いを習慣にして、疲れたときは無理をしません。普段から体調の変化に気づくことが大切です。", "qr": "体調(たいちょう)を崩(くず)さないために、どんなことをしていますか。", "ar": "できるだけ決(き)まった時間(じかん)に食事(しょくじ)をし、十分(じゅうぶん)に眠(ねむ)るようにしています。また、手洗い(てあらい)を習慣(しゅうかん)にして、疲(つか)れたときは無理(むり)をしません。普段(ふだん)から体調(たいちょう)の変化(へんか)に気(き)づくことが大切(たいせつ)です。", "situation": "", "qko": "몸 상태가 나빠지지 않도록 어떤 일을 하고 있습니까?", "ako": "가능한 한 정해진 시간에 식사하고 충분히 자려고 합니다. 또한 손 씻기를 습관으로 하고 피곤할 때는 무리하지 않습니다. 평소부터 몸 상태의 변화를 알아차리는 것이 중요합니다."}, {"id": 143, "part": 4, "no": "43", "title": "이사 경험", "q": "引っ越しをしたことがありますか。", "a": "はい、仕事の関係で二年前に引っ越しました。荷物を整理するのは大変でしたが、通勤時間が短くなって生活が楽になりました。引っ越す前に周辺の環境を確認することが大切だと思います。", "qr": "引っ越し(ひっこし)をしたことがありますか。", "ar": "はい、仕事(しごと)の関係(かんけい)で二(に)年(ねん)前(まえ)に引っ越し(ひっこし)ました。荷物(にもつ)を整理(せいり)するのは大変(たいへん)でしたが、通勤(つうきん)時間(じかん)が短(みじか)くなって生活(せいかつ)が楽(らく)になりました。引っ越す(ひっこす)前(まえ)に周辺(しゅうへん)の環境(かんきょう)を確認(かくにん)することが大切(たいせつ)だと思(おも)います。", "situation": "", "qko": "이사한 적이 있습니까?", "ako": "네, 업무 때문에 2년 전에 이사했습니다. 짐을 정리하는 것은 힘들었지만 출퇴근 시간이 짧아져 생활이 편해졌습니다. 이사하기 전에 주변 환경을 확인하는 것이 중요하다고 생각합니다."}, {"id": 144, "part": 4, "no": "44", "title": "전자 결제", "q": "現金を使わない支払いについてどう思いますか。", "a": "支払いが早く、利用履歴も確認できるので便利だと思います。ただし、使った金額を意識しにくい点には注意が必要です。私は予算を決めて使うようにしています。", "qr": "現金(げんきん)を使(つか)わない支払い(しはらい)についてどう思(おも)いますか。", "ar": "支払い(しはらい)が早(はや)く、利用(りよう)履歴(りれき)も確認(かくにん)できるので便利(べんり)だと思(おも)います。ただし、使(つか)った金額(きんがく)を意識(いしき)しにくい点(てん)には注意(ちゅうい)が必要(ひつよう)です。私(わたし)は予算(よさん)を決(き)めて使(つか)うようにしています。", "situation": "", "qko": "현금을 사용하지 않는 결제에 대해 어떻게 생각합니까?", "ako": "결제가 빠르고 이용 내역도 확인할 수 있어서 편리하다고 생각합니다. 다만 사용한 금액을 의식하기 어려운 점에는 주의가 필요합니다. 저는 예산을 정해서 사용하려고 합니다."}, {"id": 145, "part": 4, "no": "45", "title": "자전거", "q": "自転車を利用することがありますか。", "a": "天気のよい日に、近所へ行くとき利用します。歩くより早く、車を使うほどでもない距離に便利です。安全のため、夜はライトをつけて交通ルールを守ります。", "qr": "自転(じてん)車(しゃ)を利用(りよう)することがありますか。", "ar": "天気(てんき)のよい日(ひ)に、近所(きんじょ)へ行(い)くとき利用(りよう)します。歩(ある)くより早(はや)く、車(くるま)を使(つか)うほどでもない距離(きょり)に便利(べんり)です。安全(あんぜん)のため、夜(よる)はライトをつけて交通(こうつう)ルールを守(まも)ります。", "situation": "", "qko": "자전거를 이용하는 일이 있습니까?", "ako": "날씨가 좋은 날에 가까운 곳에 갈 때 이용합니다. 걷는 것보다 빠르고 차를 사용할 정도는 아닌 거리에 편리합니다. 안전을 위해 밤에는 불을 켜고 교통 규칙을 지킵니다."}, {"id": 146, "part": 4, "no": "46", "title": "비 오는 날", "q": "雨の日はどのように過ごしますか。", "a": "外出する予定がなければ、家で映画を見たり料理をしたりします。雨の音を聞きながら本を読むのも好きです。出かける場合は、時間に余裕を持って行動します。", "qr": "雨(あめ)の日(ひ)はどのように過(す)ごしますか。", "ar": "外出(がいしゅつ)する予定(よてい)がなければ、家(いえ)で映画(えいが)を見(み)たり料理(りょうり)をしたりします。雨(あめ)の音(おと)を聞(き)きながら本(ほん)を読(よ)むのも好(す)きです。出(で)かける場合(ばあい)は、時間(じかん)に余裕(よゆう)を持(も)って行動(こうどう)します。", "situation": "", "qko": "비 오는 날에는 어떻게 지냅니까?", "ako": "외출할 예정이 없으면 집에서 영화를 보거나 요리합니다. 빗소리를 들으며 책을 읽는 것도 좋아합니다. 외출할 경우에는 시간에 여유를 두고 움직입니다."}, {"id": 147, "part": 4, "no": "47", "title": "시험 준비", "q": "試験の勉強をするとき、どのように計画を立てますか。", "a": "まず試験日から逆に考えて、一週間ごとの目標を決めます。苦手な部分には多めに時間を使い、週末に復習します。無理な計画にしないことが、最後まで続けるために重要です。", "qr": "試験(しけん)の勉強(べんきょう)をするとき、どのように計画(けいかく)を立(た)てますか。", "ar": "まず試験日(しけんび)から逆(ぎゃく)に考(かんが)えて、一週間(いっしゅうかん)ごとの目標(もくひょう)を決(き)めます。苦手(にがて)な部分(ぶぶん)には多(おお)めに時間(じかん)を使(つか)い、週末(しゅうまつ)に復習(ふくしゅう)します。無理(むり)な計画(けいかく)にしないことが、最後(さいご)まで続(つづ)けるために重要(じゅうよう)です。", "situation": "", "qko": "시험 공부를 할 때 어떻게 계획을 세웁니까?", "ako": "먼저 시험일부터 거꾸로 계산해 일주일 단위의 목표를 정합니다. 부족한 부분에는 시간을 더 많이 쓰고 주말에 복습합니다. 무리한 계획을 세우지 않는 것이 끝까지 계속하는 데 중요합니다."}, {"id": 148, "part": 4, "no": "48", "title": "재택근무", "q": "在宅勤務についてどう思いますか。", "a": "通勤時間を減らせるので、効率的な働き方だと思います。一方で、仕事と休む時間の区別が難しくなることがあります。始業と終業の時間を決め、同僚とこまめに連絡することが必要です。", "qr": "在宅(ざいたく)勤務(きんむ)についてどう思(おも)いますか。", "ar": "通勤(つうきん)時間(じかん)を減(へ)らせるので、効率(こうりつ)的(てき)な働(はたら)き方(かた)だと思(おも)います。一方(いっぽう)で、仕事(しごと)と休(やす)む時間(じかん)の区別(くべつ)が難(むずか)しくなることがあります。始業(しぎょう)と終業(しゅうぎょう)の時間(じかん)を決(き)め、同僚(どうりょう)とこまめに連絡(れんらく)することが必要(ひつよう)です。", "situation": "", "qko": "재택근무에 대해 어떻게 생각합니까?", "ako": "출퇴근 시간을 줄일 수 있어서 효율적인 근무 방식이라고 생각합니다. 한편 일하는 시간과 쉬는 시간을 구분하기 어려워질 수 있습니다. 업무 시작과 종료 시간을 정하고 동료와 자주 연락할 필요가 있습니다."}, {"id": 149, "part": 4, "no": "49", "title": "새로운 기술", "q": "これから新しく身につけたいことは何ですか。", "a": "私は動画編集の技術を身につけたいです。仕事の資料や学習内容を、分かりやすく伝えるのに役立つと思うからです。まず基本的なソフトの使い方から少しずつ学びたいです。", "qr": "これから新(あたら)しく身(み)につけたいことは何(なん)ですか。", "ar": "私(わたし)は動画(どうが)編集(へんしゅう)の技術(ぎじゅつ)を身(み)につけたいです。仕事(しごと)の資料(しりょう)や学習(がくしゅう)内容(ないよう)を、分(わ)かりやすく伝(つた)えるのに役立つ(やくだつ)と思(おも)うからです。まず基本(きほん)的(てき)なソフトの使(つか)い方(かた)から少(すこ)しずつ学(まな)びたいです。", "situation": "", "qko": "앞으로 새롭게 익히고 싶은 것은 무엇입니까?", "ako": "저는 영상 편집 기술을 익히고 싶습니다. 업무 자료나 학습 내용을 이해하기 쉽게 전달하는 데 도움이 된다고 생각하기 때문입니다. 먼저 기본적인 프로그램 사용법부터 조금씩 배우고 싶습니다."}, {"id": 150, "part": 4, "no": "50", "title": "직장 소통", "q": "職場でよい人間関係を作るために、何が大切だと思いますか。", "a": "相手の話をよく聞き、必要な情報を早めに共有することが大切だと思います。また、間違いがあったときは言い訳せず、すぐに伝えるべきです。日頃のあいさつや感謝の言葉も、信頼関係につながります。", "qr": "職場(しょくば)でよい人間(にんげん)関係(かんけい)を作(つく)るために、何(なに)が大切(たいせつ)だと思(おも)いますか。", "ar": "相手(あいて)の話(はなし)をよく聞(き)き、必要(ひつよう)な情報(じょうほう)を早(はや)めに共有(きょうゆう)することが大切(たいせつ)だと思(おも)います。また、間違い(まちがい)があったときは言い訳(いいわけ)せず、すぐに伝(つた)えるべきです。日頃(ひごろ)のあいさつや感謝(かんしゃ)の言葉(ことば)も、信頼(しんらい)関係(かんけい)につながります。", "situation": "", "qko": "직장에서 좋은 인간관계를 만들기 위해 무엇이 중요하다고 생각합니까?", "ako": "상대방의 말을 잘 듣고 필요한 정보를 일찍 공유하는 것이 중요하다고 생각합니다. 또한 실수가 있었을 때는 변명하지 않고 바로 알려야 합니다. 평소의 인사와 감사의 말도 신뢰 관계로 이어집니다."}];
const $=id=>document.getElementById(id);const AUTO_DELAY=5000,PROGRESS_KEY='sjpt150-last-progress-v1';let autoPlaying=false,autoTimer=null,restoringProgress=false;let stars=new Set();try{stars=new Set(JSON.parse(localStorage.getItem('sjpt150-stars-v1')||'[]'))}catch{}let filtered=[...DATA],index=0,back=false,onlyStars=false,mode='card';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ruby(s){return esc(s).replace(/([一-龯々〆ヵヶ][一-龯々〆ヵヶぁ-ゖー]*?)\(([ぁ-ゖー]+)\)/g,'<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>')}
function translation(c){return '<dl class="translations">'+(c.situation?'<dt>상황</dt><dd>'+esc(c.situation)+'</dd>':'')+'<dt>질문</dt><dd>'+esc(c.qko)+'</dd><dt>답안</dt><dd>'+esc(c.ako)+'</dd></dl>'}
function stop(){activeUtterance=null;if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
let activeUtterance=null;
function speak(c,answer){
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('message').textContent='이 브라우저는 음성 재생을 지원하지 않습니다. Chrome 등 다른 브라우저에서 열어 주세요.';return}
 const synth=window.speechSynthesis;
 synth.cancel();
 const u=new SpeechSynthesisUtterance(answer?c.a:c.q);
 activeUtterance=u;
 u.lang='ja-JP';u.rate=.85;u.pitch=1;u.volume=1;
 const voices=synth.getVoices();
 const japanese=voices.filter(v=>/^ja(?:-|$)/i.test(v.lang));
 const voice=japanese.find(v=>v.default)||japanese.find(v=>v.localService)||japanese[0];
 if(voice)u.voice=voice;
 $('message').textContent='음성 재생을 요청했습니다…';
 u.onstart=()=>{if(activeUtterance===u)$('message').textContent='일본어 음성 재생 중…'};
 u.onend=()=>{if(activeUtterance===u){$('message').textContent='';activeUtterance=null}};
 u.onerror=e=>{if(activeUtterance!==u)return;activeUtterance=null;if(e.error==='canceled'||e.error==='interrupted'){$('message').textContent='';return}$('message').textContent='음성을 재생하지 못했습니다. 안드로이드 설정의 텍스트 음성 변환에서 일본어 음성 데이터를 설치한 뒤 Chrome에서 다시 시도해 주세요.'};
 try{if(synth.paused)synth.resume();synth.speak(u)}catch(e){activeUtterance=null;$('message').textContent='음성 재생을 시작하지 못했습니다. Chrome에서 열고 일본어 음성 설정을 확인해 주세요.'}
}

function clearAutoTimers(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}}
function updateAutoStatus(){const button=$('autoPlay');if(!button)return;button.classList.toggle('active',autoPlaying);button.setAttribute('aria-pressed',autoPlaying);button.textContent=autoPlaying?'■':'▶';const label=autoPlaying?'자동 넘김 정지':'자동 넘김 시작';button.setAttribute('aria-label',label);button.title=label}
function stopAuto(){autoPlaying=false;clearAutoTimers();updateAutoStatus()}
function scheduleAuto(){clearAutoTimers();if(!autoPlaying||!filtered.length||mode!=='card'){stopAuto();return}autoTimer=setTimeout(()=>{clearAutoTimers();stop();let movedToNext=false;if(back){index=(index+1)%filtered.length;back=false;movedToNext=true}else back=true;render();speak(filtered[index],back);scheduleAuto()},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stop();return}if(!filtered.length)return;mode='card';back=false;autoPlaying=true;updateAutoStatus();render();speak(filtered[index],false);scheduleAuto()}

function saveProgress(){if(restoringProgress)return;const c=filtered[index];if(!c)return;try{localStorage.setItem(PROGRESS_KEY,JSON.stringify({cardId:c.id,part:String(c.part),back,mode}))}catch{}}
function restoreProgress(){let saved;try{saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch{return false}if(!saved||!DATA.some(c=>c.id===saved.cardId))return false;restoringProgress=true;try{$('part').value=['2','3','4'].includes(String(saved.part))?String(saved.part):'3';$('number').value='';$('search').value='';onlyStars=false;mode=saved.mode==='list'?'list':'card';apply();const savedIndex=filtered.findIndex(c=>c.id===saved.cardId);if(savedIndex<0)return false;index=savedIndex;back=Boolean(saved.back);render();return true}finally{restoringProgress=false}}

function toggleStar(id){stars.has(id)?stars.delete(id):stars.add(id);try{localStorage.setItem('sjpt150-stars-v1',JSON.stringify([...stars]))}catch{$('message').textContent='이 브라우저에서는 별표를 영구 저장할 수 없습니다.'}if(onlyStars)apply();else render()}
function apply(){stopAuto();stop();const q=$('search').value.toLowerCase().trim();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('number').value||c.no==$('number').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;render()}
function render(){const c=filtered[index];$('starFilter').textContent='★ 별표 ('+stars.size+')';$('starFilter').classList.toggle('active',onlyStars);$('starFilter').setAttribute('aria-pressed',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('star').hidden=!c||mode!=='card';$('speak').hidden=!c||mode!=='card';$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`제${c.part}부 · ${c.no}번`:'';if(!c)return;
$('star').textContent=stars.has(c.id)?'★':'☆';$('star').setAttribute('aria-pressed',stars.has(c.id));$('card').classList.toggle('back',back);$('card').innerHTML=`<div class="cardTop"><span>제${c.part}부 · ${c.no} | ${esc(c.title)}</span><span>${back?'답변':'질문'}</span></div><div class="sentence ${(back?c.a:c.q).length>55?'long':''}" lang="ja">${back?'A.':'Q.'} ${ruby(back?c.ar:c.qr)}</div>${back?translation(c):''}<div class="hint">${back?'다시 탭하면 질문으로 돌아갑니다':'탭하여 답변과 해석 확인'}</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';
if(mode==='list')$('listView').innerHTML=filtered.map(c=>`<article class="listitem"><div class="row"><h2>제${c.part}부 · ${c.no} | ${esc(c.title)}</h2><button class="star" data-star="${c.id}" aria-label="${c.no}번 별표" aria-pressed="${stars.has(c.id)}">${stars.has(c.id)?'★':'☆'}</button><button data-q="${c.id}">질문</button><button data-a="${c.id}">답변</button></div><p class="listSentence" lang="ja">Q. ${ruby(c.qr)}</p><p class="listSentence" lang="ja">A. ${ruby(c.ar)}</p>${translation(c)}</article>`).join('');saveProgress()}
function flip(){if(!filtered.length)return;stop();back=!back;render();if(autoPlaying)scheduleAuto()}
function move(n){if(!filtered.length)return;stop();index=(index+n+filtered.length)%filtered.length;back=false;render();if(autoPlaying)scheduleAuto()}
$('autoPlay').onclick=toggleAuto;$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('star').onclick=()=>toggleStar(filtered[index].id);$('speak').onclick=()=>speak(filtered[index],back);$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{stopAuto();stop();mode='card';render()};$('listMode').onclick=()=>{stopAuto();stop();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('number').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=apply;$('shuffle').onclick=()=>{stopAuto();stop();for(let i=filtered.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;back=false;render()};$('listView').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.star)toggleStar(+b.dataset.star);else speak(DATA.find(c=>c.id===+(b.dataset.q||b.dataset.a)),!!b.dataset.a)};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.code==='Space'&&!e.altKey&&!e.metaKey){e.preventDefault();if(!e.repeat)toggleAuto();return}if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)||mode!=='card')return;if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'){e.preventDefault();move(1)}});for(let i=1;i<=50;i++){const v=String(i).padStart(2,'0');$('number').add(new Option(v+'번',v))}if(!restoreProgress())apply();updateAutoStatus();
</script></html>
