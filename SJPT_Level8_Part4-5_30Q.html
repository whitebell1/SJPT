<script>
const QUESTION_RUBY={"1":"<ruby>毎日<rt>まいにち</rt></ruby>の<ruby>生活<rt>せいかつ</rt></ruby>で、<ruby>意識<rt>いしき</rt></ruby>して<ruby>続け<rt>つづけ</rt></ruby>ている<ruby>習慣<rt>しゅうかん</rt></ruby>は<ruby>何で<rt>なんで</rt></ruby>すか。<ruby>続け<rt>つづけ</rt></ruby>ている<ruby>理由<rt>りゆう</rt></ruby>も<ruby>教え<rt>おしえ</rt></ruby>てください。","2":"<ruby>忙しい<rt>いそがしい</rt></ruby><ruby>一日<rt>ついたち</rt></ruby>を<ruby>終え<rt>おえ</rt></ruby>た<ruby>後<rt>のち</rt></ruby>、どのように<ruby>気分<rt>きぶん</rt></ruby>を<ruby>切り替え<rt>きりかえ</rt></ruby>ていますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","3":"<ruby>時間<rt>じかん</rt></ruby>を<ruby>節約<rt>せつやく</rt></ruby>できるサービスは、<ruby>多少<rt>たしょう</rt></ruby>お<ruby>金<rt>きん</rt></ruby>がかかっても<ruby>利用<rt>りよう</rt></ruby>したほうがよいと<ruby>思い<rt>おもい</rt></ruby>ますか。<ruby>理由<rt>りゆう</rt></ruby>と<ruby>具体例<rt>ぐたいれい</rt></ruby>を<ruby>挙げ<rt>あげ</rt></ruby>て<ruby>話し<rt>はなし</rt></ruby>てください。","4":"<ruby>新しい<rt>あたらしい</rt></ruby><ruby>知識<rt>ちしき</rt></ruby>や<ruby>技能<rt>ぎのう</rt></ruby>を<ruby>身に付け<rt>みにつけ</rt></ruby>るとき、どのように<ruby>勉強<rt>べんきょう</rt></ruby>していますか。<ruby>自分<rt>じぶん</rt></ruby>に<ruby>合う<rt>あう</rt></ruby><ruby>方法<rt>ほうほう</rt></ruby>を<ruby>教え<rt>おしえ</rt></ruby>てください。","5":"インターネットで<ruby>見つ<rt>みつ</rt></ruby>けた<ruby>情報<rt>じょうほう</rt></ruby>が<ruby>信頼<rt>しんらい</rt></ruby>できるかどうか、どのように<ruby>確か<rt>たしか</rt></ruby>めていますか。","6":"<ruby>学校<rt>がっこう</rt></ruby>や<ruby>語学<rt>ごがく</rt></ruby><ruby>教室<rt>きょうしつ</rt></ruby>では、<ruby>対面<rt>たいめん</rt></ruby><ruby>授業<rt>じゅぎょう</rt></ruby>よりオンライン<ruby>授業<rt>じゅぎょう</rt></ruby>を<ruby>増やす<rt>ふやす</rt></ruby>べきだと<ruby>思い<rt>おもい</rt></ruby>ますか。<ruby>理由<rt>りゆう</rt></ruby>と<ruby>具体例<rt>ぐたいれい</rt></ruby>を<ruby>挙げ<rt>あげ</rt></ruby>て<ruby>話し<rt>はなし</rt></ruby>てください。","7":"<ruby>人<rt>にん</rt></ruby>と<ruby>協力<rt>きょうりょく</rt></ruby>して<ruby>何か<rt>なにか</rt></ruby>を<ruby>進め<rt>すすめ</rt></ruby>るとき、うまくいかなかった<ruby>経験<rt>けいけん</rt></ruby>はありますか。その<ruby>後<rt>のち</rt></ruby>、どのように<ruby>改善<rt>かいぜん</rt></ruby>しましたか。","8":"いくつもの<ruby>作業<rt>さぎょう</rt></ruby>を<ruby>同時に<rt>どうじに</rt></ruby><ruby>頼ま<rt>たのま</rt></ruby>れたとき、どのように<ruby>優先順位<rt>ゆうせんじゅんい</rt></ruby>を<ruby>決め<rt>きめ</rt></ruby>ていますか。","9":"<ruby>会社<rt>かいしゃ</rt></ruby>は、<ruby>従業員<rt>じゅうぎょういん</rt></ruby>が<ruby>出勤時<rt>しゅっきんじ</rt></ruby><ruby>刻<rt>こく</rt></ruby>を<ruby>柔軟に<rt>じゅうなんに</rt></ruby><ruby>選べ<rt>えらべ</rt></ruby>る<ruby>制度<rt>せいど</rt></ruby>をもっと<ruby>取り入れ<rt>とりいれ</rt></ruby>るべきだと<ruby>思い<rt>おもい</rt></ruby>ますか。<ruby>理由<rt>りゆう</rt></ruby>と<ruby>実施<rt>じっし</rt></ruby>する<ruby>際の<rt>さいの</rt></ruby><ruby>注意点<rt>ちゅういてん</rt></ruby>を<ruby>話し<rt>はなし</rt></ruby>てください。","10":"<ruby>買い物<rt>かいもの</rt></ruby>をするとき、あなたは<ruby>実<rt>み</rt></ruby><ruby>店舗<rt>てんぽ</rt></ruby>とネット<ruby>通販<rt>つうはん</rt></ruby>をどのように<ruby>使い分け<rt>つかいわけ</rt></ruby>ていますか。","11":"<ruby>店<rt>みせ</rt></ruby>や<ruby>施設<rt>しせつ</rt></ruby>で、<ruby>接客<rt>せっきゃく</rt></ruby>がよいと<ruby>感じ<rt>かんじ</rt></ruby>るのはどのようなときですか。","12":"<ruby>店<rt>みせ</rt></ruby>や<ruby>公共施設<rt>こうきょうしせつ</rt></ruby>の<ruby>手続き<rt>てつづき</rt></ruby>を、<ruby>原則<rt>げんそく</rt></ruby>としてオンライン<ruby>化す<rt>かす</rt></ruby>ることについて、あなたはどう<ruby>考え<rt>かんがえ</rt></ruby>ますか。","13":"<ruby>日常生活<rt>にちじょうせいかつ</rt></ruby>で、<ruby>物<rt>もの</rt></ruby>を<ruby>無駄<rt>むだ</rt></ruby>にしないために<ruby>心掛け<rt>こころがけ</rt></ruby>ていることを<ruby>教え<rt>おしえ</rt></ruby>てください。","14":"あなたが<ruby>住む<rt>すむ</rt></ruby><ruby>場所<rt>ばしょ</rt></ruby>を<ruby>選ぶ<rt>えらぶ</rt></ruby>としたら、どのような<ruby>点<rt>てん</rt></ruby>を<ruby>重視<rt>じゅうし</rt></ruby>しますか。","15":"<ruby>地域<rt>ちいき</rt></ruby>で<ruby>環境<rt>かんきょう</rt></ruby>に<ruby>配慮<rt>はいりょ</rt></ruby>した<ruby>行動<rt>こうどう</rt></ruby>を<ruby>広め<rt>ひろめ</rt></ruby>るには、どのような<ruby>取り組み<rt>とりくみ</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>だと<ruby>思い<rt>おもい</rt></ruby>ますか。","16":"<ruby>予定<rt>よてい</rt></ruby>や<ruby>作業<rt>さぎょう</rt></ruby>を<ruby>管理<rt>かんり</rt></ruby>するために、あなたはどのような<ruby>工夫<rt>くふう</rt></ruby>をしていますか。","17":"<ruby>初めて<rt>はじめて</rt></ruby><ruby>使う<rt>つかう</rt></ruby>アプリや<ruby>機器<rt>きき</rt></ruby>の<ruby>操作<rt>そうさ</rt></ruby>は、どのように<ruby>覚え<rt>おぼえ</rt></ruby>ますか。","18":"<ruby>職場<rt>しょくば</rt></ruby>で<ruby>生成<rt>せいせい</rt></ruby>AIの<ruby>利用<rt>りよう</rt></ruby>を<ruby>進め<rt>すすめ</rt></ruby>る<ruby>際<rt>きわ</rt></ruby>、どのような<ruby>点<rt>てん</rt></ruby>を<ruby>重視<rt>じゅうし</rt></ruby>すべきだと<ruby>思い<rt>おもい</rt></ruby>ますか。","19":"<ruby>職場<rt>しょくば</rt></ruby>や<ruby>学校<rt>がっこう</rt></ruby>で<ruby>共有<rt>きょうゆう</rt></ruby>している<ruby>物<rt>もの</rt></ruby>の<ruby>使い方<rt>つかいかた</rt></ruby>について、<ruby>意見<rt>いけん</rt></ruby>が<ruby>分か<rt>わか</rt></ruby>れたらどうしますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","20":"<ruby>近所<rt>きんじょ</rt></ruby>の<ruby>集まり<rt>あつまり</rt></ruby>で<ruby>自分<rt>じぶん</rt></ruby>とは<ruby>違う<rt>ちがう</rt></ruby><ruby>意見<rt>いけん</rt></ruby>が<ruby>出た<rt>でた</rt></ruby>とき、どのように<ruby>話し<rt>はなし</rt></ruby>ますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","21":"<ruby>地域<rt>ちいき</rt></ruby>の<ruby>公共施設<rt>こうきょうしせつ</rt></ruby>の<ruby>使い道<rt>つかいみち</rt></ruby>は、<ruby>住民<rt>じゅうみん</rt></ruby>の<ruby>多数決<rt>たすうけつ</rt></ruby>だけで<ruby>決め<rt>きめ</rt></ruby>てよいと<ruby>思い<rt>おもい</rt></ruby>ますか。あなたの<ruby>考え<rt>かんがえ</rt></ruby>を<ruby>話し<rt>はなし</rt></ruby>てください。","22":"<ruby>忙しい<rt>いそがしい</rt></ruby><ruby>日<rt>にち</rt></ruby>でも<ruby>続け<rt>つづけ</rt></ruby>ている<ruby>習慣<rt>しゅうかん</rt></ruby>はありますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","23":"<ruby>長く<rt>ながく</rt></ruby><ruby>使う<rt>つかう</rt></ruby>ために、<ruby>普段<rt>ふだん</rt></ruby>どのように<ruby>持ち物<rt>もちもの</rt></ruby>を<ruby>手入れ<rt>ていれ</rt></ruby>していますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","24":"<ruby>楽しみ<rt>たのしみ</rt></ruby>にしていた<ruby>予定<rt>よてい</rt></ruby>が<ruby>急に<rt>きゅうに</rt></ruby><ruby>中止<rt>ちゅうし</rt></ruby>になったら、どう<ruby>過ご<rt>すご</rt></ruby>しますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","25":"<ruby>初めて<rt>はじめて</rt></ruby><ruby>行く<rt>いく</rt></ruby><ruby>場所<rt>ばしょ</rt></ruby>について、<ruby>出発前<rt>しゅっぱつまえ</rt></ruby>に<ruby>何を<rt>なにを</rt></ruby><ruby>調べ<rt>しらべ</rt></ruby>ますか。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","26":"<ruby>身近<rt>みじか</rt></ruby>な<ruby>人<rt>にん</rt></ruby>から<ruby>教わ<rt>おそわ</rt></ruby>って<ruby>役に立っ<rt>やくにたっ</rt></ruby>たことを<ruby>一つ<rt>ひとつ</rt></ruby><ruby>挙げ<rt>あげ</rt></ruby>てください。<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>説明し<rt>せつめいし</rt></ruby>てください。","27":"<ruby>仕事<rt>しごと</rt></ruby>の<ruby>連絡<rt>れんらく</rt></ruby>には、<ruby>勤務時間<rt>きんむじかん</rt></ruby><ruby>外<rt>そと</rt></ruby>でもすぐに<ruby>返事<rt>へんじ</rt></ruby>をするべきだという<ruby>意見<rt>いけん</rt></ruby>があります。あなたはどう<ruby>思い<rt>おもい</rt></ruby>ますか。","28":"<ruby>学校<rt>がっこう</rt></ruby>の<ruby>図書館<rt>としょかん</rt></ruby>を、<ruby>静か<rt>しずか</rt></ruby>に<ruby>読む<rt>よむ</rt></ruby><ruby>場所<rt>ばしょ</rt></ruby>だけでなく、<ruby>話し合い<rt>はなしあい</rt></ruby>にも<ruby>使え<rt>つかえ</rt></ruby>る<ruby>場所<rt>ばしょ</rt></ruby>にすることについて、どう<ruby>思い<rt>おもい</rt></ruby>ますか。","29":"<ruby>店<rt>みせ</rt></ruby>では、<ruby>商品<rt>しょうひん</rt></ruby>の<ruby>包装<rt>ほうそう</rt></ruby>をできるだけ<ruby>簡単<rt>かんたん</rt></ruby>にするべきだと<ruby>思い<rt>おもい</rt></ruby>ますか。あなたの<ruby>考え<rt>かんがえ</rt></ruby>を<ruby>話し<rt>はなし</rt></ruby>てください。","30":"<ruby>地域<rt>ちいき</rt></ruby>の<ruby>防災訓練<rt>ぼうさいくんれん</rt></ruby>に、<ruby>住民<rt>じゅうみん</rt></ruby>が<ruby>参加<rt>さんか</rt></ruby>することにはどのような<ruby>意義<rt>いぎ</rt></ruby>があると<ruby>思い<rt>おもい</rt></ruby>ますか。あなたの<ruby>考え<rt>かんがえ</rt></ruby>を<ruby>話し<rt>はなし</rt></ruby>てください。"};
const KOREAN={"1":"저는 다음 날에 필요한 것을 전날 저녁에 갖추려고 합니다. 아침이 되고 나서 준비하면, 분실물을 하기 쉽기 때문입니다. 예를 들어, 서류와 열쇠를 현관 근처에 두면 당황하지 않고 나갈 수 있습니다. 작은 습관이지만, 기분에도 여유가 있습니다.","2":"귀가 후, 이웃을 조금 걷고 기분을 바꾸고 있습니다. 집에 있으면 일을 계속 생각해 버리기 때문입니다. 음악을 듣지 않고 주변의 경치를 바라보면 머리 속이 진정됩니다. 지친 날은 무리하게 나가지 않고 창문을 열고 외부 공기를 만지는 것만으로합니다.","3":"나는 생활에 무리가 없는 범위라면, 이용하는 편이 좋다고 생각합니다. 시간에 쫓기고 있으면, 쉬는 여유까지 없어져 버리기 때문입니다. 예를 들어, 귀가가 늦어지는 날에 재료의 택배를 부탁하면, 쇼핑에 가는 시간을 휴식으로 돌릴 수 있습니다. 단지, 편리하다고 해서 무엇이든 부탁하면, 지출이 부피가 큽니다. 우선 한 달에 사용할 수 있는 금액을 정하고, 그 중에서 부담이 큰 가사로부터 맡기는 것이 좋다고 생각합니다. 스스로 할 부분도 남기면 무리없이 계속 사용할 수 있습니다.","4":"나는 먼저 짧은 설명을 읽고 실제로 시도해 보려고합니다. 읽는 것만으로는, 알았을 생각이 되기 쉽기 때문입니다. 일본어라면, 새롭게 기억한 표현으로 자신의 경험을 말해, 녹음해 확인합니다. 사용할 수 없었던 표현만을 복습하면 무리없이 계속됩니다.","5":"나는 누가 언제 발신한 정보인지 먼저 확인한다. 내용이 정확하더라도 낡고 지금은 적용되지 않는 경우가 있기 때문입니다. 제도나 시험에 대해서 조사할 때는, 소개 기사만으로 판단하지 않고, 공식의 안내도 읽도록(듯이) 하고 있습니다. 모르는 점은 단정하지 않고 남깁니다.","6":"저는 통학 부담이 큰 사람을 위해 온라인 수업을 늘릴 수 있다고 생각합니다. 이동에 시간이 걸리지 않으면 일이나 가사 사이에도 배우기 쉬워지기 때문입니다. 예를 들어, 먼 교실에 다닐 수 없는 사람도 집에서 전문 선생님의 수업을 받을 수 있습니다. 단, 화면 너머로는 질문의 타이밍을 잡기 어려울 수도 있습니다. 그 때문에, 수업 후에 질문할 수 있는 시간을 마련하는 등, 학습자가 남겨지지 않는 궁리와 함께 늘리는 것이 필요하다고 생각합니다.","7":"이전에 공동 작업으로 역할을 확실히 결정하지 않고 같은 자료를 둘이서 만들어 버린 적이 있습니다. 서로 상대의 담당을 확인하지 않은 것이 원인입니다. 그 이후로 시작하기 전에 담당자와 마감일을 공유했습니다. 짧은 확인입니다만, 작업의 중복을 막게 되었습니다.","8":"우선 마감을 확인하고 서둘러 작업에서 걸립니다. 다만, 시간이 걸리는 작업을 마지막에 남겨두면 사이에 맞지 않기 때문에, 필요한 시간도 생각합니다. 예를 들어, 확인을 요청하는 자료는 일찍 전송됩니다. 전부는 어렵다고 알았을 경우는, 무리하게 맡지 않고, 기한을 상담합니다.","9":"저는 일의 내용에 맞는 경우는 넣는 편이 좋다고 생각합니다. 출근 시각을 조정할 수 있으면, 가정의 용사와 일을 양립하기 쉬워지기 때문입니다. 예를 들어, 아침에 자녀를 보내는 사람은 조금 늦게 출근하고 그 분 돌아가는 시간을 조정할 수 있습니다. 다만, 모두가 별도의 시간에 일하면 연락이 어려워질지도 모릅니다. 협의할 수 있는 시간을 정하고 일정을 공유하는 것이 필요합니다. 주위에 부담이 치우치지 않게 하면, 일의 용이함으로 연결된다고 생각합니다.","10":"옷은 실제 매장에서 구입하고 항상 사용하는 일용품은 인터넷으로 주문하고 있습니다. 옷은 시착하지 않으면 크기가 맞는지 판단하기 어렵기 때문입니다. 한편, 일용품은 품질을 알고 있으므로, 가지고 돌아가는 수고를 줄일 수 있는 통판을 이용하는 경우가 많습니다.","11":"이쪽의 이야기를 끝까지 들어 주면, 접객이 좋다고 느낍니다. 이전에, 가게에서 물건을 찾았을 때, 용도까지 들은 후에 다른 상품도 소개해 주었습니다. 단지 추천하는 것이 아니라 희망에 맞는 것을 함께 생각해준 점이 인상적이었습니다.","12":"온라인화에는 찬성입니다만, 창구도 남길 필요가 있다고 생각합니다. 집에서 신청하면 이동이나 대기 시간의 부담을 줄일 수 있기 때문입니다. 예를 들어 직장에서 접수 시간에 맞지 않는 사람들에게 유용합니다. 단, 단말의 조작에 익숙하지 않은 사람까지 같은 방법을 요구하면 곤란할 것입니다. 이용자의 사정을 근거로, 전화나 대면에서도 수속할 수 있도록 하면, 편리함을 넓게 살릴 수 있습니다. 방법을 하나로 좁히는 것보다 선택을 준비하는 것이 중요합니다.","13":"식재료를 낭비하지 않도록 쇼핑하기 전에 냉장고 안을 확인하고 있습니다. 이전에는 싼 물건을 많이 사고, 다 쓸 수 없는 일이 있었습니다. 지금은 집에 있는 물건으로부터 식단을 생각하기 때문에, 필요한 분만 살 수 있고, 요리의 수고도 줄였습니다.","14":"쇼핑이나 통원에 편리한지 여부를 중시합니다. 방이 넓어도, 매일의 이동에 시간이 걸리면 부담이 되기 때문입니다. 특히, 평상시 이용하는 가게나 역까지 실제로 걸어 보고, 무리없이 살 수 있는 장소인지를 확인하고 나서 결정하고 싶습니다.","15":"환경에 배려한 행동을, 일상 안에서 계속하기 쉽게 하는 것이 필요하다고 생각합니다. 소중하다고 알고 있어도, 시간이나 수고가 걸리면 실행하기 어렵기 때문입니다. 예를 들어, 자원을 회수하는 장소를 쇼핑 속에 들르는 곳에 마련하면, 참가하기 쉬워집니다. 또, 분별의 방법을 알기 쉽게 나타내는 것도 중요합니다. 주민에게 노력을 요구할 뿐만 아니라, 헤매지 않고 행동할 수 있는 환경을 정돈하는 것으로, 계속적인 대처로 이어질 것이라고 생각합니다.","16":"약속은 스마트 폰으로 관리되며, 그날의 작업은 종이에 쓰여 있습니다. 일정은 이동 중에도 확인할 수 있고, 작업은 내보내면 우선 순위를 붙이기 쉽기 때문입니다. 전부를 하나로 정리하지 않고, 확인하는 목적에 따라 구분하고 있습니다.","17":"먼저 기본적인 사용법을 읽고 필요한 작업부터 시도합니다. 설명을 전부 기억하려고 해도, 실제로 사용하지 않는다고 잊어 버리기 때문입니다. 모르는 부분은 동영상등에서 확인합니다만, 중요한 설정은 공식의 안내를 확인하고 나서 변경합니다.","18":"편리함에 더해, 사용한 결과를 사람이 확인할 수 있는 것을 중시해야 한다고 생각합니다. 문장 초안 등에 사용하면 생각을 정리하는 데 도움이 됩니다. 다만, 자연스러운 문장이라고 해도, 내용이 옳다고는 할 수 없습니다. 예를 들어, 사외로 내는 안내는 담당자가 근거나 표현을 확인할 필요가 있습니다. 또, 입력해도 좋은 정보를 직장에서 정해 두는 것도 중요합니다. 우선 확인하기 쉬운 업무로부터 시험해, 사용법을 공유하면서 범위를 넓히는 것이 좋다고 생각합니다.","19":"첫째, 왜 의견이 다른지 묻는다. 예를 들면 공유의 책상이라면, 사용하고 싶은 시간이 다를 뿐일지도 모릅니다. 사정을 근거로 이용 시간을 나누고 잠시 시도합니다. 결정한 후에도 사용하기 어려운 점이 있는지 확인하고 싶습니다.","20":"즉시 반대하지 않고 먼저 상대의 이유를 듣습니다. 행사 일정이라면 참가하기 어려운 사정이 있을지도 모릅니다. 게다가 자신의 희망도 이유와 함께 전합니다. 한 번에 결정할 수 없어도 서로 납득할 수 있는 방안을 찾습니다.","21":"다수결만으로 결정하는 것은 피하는 편이 좋다고 생각합니다. 찬성하는 사람이 많아도, 이용할 수 없게 되는 사람의 사정까지는 모르기 때문입니다. 예를 들어, 조용히 공부하는 장소를 운동의 방으로 바꾸면 곤란한 사람도 있을 것입니다. 우선 이용자로부터 의견을 모아 요일에 용도를 나누는 방안 등을 생각해야 합니다. 전원의 희망을 이루는 것은 어렵지만 소수의 의견도 듣고 결정하면 주민이 결과를 보다 받아들이기 쉬워진다고 생각합니다.","22":"자러 가기 전에 다음날 하는 것을 세 가지만 쓰고 있습니다. 바쁘면 무엇부터 시작할지 헤매어 버리기 때문입니다. 세세한 예정까지 결정하는 것은 아니지만, 우선 순위를 붙여 두면 안심할 수 있습니다. 단시간에 끝나기 때문에 계속 쉽습니다.","23":"신발은 착용 후 얼룩을 떨어뜨려 버립니다. 비에 젖은 날은 즉시 선반에 넣지 않고 통풍이 잘되는 곳에서 말립니다. 손질을 게을리하면 상처 쉽기 때문에, 조금 번거로움이라도 그 날 중에 확인하도록 하고 있습니다.","24":"먼저 함께 갈 예정이었던 사람에게 연락하여 다른 날에 할 수 있는지 상담합니다. 그날 무리를 하고 나가는 것보다 집에서 천천히 보내고 싶습니다. 뒤로 하고 있던 책을 읽는 등, 빈 시간을 긍정적으로 사용하도록 합니다.","25":"가는 방법과 영업 시간을 먼저 조사합니다. 역에 도착해도 출구를 잘못하면 시간이 걸리기 때문입니다. 지도뿐만 아니라 건물의 외관 등도 확인합니다. 여유를 가지고 출발할 수 있도록, 환승에 걸리는 시간도 봐 둡니다.","26":"동료에게 요청한 직업 마감일을 먼저 확인하도록 가르쳤습니다. 이전에는, 곧 시작하면 좋다고 생각하고 있었습니다만, 서두르는 방법을 모르고 곤란한 일이 있었습니다. 지금은 기한을 확인하고 나서 순서를 결정하므로, 침착하게 진행됩니다.","27":"근무시간외까지 언제나 곧바로 대답을 할 필요는 없다고 생각합니다. 쉬고 있는 동안에도 일을 신경쓰고 있으면 충분히 쉬지 않게 되기 때문입니다. 다만, 가파른 사고에의 대응 등, 기다리지 않는 연락도 있을 것입니다. 그러므로 긴급 상황에서 누구에게 연락할 것인지를 먼저 결정해야 합니다. 보통의 확인이라면 다음날의 대답으로 좋다고 알고 있으면, 보내는 사람도 받는 사람도 안심할 수 있습니다. 속도만을 요구하는 것이 아니라, 연락의 필요성을 생각하는 것이 중요합니다.","28":"토론에도 사용할 수 있도록 하는 것에 찬성입니다. 책을 읽고 끝날 뿐만 아니라, 감상을 서로 전하면, 자신과는 다른 견해를 깨닫기 때문입니다. 다만, 조용히 공부하고 싶은 사람의 방해가 되어서는 안됩니다. 방이나 시간대를 나누어 말할 수 있는 장소를 알기 쉽게 나타내야 합니다. 사용하기 시작한 후에도 소리가 걱정되는 사람의 의견을 들어야합니다. 읽는 것과 토론하는 것을 잘 조합하면, 도서관을 이용하는 즐거움이 퍼진다고 생각합니다.","29":"필요 이상의 포장은 줄이는 것이 좋다고 생각합니다. 가지고 돌아가서 곧바로 버리는 가방이나 상자가 많으면, 정리에도 수고가 걸리기 때문입니다. 그러나 깨지기 쉬운 물건과 음식에는 보호하기 위해 포장이 필요합니다. 무엇이든 생략하는 것이 아니라, 상품에 맞는 방법을 선택해야 한다고 생각합니다. 예를 들어 가정용이라면 쉽게 포장하고 선물이라면 희망에 따라 포장하는 방법이 있습니다. 가게와 손님이 필요한 것을 확인하면서 낭비를 줄이는 것이 좋다고 생각합니다.","30":"방재 훈련에는, 알고 있을 생각을 실제로 확인할 수 있는 의의가 있다고 생각합니다. 피난 장소를 들은 적이 있어도, 걸어 보면 헤매는지도 모릅니다. 또, 이웃의 사람과 얼굴을 맞추어 두면, 곤란했을 때에 소리를 걸기 쉬워질 것입니다. 단지 참가할 뿐만 아니라, 자신이 모르는 점을 확인하는 것이 중요합니다. 일 등으로 나올 수 없는 사람에게도 내용을 전하면, 지역 안에서 대비를 생각할 기회를 넓힐 수 있다고 생각합니다."};
const DATA=[{"id":1,"code":"1A","part":4,"round":"1A","topic":"生活の習慣と選択","q":"毎日の生活で、意識して続けている習慣は何ですか。続けている理由も教えてください。","qko":"매일의 삶에서 의식이 계속되는 습관은 무엇입니까? 계속하는 이유도 알려주세요.","a":"私は、翌日に必要な物を前の晩にそろえるようにしています。朝になってから準備すると、忘れ物をしがちだからです。たとえば、書類と鍵を玄関の近くに置いておくと、慌てずに出かけられます。小さな習慣ですが、気持ちにも余裕ができます。"},{"id":2,"code":"1B","part":4,"round":"1B","topic":"生活の習慣と選択","q":"忙しい一日を終えた後、どのように気分を切り替えていますか。簡単に説明してください。","qko":"바쁜 하루를 마친 후에 어떻게 기분을 바꾸고 있습니까? 간단히 설명해 주세요.","a":"帰宅後は、近所を少し歩いて気分を切り替えています。家にいると仕事のことを考え続けてしまうからです。音楽を聞かずに周りの景色を眺めると、頭の中が落ち着きます。疲れた日は無理に出かけず、窓を開けて外の空気に触れるだけにしています。"},{"id":3,"code":"1C","part":5,"round":"1C","topic":"生活の習慣と選択","q":"時間を節約できるサービスは、多少お金がかかっても利用したほうがよいと思いますか。理由と具体例を挙げて話してください。","qko":"시간을 절약할 수 있는 서비스는, 다소 돈이 걸려도 이용하는 편이 좋다고 생각합니까? 이유와 구체적인 예를 들어 이야기하십시오.","a":"私は、生活に無理のない範囲なら、利用したほうがよいと思います。時間に追われていると、休む余裕までなくなってしまうからです。たとえば、帰宅が遅くなる日に食材の宅配を頼めば、買い物に行く時間を休息に回せます。ただ、便利だからといって何でも頼むと、出費がかさみます。まず一か月に使える金額を決め、その中で負担の大きい家事から任せるのがよいと思います。自分でやる部分も残せば、無理なく使い続けられます。"},{"id":4,"code":"2A","part":4,"round":"2A","topic":"学習と情報の見極め","q":"新しい知識や技能を身に付けるとき、どのように勉強していますか。自分に合う方法を教えてください。","qko":"새로운 지식과 기술을 익힐 때 어떻게 공부하고 있습니까? 자신에게 맞는 방법을 알려주세요.","a":"私は、まず短い説明を読み、それを実際に試してみるようにしています。読むだけでは、分かったつもりになりやすいからです。日本語なら、新しく覚えた表現で自分の経験を話し、録音して確かめます。使えなかった表現だけを復習すると、無理なく続けられます。"},{"id":5,"code":"2B","part":4,"round":"2B","topic":"学習と情報の見極め","q":"インターネットで見つけた情報が信頼できるかどうか、どのように確かめていますか。","qko":"인터넷에서 찾은 정보가 신뢰할 수 있는지 여부를 어떻게 확인합니까?","a":"私は、誰がいつ発信した情報なのかを最初に確かめます。内容が正しくても、古くて今は当てはまらない場合があるからです。制度や試験について調べるときは、紹介記事だけで判断せず、公式の案内も読むようにしています。分からない点は、断定せずに残します。"},{"id":6,"code":"2C","part":5,"round":"2C","topic":"学習と情報の見極め","q":"学校や語学教室では、対面授業よりオンライン授業を増やすべきだと思いますか。理由と具体例を挙げて話してください。","qko":"학교나 어학교실에서는, 대면 수업보다 온라인 수업을 늘려야 한다고 생각합니까? 이유와 구체적인 예를 들어 이야기하십시오.","a":"私は、通学の負担が大きい人のために、オンライン授業を増やしてもよいと思います。移動に時間がかからなければ、仕事や家事の合間にも学びやすくなるからです。たとえば、遠くの教室に通えない人でも、自宅から専門の先生の授業を受けられます。ただ、画面越しでは質問のタイミングをつかみにくいこともあります。そのため、授業後に質問できる時間を設けるなど、学習者が取り残されない工夫と一緒に増やすことが必要だと思います。"},{"id":7,"code":"3A","part":4,"round":"3A","topic":"仕事の進め方と調整","q":"人と協力して何かを進めるとき、うまくいかなかった経験はありますか。その後、どのように改善しましたか。","qko":"사람과 협력하여 무언가를 진행할 때 잘못되었던 경험이 있습니까? 그렇다면 어떻게 개선되었습니까?","a":"以前、共同作業で役割をはっきり決めず、同じ資料を二人で作ってしまったことがあります。お互いに相手の担当を確認していなかったのが原因です。それ以来、始める前に担当と期限を共有しています。短い確認ですが、作業の重複を防げるようになりました。"},{"id":8,"code":"3B","part":4,"round":"3B","topic":"仕事の進め方と調整","q":"いくつもの作業を同時に頼まれたとき、どのように優先順位を決めていますか。","qko":"여러 작업을 동시에 요청했을 때 어떻게 우선순위를 결정합니까?","a":"まず締め切りを確かめ、急ぐ作業から取りかかります。ただ、時間のかかる作業を最後に残すと間に合わないので、必要な時間も考えます。たとえば、確認を頼む資料は早めに送ります。全部は難しいと分かった場合は、無理に引き受けず、期限を相談します。"},{"id":9,"code":"3C","part":5,"round":"3C","topic":"仕事の進め方と調整","q":"会社は、従業員が出勤時刻を柔軟に選べる制度をもっと取り入れるべきだと思いますか。理由と実施する際の注意点を話してください。","qko":"회사는 직원이 출근 시간을 유연하게 선택할 수 있는 제도를 더 도입해야 한다고 생각합니까? 이유와 실시할 때의 주의점을 말해 주세요.","a":"私は、仕事の内容に合う場合は、取り入れたほうがよいと思います。出勤時刻を調整できれば、家庭の用事と仕事を両立しやすくなるからです。たとえば、朝に子どもを送る人は、少し遅く出勤して、その分帰る時刻を調整できます。ただ、全員が別々の時間に働くと、連絡が取りにくくなるかもしれません。打ち合わせのできる時間を決め、予定を共有することが必要です。周囲に負担が偏らないようにすれば、働きやすさにつながると思います。"},{"id":10,"code":"4A","part":4,"round":"4A","topic":"消費とサービス","q":"買い物をするとき、あなたは実店舗とネット通販をどのように使い分けていますか。","qko":"쇼핑을 할 때 실제 매장과 인터넷 우편 주문을 어떻게 구분합니까?","a":"服は実店舗で買い、いつも使う日用品はネットで注文しています。服は試着しないと、サイズが合うか判断しにくいからです。一方、日用品は品質が分かっているので、持ち帰る手間を省ける通販を利用することが多いです。"},{"id":11,"code":"4B","part":4,"round":"4B","topic":"消費とサービス","q":"店や施設で、接客がよいと感じるのはどのようなときですか。","qko":"가게나 시설에서, 접객이 좋다고 느끼는 것은 어떠한 때입니까.","a":"こちらの話を最後まで聞いてくれると、接客がよいと感じます。以前、店で品物を探した際、用途まで聞いた上で別の商品も紹介してもらいました。ただ勧めるのではなく、希望に合う物を一緒に考えてくれた点が印象的でした。"},{"id":12,"code":"4C","part":5,"round":"4C","topic":"消費とサービス","q":"店や公共施設の手続きを、原則としてオンライン化することについて、あなたはどう考えますか。","qko":"상점과 공공 시설의 절차를 원칙적으로 온라인화하는 것에 대해 어떻게 생각하십니까?","a":"オンライン化には賛成ですが、窓口も残す必要があると思います。自宅から申し込めれば、移動や待ち時間の負担を減らせるからです。例えば、仕事で受付時間に間に合わない人にとっては便利です。ただ、端末の操作に不慣れな人まで、同じ方法を求められると困るでしょう。利用者の事情を踏まえて、電話や対面でも手続きできるようにすれば、便利さを広く生かせます。方法を一つに絞るより、選択肢を用意することが大切です。"},{"id":13,"code":"5A","part":4,"round":"5A","topic":"地域と環境","q":"日常生活で、物を無駄にしないために心掛けていることを教えてください。","qko":"일상 생활에서 물건을 낭비하지 않도록 유의하고 있음을 말해주십시오.","a":"食材を無駄にしないよう、買い物の前に冷蔵庫の中を確かめています。以前は安い物を多めに買い、使い切れないことがありました。今は家にある物から献立を考えるので、必要な分だけ買えて、調理の手間も減りました。"},{"id":14,"code":"5B","part":4,"round":"5B","topic":"地域と環境","q":"あなたが住む場所を選ぶとしたら、どのような点を重視しますか。","qko":"당신이 사는 곳을 선택한다면 어떤 점을 강조할 것인가?","a":"買い物や通院に便利かどうかを重視します。部屋が広くても、毎日の移動に時間がかかると負担になるからです。特に、普段利用する店や駅まで実際に歩いてみて、無理なく暮らせる場所かを確かめてから決めたいです。"},{"id":15,"code":"5C","part":5,"round":"5C","topic":"地域と環境","q":"地域で環境に配慮した行動を広めるには、どのような取り組みが必要だと思いますか。","qko":"지역에서 환경 친화적인 행동을 전파하려면 어떤 노력이 필요하다고 생각합니까?","a":"環境に配慮した行動を、日常の中で続けやすくすることが必要だと思います。大切だと分かっていても、時間や手間がかかると実行しにくいからです。例えば、資源を回収する場所を買い物のついでに立ち寄れる所に設ければ、参加しやすくなります。また、分別の方法を分かりやすく示すことも大切です。住民に努力を求めるだけではなく、迷わず行動できる環境を整えることで、継続的な取り組みにつながると思います。"},{"id":16,"code":"6A","part":4,"round":"6A","topic":"技術と働き方","q":"予定や作業を管理するために、あなたはどのような工夫をしていますか。","qko":"약속과 작업을 관리하기 위해, 당신은 어떤 궁리를하고 있습니까?","a":"予定はスマートフォンで管理し、その日にする作業は紙に書いています。予定は外出先でも確認できますし、作業は書き出すと優先順位を付けやすいからです。全部を一つにまとめず、確認する目的に応じて使い分けています。"},{"id":17,"code":"6B","part":4,"round":"6B","topic":"技術と働き方","q":"初めて使うアプリや機器の操作は、どのように覚えますか。","qko":"처음 사용하는 앱과 기기의 조작은 어떻게 기억하나요?","a":"まず基本的な使い方を読み、必要な操作から試します。説明を全部覚えようとしても、実際に使わないと忘れてしまうからです。分からない部分は動画などで確かめますが、重要な設定は公式の案内を確認してから変更します。"},{"id":18,"code":"6C","part":5,"round":"6C","topic":"技術と働き方","q":"職場で生成AIの利用を進める際、どのような点を重視すべきだと思いますか。","qko":"직장에서 생성 AI의 이용을 진행할 때 어떤 점을 중시해야 한다고 생각합니까?","a":"便利さに加え、使った結果を人が確認できることを重視すべきだと思います。文章の下書きなどに使えば、考えを整理する助けになります。ただ、自然な文章だからといって、内容が正しいとは限りません。例えば、社外に出す案内は、担当者が根拠や表現を確かめる必要があります。また、入力してよい情報を職場で決めておくことも大切です。まず確認しやすい業務から試し、使い方を共有しながら範囲を広げるのがよいと思います。"},{"id":19,"code":"7A","part":4,"round":"7A","topic":"合意形成と公共性","q":"職場や学校で共有している物の使い方について、意見が分かれたらどうしますか。簡単に説明してください。","qko":"직장이나 학교에서 공유하고 있는 물건의 사용법에 대해, 의견이 나뉘면 어떻게 합니까? 간단히 설명해 주세요.","a":"まず、なぜ意見が違うのかを聞きます。例えば共有の机なら、使いたい時間が違うだけかもしれません。事情を踏まえて利用時間を分け、しばらく試します。決めた後も使いにくい点がないかを確かめたいです。"},{"id":20,"code":"7B","part":4,"round":"7B","topic":"合意形成と公共性","q":"近所の集まりで自分とは違う意見が出たとき、どのように話しますか。簡単に説明してください。","qko":"이웃 모임에서 자신과 다른 의견이 나왔을 때 어떻게 말합니까? 간단히 설명해 주세요.","a":"すぐに反対せず、まず相手の理由を聞きます。行事の日程なら、参加しにくい事情があるかもしれません。そのうえで自分の希望も理由と一緒に伝えます。一度で決められなくても、互いに納得できる案を探します。"},{"id":21,"code":"7C","part":5,"round":"7C","topic":"合意形成と公共性","q":"地域の公共施設の使い道は、住民の多数決だけで決めてよいと思いますか。あなたの考えを話してください。","qko":"지역의 공공 시설의 사용도는, 주민의 다수결만으로 정해도 좋다고 생각합니까? 당신의 생각을 말하십시오.","a":"多数決だけで決めるのは避けたほうがよいと思います。賛成する人が多くても、利用できなくなる人の事情までは分からないからです。例えば静かに勉強する場所を運動の部屋に変えると、困る人もいるでしょう。まず利用者から意見を集め、曜日で用途を分ける案などを考えるべきです。全員の希望をかなえるのは難しいにせよ、少数の意見も聞いたうえで決めれば、住民が結果をより受け入れやすくなると思います。"},{"id":22,"code":"8A","part":4,"round":"8A","topic":"第4部 第5部 通し演習","q":"忙しい日でも続けている習慣はありますか。簡単に説明してください。","qko":"바쁜 날에도 계속되는 습관이 있습니까? 간단히 설명해 주세요.","a":"寝る前に、翌日することを三つだけ書いています。忙しいと、何から始めるか迷ってしまうからです。細かい予定まで決めるわけではありませんが、優先順位を付けておくと安心できます。短時間で済むので続けやすいです。"},{"id":23,"code":"8B","part":4,"round":"8B","topic":"第4部 第5部 通し演習","q":"長く使うために、普段どのように持ち物を手入れしていますか。簡単に説明してください。","qko":"오랫동안 사용하기 위해 평소 어떻게 소지품을 손질하고 있습니까? 간단히 설명해 주세요.","a":"靴は、履いた後に汚れを落としてからしまいます。雨にぬれた日は、すぐに棚に入れず、風通しのよい場所で乾かします。手入れを怠ると傷みやすいので、少し面倒でもその日のうちに確認するようにしています。"},{"id":24,"code":"8C","part":4,"round":"8C","topic":"第4部 第5部 通し演習","q":"楽しみにしていた予定が急に中止になったら、どう過ごしますか。簡単に説明してください。","qko":"기대하고 있던 예정이 갑자기 중단되면 어떻게 지내십니까? 간단히 설명해 주세요.","a":"まず、一緒に行く予定だった人に連絡し、別の日にできるか相談します。その日に無理をして出かけるより、家でゆっくり過ごしたいです。後回しにしていた本を読むなど、空いた時間を前向きに使うようにします。"},{"id":25,"code":"8D","part":4,"round":"8D","topic":"第4部 第5部 通し演習","q":"初めて行く場所について、出発前に何を調べますか。簡単に説明してください。","qko":"처음 가는 곳에 대해 출발하기 전에 무엇을 살펴볼까요? 간단히 설명해 주세요.","a":"行き方と営業時間を先に調べます。駅に着いても、出口を間違えると時間がかかるからです。地図だけでなく、建物の外観なども確認します。余裕を持って出発できるよう、乗り換えにかかる時間も見ておきます。"},{"id":26,"code":"8E","part":4,"round":"8E","topic":"第4部 第5部 通し演習","q":"身近な人から教わって役に立ったことを一つ挙げてください。簡単に説明してください。","qko":"익숙한 사람으로부터 가르치고 도움이 된 것을 하나 들려주세요. 간단히 설명해 주세요.","a":"同僚から、頼まれた仕事の締め切りを最初に確認するよう教わりました。以前は、すぐ始めればよいと思っていましたが、急ぎ方が分からず困ることがありました。今は期限を確かめてから順番を決めるので、落ち着いて進められます。"},{"id":27,"code":"8F","part":5,"round":"8F","topic":"第4部 第5部 通し演習","q":"仕事の連絡には、勤務時間外でもすぐに返事をするべきだという意見があります。あなたはどう思いますか。","qko":"직장 연락에는 근무 시간 외에도 즉시 회신해야 한다는 의견이 있습니다. 당신은 어떻게 생각하십니까?","a":"勤務時間外まで、いつもすぐに返事をする必要はないと思います。休んでいる間も仕事を気にしていると、十分に休めなくなるからです。ただし、急な事故への対応など、待てない連絡もあるでしょう。そのため、緊急の場合に誰へ連絡するかを先に決めておくべきです。普通の確認なら翌日の返事でよいと分かっていれば、送る人も受ける人も安心できます。速さだけを求めるのではなく、連絡の必要性を考えることが大切です。"},{"id":28,"code":"8G","part":5,"round":"8G","topic":"第4部 第5部 通し演習","q":"学校の図書館を、静かに読む場所だけでなく、話し合いにも使える場所にすることについて、どう思いますか。","qko":"학교 도서관을 조용히 읽는 장소뿐만 아니라 토론에 사용할 수있는 장소로 만드는 것에 대해 어떻게 생각하십니까?","a":"話し合いにも使えるようにすることに賛成です。本を読んで終わるだけでなく、感想を伝え合えば、自分とは違う見方に気付けるからです。ただし、静かに勉強したい人の邪魔になってはいけません。部屋や時間帯を分け、話せる場所を分かりやすく示す必要があります。使い始めてからも、音が気になる人の意見を聞くべきです。読むことと話し合うことをうまく組み合わせれば、図書館を利用する楽しみが広がると思います。"},{"id":29,"code":"8H","part":5,"round":"8H","topic":"第4部 第5部 通し演習","q":"店では、商品の包装をできるだけ簡単にするべきだと思いますか。あなたの考えを話してください。","qko":"가게에서는 상품의 포장을 가능한 한 간단하게 해야 한다고 생각합니까? 당신의 생각을 말하십시오.","a":"必要以上の包装は減らしたほうがよいと思います。持ち帰ってすぐに捨てる袋や箱が多いと、片付けにも手間がかかるからです。ただし、壊れやすい物や食品には、保護するための包装が必要です。何でも省くのではなく、商品に合った方法を選ぶべきだと思います。例えば自宅用なら簡単に包み、贈り物なら希望に応じて包装する方法があります。店と客が必要なものを確かめながら、無駄を減らしていくのがよいと思います。"},{"id":30,"code":"8I","part":5,"round":"8I","topic":"第4部 第5部 通し演習","q":"地域の防災訓練に、住民が参加することにはどのような意義があると思いますか。あなたの考えを話してください。","qko":"지역의 방재 훈련에, 주민이 참가하는 것에는 어떤 의미가 있다고 생각합니까? 당신의 생각을 말하십시오.","a":"防災訓練には、知っているつもりのことを実際に確かめられる意義があると思います。避難場所を聞いたことがあっても、歩いてみると迷うかもしれません。また、近所の人と顔を合わせておけば、困ったときに声を掛けやすくなるでしょう。ただ参加するだけでなく、自分が分からなかった点を確認することが大切です。仕事などで出られない人にも内容を伝えれば、地域の中で備えを考える機会を広げられると思います。"}];

うける</rt></ruby><ruby>人<rt>にん</rt></ruby>も<ruby>安心<rt>あんしん</rt></ruby>できます。<ruby>速さ<rt>はやさ</rt></ruby>だけを<ruby>求め<rt>もとめ</rt></ruby>るのではなく、<ruby>連絡<rt>れんらく</rt></ruby>の<ruby>必要性<rt>ひつようせい</rt></ruby>を<ruby>考え<rt>かんがえ</rt></ruby>ることが<ruby>大切<rt>たいせつ</rt></ruby>です。","28":"<ruby>話し合い<rt>はなしあい</rt></ruby>にも<ruby>使え<rt>つかえ</rt></ruby>るようにすることに<ruby>賛成<rt>さんせい</rt></ruby>です。<ruby>本<rt>ほん</rt></ruby>を<ruby>読んで<rt>よんで</rt></ruby><ruby>終わ<rt>おわ</rt></ruby>るだけでなく、<ruby>感想<rt>かんそう</rt></ruby>を<ruby>伝え<rt>つたえ</rt></ruby><ruby>合え<rt>あえ</rt></ruby>ば、<ruby>自分<rt>じぶん</rt></ruby>とは<ruby>違う<rt>ちがう</rt></ruby><ruby>見方<rt>みかた</rt></ruby>に<ruby>気付け<rt>きづけ</rt></ruby>るからです。ただし、<ruby>静か<rt>しずか</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>したい<ruby>人<rt>にん</rt></ruby>の<ruby>邪魔<rt>じゃま</rt></ruby>になってはいけません。<ruby>部屋<rt>へや</rt></ruby>や<ruby>時間帯<rt>じかんたい</rt></ruby>を<ruby>分け<rt>わけ</rt></ruby>、<ruby>話せ<rt>はなせ</rt></ruby>る<ruby>場所<rt>ばしょ</rt></ruby>を<ruby>分か<rt>わか</rt></ruby>りやすく<ruby>示す<rt>しめす</rt></ruby><ruby>必要<rt>ひつよう</rt></ruby>があります。<ruby>使い<rt>つかい</rt></ruby><ruby>始め<rt>はじめ</rt></ruby>てからも、<ruby>音<rt>おと</rt></ruby>が<ruby>気に<rt>きに</rt></ruby>なる<ruby>人<rt>にん</rt></ruby>の<ruby>意見<rt>いけん</rt></ruby>を<ruby>聞く<rt>きく</rt></ruby>べきです。<ruby>読む<rt>よむ</rt></ruby>ことと<ruby>話し合う<rt>はなしあう</rt></ruby>ことをうまく<ruby>組み合わせ<rt>くみあわせ</rt></ruby>れば、<ruby>図書館<rt>としょかん</rt></ruby>を<ruby>利用<rt>りよう</rt></ruby>する<ruby>楽しみ<rt>たのしみ</rt></ruby>が<ruby>広が<rt>ひろが</rt></ruby>ると<ruby>思い<rt>おもい</rt></ruby>ます。","29":"<ruby>必要以上<rt>ひつよういじょう</rt></ruby>の<ruby>包装<rt>ほうそう</rt></ruby>は<ruby>減ら<rt>へら</rt></ruby>したほうがよいと<ruby>思い<rt>おもい</rt></ruby>ます。<ruby>持ち帰っ<rt>もちかえっ</rt></ruby>てすぐに<ruby>捨て<rt>すて</rt></ruby>る<ruby>袋<rt>ふくろ</rt></ruby>や<ruby>箱<rt>はこ</rt></ruby>が<ruby>多い<rt>おおい</rt></ruby>と、<ruby>片付け<rt>かたづけ</rt></ruby>にも<ruby>手間<rt>てま</rt></ruby>がかかるからです。ただし、<ruby>壊れ<rt>こわれ</rt></ruby>やすい<ruby>物<rt>もの</rt></ruby>や<ruby>食品<rt>しょくひん</rt></ruby>には、<ruby>保護<rt>ほご</rt></ruby>するための<ruby>包装<rt>ほうそう</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>です。<ruby>何で<rt>なんで</rt></ruby>も<ruby>省く<rt>はぶく</rt></ruby>のではなく、<ruby>商品<rt>しょうひん</rt></ruby>に<ruby>合っ<rt>あっ</rt></ruby>た<ruby>方法<rt>ほうほう</rt></ruby>を<ruby>選ぶ<rt>えらぶ</rt></ruby>べきだと<ruby>思い<rt>おもい</rt></ruby>ます。<ruby>例えば<rt>たとえば</rt></ruby><ruby>自宅<rt>じたく</rt></ruby><ruby>用<rt>よう</rt></ruby>なら<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>包み<rt>つつみ</rt></ruby>、<ruby>贈り物<rt>おくりもの</rt></ruby>なら<ruby>希望<rt>きぼう</rt></ruby>に<ruby>応じ<rt>おうじ</rt></ruby>て<ruby>包装<rt>ほうそう</rt></ruby>する<ruby>方法<rt>ほうほう</rt></ruby>があります。<ruby>店<rt>みせ</rt></ruby>と<ruby>客<rt>きゃく</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>なものを<ruby>確か<rt>たしか</rt></ruby>めながら、<ruby>無駄<rt>むだ</rt></ruby>を<ruby>減ら<rt>へら</rt></ruby>していくのがよいと<ruby>思い<rt>おもい</rt></ruby>ます。","30":"<ruby>防災訓練<rt>ぼうさいくんれん</rt></ruby>には、<ruby>知って<rt>しって</rt></ruby>いるつもりのことを<ruby>実際に<rt>じっさいに</rt></ruby><ruby>確か<rt>たしか</rt></ruby>められる<ruby>意義<rt>いぎ</rt></ruby>があると<ruby>思い<rt>おもい</rt></ruby>ます。<ruby>避難場所<rt>ひなんばしょ</rt></ruby>を<ruby>聞い<rt>きい</rt></ruby>たことがあっても、<ruby>歩い<rt>あるい</rt></ruby>てみると<ruby>迷う<rt>まよう</rt></ruby>かもしれません。また、<ruby>近所<rt>きんじょ</rt></ruby>の<ruby>人<rt>にん</rt></ruby>と<ruby>顔<rt>かお</rt></ruby>を<ruby>合わ<rt>あわ</rt></ruby>せておけば、<ruby>困っ<rt>こまっ</rt></ruby>たときに<ruby>声<rt>こえ</rt></ruby>を<ruby>掛け<rt>かけ</rt></ruby>やすくなるでしょう。ただ<ruby>参加<rt>さんか</rt></ruby>するだけでなく、<ruby>自分<rt>じぶん</rt></ruby>が<ruby>分か<rt>わか</rt></ruby>らなかった<ruby>点<rt>てん</rt></ruby>を<ruby>確認す<rt>かくにんす</rt></ruby>ることが<ruby>大切<rt>たいせつ</rt></ruby>です。<ruby>仕事<rt>しごと</rt></ruby>などで<ruby>出ら<rt>でら</rt></ruby>れない<ruby>人<rt>にん</rt></ruby>にも<ruby>内容<rt>ないよう</rt></ruby>を<ruby>伝え<rt>つたえ</rt></ruby>れば、<ruby>地域<rt>ちいき</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>備え<rt>そなえ</rt></ruby>を<ruby>考え<rt>かんがえ</rt></ruby>る<ruby>機会<rt>きかい</rt></ruby>を<ruby>広げ<rt>ひろげ</rt></ruby>られると<ruby>思い<rt>おもい</rt></ruby>ます。"};
const $=id=>document.getElementById(id),AUTO_DELAY=3000,TIMER_SECONDS={3:15,4:25,5:45};let filtered=[...DATA],index=0,back=false,showKorean=false,showFurigana=false,onlyStars=false,mode='card',autoPlaying=false,autoTimer=null,timerInterval=null,timerRunning=false,timerLeft=0;let stars=new Set(JSON.parse(localStorage.getItem('sjpt-l8-stars-v1')||'[]'));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
function speak(c,answer,done){if(!c||!('speechSynthesis'in window)){if(done)done();return}stopSpeech();const u=new SpeechSynthesisUtterance(answer?c.a:c.q);u.lang='ja-JP';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));if(voices[0])u.voice=voices.find(v=>v.default)||voices[0];u.onstart=()=>{$('message').textContent='일본어 음성 재생 중…'};u.onend=()=>{$('message').textContent='';if(done)done()};u.onerror=()=>{if(done)done()};speechSynthesis.speak(u)}
function timerSeconds(c=filtered[index]){return c?(TIMER_SECONDS[c.part]||25):25}
function updateTimerButton(c=filtered[index]){const b=$('timer');if(!b)return;const seconds=timerRunning?timerLeft:timerSeconds(c);b.textContent=timerRunning?`■ ${seconds}초`:`⏱ ${seconds}초`;b.classList.toggle('running',timerRunning);b.setAttribute('aria-label',timerRunning?'답변 타이머 중지':`현재 문항 ${seconds}초 답변 타이머 시작`)}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerLeft=timerSeconds();updateTimerButton()}
function toggleTimer(){if(timerRunning){stopTimer();return}if(!filtered.length)return;stopAuto();stopSpeech();timerLeft=timerSeconds();timerRunning=true;updateTimerButton();timerInterval=setInterval(()=>{timerLeft--;if(timerLeft<=0){clearInterval(timerInterval);timerInterval=null;timerRunning=false;$('timer').textContent='✓ 완료';$('timer').classList.remove('running');$('message').textContent='답변 시간이 종료되었습니다.';if(navigator.vibrate)navigator.vibrate([150,80,150]);setTimeout(()=>{if(!timerRunning){$('message').textContent='';updateTimerButton()}},1500);return}updateTimerButton()},1000)}
function bounds(){let start=filtered.findIndex(c=>String(c.id)==$('rangeStart').value),end=filtered.findIndex(c=>String(c.id)==$('rangeEnd').value);return{start:start<0?0:start,end:end<0?Math.max(0,filtered.length-1):end}}
function updateRanges(){const a=$('rangeStart'),b=$('rangeEnd'),av=a.value,bv=b.value;a.innerHTML=b.innerHTML='';filtered.forEach(c=>{const label=c.code;a.add(new Option(label,c.id));b.add(new Option(label,c.id))});a.disabled=b.disabled=!filtered.length;if(!filtered.length)return;a.value=filtered.some(c=>String(c.id)===av)?av:filtered[0].id;b.value=filtered.some(c=>String(c.id)===bv)?bv:filtered.at(-1).id;if(bounds().end<bounds().start)b.value=a.value}
function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);$('autoPlay').textContent='▶';$('autoPlay').classList.remove('active')}
function schedule(){clearTimeout(autoTimer);if(!autoPlaying||!filtered.length)return;autoTimer=setTimeout(()=>{if(back){const x=bounds();index=index>=x.end?x.start:index+1;back=false}else back=true;showKorean=false;showFurigana=false;render();speak(filtered[index],back,schedule)},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stopSpeech();return}if(!filtered.length)return;stopTimer();const x=bounds();index=x.start;back=false;showKorean=false;showFurigana=false;autoPlaying=true;$('autoPlay').textContent='■';$('autoPlay').classList.add('active');render();speak(filtered[index],false,schedule)}
function apply(){stopAuto();stopSpeech();stopTimer();const q=$('search').value.trim().toLowerCase();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('round').value||c.round==$('round').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;showKorean=false;showFurigana=false;updateRanges();render()}
function cardActions(){return `<div class="cardActions"><button id="furiganaToggle" class="${showFurigana?'active':''}" type="button">${showFurigana?'후리가나 숨기기':'후리가나'}</button><button id="koreanToggle" class="${showKorean?'active':''}" type="button">${showKorean?'해석 숨기기':'해석'}</button></div>`}
function render(){const c=filtered[index];$('starFilter').textContent=`★ 별표 (${stars.size})`;$('starFilter').classList.toggle('active',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`${c.code} · Part ${c.part} · ${c.topic}`:'';updateTimerButton(c);if(!c)return;$('star').textContent=stars.has(c.id)?'★':'☆';$('card').classList.toggle('back',back);$('card').innerHTML=back?`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>모범답안</span></div><p class="answer" lang="ja">A. ${showFurigana?RUBY[c.id]:esc(c.a)}</p>${showKorean?`<p class="korean answerKo">${esc(KOREAN[c.id])}</p>`:''}${cardActions()}<div class="hint">다시 탭하면 질문으로 돌아갑니다</div>`:`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>질문</span></div><p class="prompt" lang="ja">Q. ${showFurigana?QUESTION_RUBY[c.id]:esc(c.q)}</p>${showKorean?`<p class="korean">${esc(c.qko)}</p>`:''}${cardActions()}<div class="hint">탭하여 모범답안 확인</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';if(mode==='list')$('listView').innerHTML=filtered.map(x=>`<article class="listitem"><div class="row"><h2>${x.code} · Part ${x.part} · ${esc(x.topic)}</h2><button data-speak="${x.id}">듣기</button></div><p class="listQ">Q. ${esc(x.q)}</p><p class="korean">${esc(x.qko)}</p><p class="listA">A. ${esc(x.a)}</p></article>`).join('')}
function flip(){if(!filtered.length)return;stopSpeech();back=!back;showKorean=false;showFurigana=false;render()}
function move(n){if(!filtered.length)return;stopSpeech();stopTimer();index=(index+n+filtered.length)%filtered.length;back=false;showKorean=false;showFurigana=false;render()}
$('card').onclick=e=>{if(e.target.closest('#furiganaToggle')){showFurigana=!showFurigana;render();return}if(e.target.closest('#koreanToggle')){showKorean=!showKorean;render();return}flip()};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('speak').onclick=()=>speak(filtered[index],back);$('timer').onclick=toggleTimer;$('autoPlay').onclick=toggleAuto;$('star').onclick=()=>{const id=filtered[index].id;stars.has(id)?stars.delete(id):stars.add(id);localStorage.setItem('sjpt-l8-stars-v1',JSON.stringify([...stars]));render()};$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{mode='card';render()};$('listMode').onclick=()=>{stopAuto();stopTimer();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('round').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=()=>{$('search').value='';$('part').value=$('round').value='';onlyStars=false;apply()};$('shuffle').onclick=()=>{stopAuto();stopTimer();for(let i=filtered.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;showFurigana=false;updateRanges();render()};$('rangeStart').onchange=()=>{stopAuto();stopTimer();const x=bounds();if(x.end<x.start)$('rangeEnd').value=$('rangeStart').value;index=bounds().start;back=false;showFurigana=false;render()};$('rangeEnd').onchange=()=>{stopAuto();stopTimer();const x=bounds();if(x.end<x.start)$('rangeStart').value=$('rangeEnd').value;index=bounds().start;back=false;showFurigana=false;render()};$('listView').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(DATA.find(c=>c.id==b.dataset.speak),false)};for(const x of DATA.map(c=>c.round))$('round').add(new Option(x,x));apply();
</script>
