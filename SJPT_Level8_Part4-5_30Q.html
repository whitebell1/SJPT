<script>
const QUESTION_RUBY={};
const KOREAN={};
const DATA=[{"id":1,"code":"1A","part":4,"round":"1A","topic":"生活の習慣と選択","q":"毎日の生活で、意識して続けている習慣は何ですか。続けている理由も教えてください。","qko":"","a":"私は、翌日に必要な物を前の晩にそろえるようにしています。朝になってから準備すると、忘れ物をしがちだからです。たとえば、書類と鍵を玄関の近くに置いておくと、慌てずに出かけられます。小さな習慣ですが、気持ちにも余裕ができます。"},{"id":2,"code":"1B","part":4,"round":"1B","topic":"生活の習慣と選択","q":"忙しい一日を終えた後、どのように気分を切り替えていますか。簡単に説明してください。","qko":"","a":"帰宅後は、近所を少し歩いて気分を切り替えています。家にいると仕事のことを考え続けてしまうからです。音楽を聞かずに周りの景色を眺めると、頭の中が落ち着きます。疲れた日は無理に出かけず、窓を開けて外の空気に触れるだけにしています。"},{"id":3,"code":"1C","part":5,"round":"1C","topic":"生活の習慣と選択","q":"時間を節約できるサービスは、多少お金がかかっても利用したほうがよいと思いますか。理由と具体例を挙げて話してください。","qko":"","a":"私は、生活に無理のない範囲なら、利用したほうがよいと思います。時間に追われていると、休む余裕までなくなってしまうからです。たとえば、帰宅が遅くなる日に食材の宅配を頼めば、買い物に行く時間を休息に回せます。ただ、便利だからといって何でも頼むと、出費がかさみます。まず一か月に使える金額を決め、その中で負担の大きい家事から任せるのがよいと思います。自分でやる部分も残せば、無理なく使い続けられます。"},{"id":4,"code":"2A","part":4,"round":"2A","topic":"学習と情報の見極め","q":"新しい知識や技能を身に付けるとき、どのように勉強していますか。自分に合う方法を教えてください。","qko":"","a":"私は、まず短い説明を読み、それを実際に試してみるようにしています。読むだけでは、分かったつもりになりやすいからです。日本語なら、新しく覚えた表現で自分の経験を話し、録音して確かめます。使えなかった表現だけを復習すると、無理なく続けられます。"},{"id":5,"code":"2B","part":4,"round":"2B","topic":"学習と情報の見極め","q":"インターネットで見つけた情報が信頼できるかどうか、どのように確かめていますか。","qko":"","a":"私は、誰がいつ発信した情報なのかを最初に確かめます。内容が正しくても、古くて今は当てはまらない場合があるからです。制度や試験について調べるときは、紹介記事だけで判断せず、公式の案内も読むようにしています。分からない点は、断定せずに残します。"},{"id":6,"code":"2C","part":5,"round":"2C","topic":"学習と情報の見極め","q":"学校や語学教室では、対面授業よりオンライン授業を増やすべきだと思いますか。理由と具体例を挙げて話してください。","qko":"","a":"私は、通学の負担が大きい人のために、オンライン授業を増やしてもよいと思います。移動に時間がかからなければ、仕事や家事の合間にも学びやすくなるからです。たとえば、遠くの教室に通えない人でも、自宅から専門の先生の授業を受けられます。ただ、画面越しでは質問のタイミングをつかみにくいこともあります。そのため、授業後に質問できる時間を設けるなど、学習者が取り残されない工夫と一緒に増やすことが必要だと思います。"},{"id":7,"code":"3A","part":4,"round":"3A","topic":"仕事の進め方と調整","q":"人と協力して何かを進めるとき、うまくいかなかった経験はありますか。その後、どのように改善しましたか。","qko":"","a":"以前、共同作業で役割をはっきり決めず、同じ資料を二人で作ってしまったことがあります。お互いに相手の担当を確認していなかったのが原因です。それ以来、始める前に担当と期限を共有しています。短い確認ですが、作業の重複を防げるようになりました。"},{"id":8,"code":"3B","part":4,"round":"3B","topic":"仕事の進め方と調整","q":"いくつもの作業を同時に頼まれたとき、どのように優先順位を決めていますか。","qko":"","a":"まず締め切りを確かめ、急ぐ作業から取りかかります。ただ、時間のかかる作業を最後に残すと間に合わないので、必要な時間も考えます。たとえば、確認を頼む資料は早めに送ります。全部は難しいと分かった場合は、無理に引き受けず、期限を相談します。"},{"id":9,"code":"3C","part":5,"round":"3C","topic":"仕事の進め方と調整","q":"会社は、従業員が出勤時刻を柔軟に選べる制度をもっと取り入れるべきだと思いますか。理由と実施する際の注意点を話してください。","qko":"","a":"私は、仕事の内容に合う場合は、取り入れたほうがよいと思います。出勤時刻を調整できれば、家庭の用事と仕事を両立しやすくなるからです。たとえば、朝に子どもを送る人は、少し遅く出勤して、その分帰る時刻を調整できます。ただ、全員が別々の時間に働くと、連絡が取りにくくなるかもしれません。打ち合わせのできる時間を決め、予定を共有することが必要です。周囲に負担が偏らないようにすれば、働きやすさにつながると思います。"},{"id":10,"code":"4A","part":4,"round":"4A","topic":"消費とサービス","q":"買い物をするとき、あなたは実店舗とネット通販をどのように使い分けていますか。","qko":"","a":"服は実店舗で買い、いつも使う日用品はネットで注文しています。服は試着しないと、サイズが合うか判断しにくいからです。一方、日用品は品質が分かっているので、持ち帰る手間を省ける通販を利用することが多いです。"},{"id":11,"code":"4B","part":4,"round":"4B","topic":"消費とサービス","q":"店や施設で、接客がよいと感じるのはどのようなときですか。","qko":"","a":"こちらの話を最後まで聞いてくれると、接客がよいと感じます。以前、店で品物を探した際、用途まで聞いた上で別の商品も紹介してもらいました。ただ勧めるのではなく、希望に合う物を一緒に考えてくれた点が印象的でした。"},{"id":12,"code":"4C","part":5,"round":"4C","topic":"消費とサービス","q":"店や公共施設の手続きを、原則としてオンライン化することについて、あなたはどう考えますか。","qko":"","a":"オンライン化には賛成ですが、窓口も残す必要があると思います。自宅から申し込めれば、移動や待ち時間の負担を減らせるからです。例えば、仕事で受付時間に間に合わない人にとっては便利です。ただ、端末の操作に不慣れな人まで、同じ方法を求められると困るでしょう。利用者の事情を踏まえて、電話や対面でも手続きできるようにすれば、便利さを広く生かせます。方法を一つに絞るより、選択肢を用意することが大切です。"},{"id":13,"code":"5A","part":4,"round":"5A","topic":"地域と環境","q":"日常生活で、物を無駄にしないために心掛けていることを教えてください。","qko":"","a":"食材を無駄にしないよう、買い物の前に冷蔵庫の中を確かめています。以前は安い物を多めに買い、使い切れないことがありました。今は家にある物から献立を考えるので、必要な分だけ買えて、調理の手間も減りました。"},{"id":14,"code":"5B","part":4,"round":"5B","topic":"地域と環境","q":"あなたが住む場所を選ぶとしたら、どのような点を重視しますか。","qko":"","a":"買い物や通院に便利かどうかを重視します。部屋が広くても、毎日の移動に時間がかかると負担になるからです。特に、普段利用する店や駅まで実際に歩いてみて、無理なく暮らせる場所かを確かめてから決めたいです。"},{"id":15,"code":"5C","part":5,"round":"5C","topic":"地域と環境","q":"地域で環境に配慮した行動を広めるには、どのような取り組みが必要だと思いますか。","qko":"","a":"環境に配慮した行動を、日常の中で続けやすくすることが必要だと思います。大切だと分かっていても、時間や手間がかかると実行しにくいからです。例えば、資源を回収する場所を買い物のついでに立ち寄れる所に設ければ、参加しやすくなります。また、分別の方法を分かりやすく示すことも大切です。住民に努力を求めるだけではなく、迷わず行動できる環境を整えることで、継続的な取り組みにつながると思います。"},{"id":16,"code":"6A","part":4,"round":"6A","topic":"技術と働き方","q":"予定や作業を管理するために、あなたはどのような工夫をしていますか。","qko":"","a":"予定はスマートフォンで管理し、その日にする作業は紙に書いています。予定は外出先でも確認できますし、作業は書き出すと優先順位を付けやすいからです。全部を一つにまとめず、確認する目的に応じて使い分けています。"},{"id":17,"code":"6B","part":4,"round":"6B","topic":"技術と働き方","q":"初めて使うアプリや機器の操作は、どのように覚えますか。","qko":"","a":"まず基本的な使い方を読み、必要な操作から試します。説明を全部覚えようとしても、実際に使わないと忘れてしまうからです。分からない部分は動画などで確かめますが、重要な設定は公式の案内を確認してから変更します。"},{"id":18,"code":"6C","part":5,"round":"6C","topic":"技術と働き方","q":"職場で生成AIの利用を進める際、どのような点を重視すべきだと思いますか。","qko":"","a":"便利さに加え、使った結果を人が確認できることを重視すべきだと思います。文章の下書きなどに使えば、考えを整理する助けになります。ただ、自然な文章だからといって、内容が正しいとは限りません。例えば、社外に出す案内は、担当者が根拠や表現を確かめる必要があります。また、入力してよい情報を職場で決めておくことも大切です。まず確認しやすい業務から試し、使い方を共有しながら範囲を広げるのがよいと思います。"},{"id":19,"code":"7A","part":4,"round":"7A","topic":"合意形成と公共性","q":"職場や学校で共有している物の使い方について、意見が分かれたらどうしますか。簡単に説明してください。","qko":"","a":"まず、なぜ意見が違うのかを聞きます。例えば共有の机なら、使いたい時間が違うだけかもしれません。事情を踏まえて利用時間を分け、しばらく試します。決めた後も使いにくい点がないかを確かめたいです。"},{"id":20,"code":"7B","part":4,"round":"7B","topic":"合意形成と公共性","q":"近所の集まりで自分とは違う意見が出たとき、どのように話しますか。簡単に説明してください。","qko":"","a":"すぐに反対せず、まず相手の理由を聞きます。行事の日程なら、参加しにくい事情があるかもしれません。そのうえで自分の希望も理由と一緒に伝えます。一度で決められなくても、互いに納得できる案を探します。"},{"id":21,"code":"7C","part":5,"round":"7C","topic":"合意形成と公共性","q":"地域の公共施設の使い道は、住民の多数決だけで決めてよいと思いますか。あなたの考えを話してください。","qko":"","a":"多数決だけで決めるのは避けたほうがよいと思います。賛成する人が多くても、利用できなくなる人の事情までは分からないからです。例えば静かに勉強する場所を運動の部屋に変えると、困る人もいるでしょう。まず利用者から意見を集め、曜日で用途を分ける案などを考えるべきです。全員の希望をかなえるのは難しいにせよ、少数の意見も聞いたうえで決めれば、住民が結果をより受け入れやすくなると思います。"},{"id":22,"code":"8A","part":4,"round":"8A","topic":"第4部 第5部 通し演習","q":"忙しい日でも続けている習慣はありますか。簡単に説明してください。","qko":"","a":"寝る前に、翌日することを三つだけ書いています。忙しいと、何から始めるか迷ってしまうからです。細かい予定まで決めるわけではありませんが、優先順位を付けておくと安心できます。短時間で済むので続けやすいです。"},{"id":23,"code":"8B","part":4,"round":"8B","topic":"第4部 第5部 通し演習","q":"長く使うために、普段どのように持ち物を手入れしていますか。簡単に説明してください。","qko":"","a":"靴は、履いた後に汚れを落としてからしまいます。雨にぬれた日は、すぐに棚に入れず、風通しのよい場所で乾かします。手入れを怠ると傷みやすいので、少し面倒でもその日のうちに確認するようにしています。"},{"id":24,"code":"8C","part":4,"round":"8C","topic":"第4部 第5部 通し演習","q":"楽しみにしていた予定が急に中止になったら、どう過ごしますか。簡単に説明してください。","qko":"","a":"まず、一緒に行く予定だった人に連絡し、別の日にできるか相談します。その日に無理をして出かけるより、家でゆっくり過ごしたいです。後回しにしていた本を読むなど、空いた時間を前向きに使うようにします。"},{"id":25,"code":"8D","part":4,"round":"8D","topic":"第4部 第5部 通し演習","q":"初めて行く場所について、出発前に何を調べますか。簡単に説明してください。","qko":"","a":"行き方と営業時間を先に調べます。駅に着いても、出口を間違えると時間がかかるからです。地図だけでなく、建物の外観なども確認します。余裕を持って出発できるよう、乗り換えにかかる時間も見ておきます。"},{"id":26,"code":"8E","part":4,"round":"8E","topic":"第4部 第5部 通し演習","q":"身近な人から教わって役に立ったことを一つ挙げてください。簡単に説明してください。","qko":"","a":"同僚から、頼まれた仕事の締め切りを最初に確認するよう教わりました。以前は、すぐ始めればよいと思っていましたが、急ぎ方が分からず困ることがありました。今は期限を確かめてから順番を決めるので、落ち着いて進められます。"},{"id":27,"code":"8F","part":5,"round":"8F","topic":"第4部 第5部 通し演習","q":"仕事の連絡には、勤務時間外でもすぐに返事をするべきだという意見があります。あなたはどう思いますか。","qko":"","a":"勤務時間外まで、いつもすぐに返事をする必要はないと思います。休んでいる間も仕事を気にしていると、十分に休めなくなるからです。ただし、急な事故への対応など、待てない連絡もあるでしょう。そのため、緊急の場合に誰へ連絡するかを先に決めておくべきです。普通の確認なら翌日の返事でよいと分かっていれば、送る人も受ける人も安心できます。速さだけを求めるのではなく、連絡の必要性を考えることが大切です。"},{"id":28,"code":"8G","part":5,"round":"8G","topic":"第4部 第5部 通し演習","q":"学校の図書館を、静かに読む場所だけでなく、話し合いにも使える場所にすることについて、どう思いますか。","qko":"","a":"話し合いにも使えるようにすることに賛成です。本を読んで終わるだけでなく、感想を伝え合えば、自分とは違う見方に気付けるからです。ただし、静かに勉強したい人の邪魔になってはいけません。部屋や時間帯を分け、話せる場所を分かりやすく示す必要があります。使い始めてからも、音が気になる人の意見を聞くべきです。読むことと話し合うことをうまく組み合わせれば、図書館を利用する楽しみが広がると思います。"},{"id":29,"code":"8H","part":5,"round":"8H","topic":"第4部 第5部 通し演習","q":"店では、商品の包装をできるだけ簡単にするべきだと思いますか。あなたの考えを話してください。","qko":"","a":"必要以上の包装は減らしたほうがよいと思います。持ち帰ってすぐに捨てる袋や箱が多いと、片付けにも手間がかかるからです。ただし、壊れやすい物や食品には、保護するための包装が必要です。何でも省くのではなく、商品に合った方法を選ぶべきだと思います。例えば自宅用なら簡単に包み、贈り物なら希望に応じて包装する方法があります。店と客が必要なものを確かめながら、無駄を減らしていくのがよいと思います。"},{"id":30,"code":"8I","part":5,"round":"8I","topic":"第4部 第5部 通し演習","q":"地域の防災訓練に、住民が参加することにはどのような意義があると思いますか。あなたの考えを話してください。","qko":"","a":"防災訓練には、知っているつもりのことを実際に確かめられる意義があると思います。避難場所を聞いたことがあっても、歩いてみると迷うかもしれません。また、近所の人と顔を合わせておけば、困ったときに声を掛けやすくなるでしょう。ただ参加するだけでなく、自分が分からなかった点を確認することが大切です。仕事などで出られない人にも内容を伝えれば、地域の中で備えを考える機会を広げられると思います。"}];
const RUBY={};
const $=id=>document.getElementById(id),AUTO_DELAY=3000,TIMER_SECONDS={3:15,4:25,5:45};let filtered=[...DATA],index=0,back=false,showKorean=false,showFurigana=false,onlyStars=false,mode='card',autoPlaying=false,autoTimer=null,timerInterval=null,timerRunning=false,timerLeft=0;let stars=new Set(JSON.parse(localStorage.getItem('sjpt-l8-stars-v1')||'[]'));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
function speak(c,answer,done){if(!c||!('speechSynthesis'in window)){if(done)done();return}stopSpeech();const u=new SpeechSynthesisUtterance(answer?c.a:c.q);u.lang='ja-JP';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));if(voices[0])u.voice=voices.find(v=>v.default)||voices[0];u.onstart=()=>{$('message').textContent='일본어 음성 재생 중…'};u.onend=()=>{$('message').textContent='';if(done)done()};u.onerror=()=>{if(done)done()};speechSynthesis.speak(u)}
function timerSeconds(c=filtered[index]){return c?(TIMER_SECONDS[c.part]||25):25}
function updateTimerButton(c=filtered[index]){const b=$('timer');if(!b)return;const seconds=timerRunning?timerLeft:timerSeconds(c);b.textContent=timerRunning?`■ ${seconds}초`:`⏱ ${seconds}초`;b.classList.toggle('running',timerRunning);b.setAttribute('aria-label',timerRunning?'답변 타이머 중지':`현재 문항 ${seconds}초 답변 타이머 시작`)}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerLeft=timerSeconds();updateTimerButton()}
function toggleTimer(){if(timerRunning){stopTimer();return}if(!filtered.length)return;stopAuto();stopSpeech();timerLeft=timerSeconds();timerRunning=true;updateTimerButton();timerInterval=setInterval(()=>{timerLeft--;if(timerLeft<=0){clearInterval(timerInterval);timerInterval=null;timerRunning=false;$('timer').textContent='✓ 완료';$('timer').classList.remove('running');$('message').textContent='답변 시간이 종료되었습니다.';if(navigator.vibrate)navigator.vibrate([150,80,150]);setTimeout(()=>{if(!timerRunning){$('message').textContent='';updateTimerButton()}},1500);return}updateTimerButton()},1000)}
function bounds(){let start=filtered.findIndex(c=>String(c.id)==$('rangeStart').value),end=filtered.findIndex(c=>String(c.id)==$('rangeEnd').value);return{start:start<0?0:start,end:end<0?Math.max(0,filtered.length-1):end}}
function updateRanges(){const a=$('rangeStart'),b=$('rangeEnd'),av=a.value,bv=b.value;a.innerHTML=b.innerHTML='';filtered.forEach(c=>{const label=c.code;a.add(new Option(label,c.id));b.add(new Option(label,c.id))});a.disabled=b.disabled=!filtered.length;if(!filtered.length)return;a.value=filtered.some(c=>String(c.id)===av)?av:filtered[0].id;b.value=filtered.some(c=>String(c.id)===bv)?bv:filtered.at(-1).id;if(bounds().end<bounds().start)b.value=a.value}
function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);$('autoPlay').textContent='▶';$('autoPlay').classList.remove('active')}
function schedule(){clearTimeout(autoTimer);if(!autoPlaying||!filtered.length)return;autoTimer=setTimeout(()=>{if(back){const x=bounds();index=index>=x.end?x.start:index+1;back=false}else back=true;showKorean=false;showFurigana=false;render();speak(filtered[index],back,schedule)},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stopSpeech();return}if(!filtered.length)return;stopTimer();const x=bounds();index=x.start;back=false;showKorean=false;showFurigana=false;autoPlaying=true;$('autoPlay').textContent='■';$('autoPlay').classList.add('active');render();speak(filtered[index],false,schedule)}
function apply(){stopAuto();stopSpeech();stopTimer();const q=$('search').value.trim().toLowerCase();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('round').value||c.round==$('round').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;showKorean=false;showFurigana=false;updateRanges();render()}
function cardActions(){return ''}
function render(){const c=filtered[index];$('starFilter').textContent=`★ 별표 (${stars.size})`;$('starFilter').classList.toggle('active',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`${c.code} · Part ${c.part} · ${c.topic}`:'';updateTimerButton(c);if(!c)return;$('star').textContent=stars.has(c.id)?'★':'☆';$('card').classList.toggle('back',back);$('card').innerHTML=back?`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>모범답안</span></div><p class="answer" lang="ja">A. ${showFurigana?RUBY[c.id]:esc(c.a)}</p>${showKorean?`<p class="korean answerKo">${esc(KOREAN[c.id])}</p>`:''}${cardActions()}<div class="hint">다시 탭하면 질문으로 돌아갑니다</div>`:`<div class="cardTop"><span>${c.code} · Part ${c.part} · ${esc(c.topic)}</span><span>질문</span></div><p class="prompt" lang="ja">Q. ${showFurigana?QUESTION_RUBY[c.id]:esc(c.q)}</p>${showKorean?`<p class="korean">${esc(c.qko)}</p>`:''}${cardActions()}<div class="hint">탭하여 모범답안 확인</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';if(mode==='list')$('listView').innerHTML=filtered.map(x=>`<article class="listitem"><div class="row"><h2>${x.code} · Part ${x.part} · ${esc(x.topic)}</h2><button data-speak="${x.id}">듣기</button></div><p class="listQ">Q. ${esc(x.q)}</p><p class="korean">${esc(x.qko)}</p><p class="listA">A. ${esc(x.a)}</p></article>`).join('')}
function flip(){if(!filtered.length)return;stopSpeech();back=!back;showKorean=false;showFurigana=false;render()}
function move(n){if(!filtered.length)return;stopSpeech();stopTimer();index=(index+n+filtered.length)%filtered.length;back=false;showKorean=false;showFurigana=false;render()}
$('card').onclick=e=>{if(e.target.closest('#furiganaToggle')){showFurigana=!showFurigana;render();return}if(e.target.closest('#koreanToggle')){showKorean=!showKorean;render();return}flip()};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('speak').onclick=()=>speak(filtered[index],back);$('timer').onclick=toggleTimer;$('autoPlay').onclick=toggleAuto;$('star').onclick=()=>{const id=filtered[index].id;stars.has(id)?stars.delete(id):stars.add(id);localStorage.setItem('sjpt-l8-stars-v1',JSON.stringify([...stars]));render()};$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{mode='card';render()};$('listMode').onclick=()=>{stopAuto();stopTimer();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('round').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=()=>{$('search').value='';$('part').value=$('round').value='';onlyStars=false;apply()};$('shuffle').onclick=()=>{stopAuto();stopTimer();for(let i=filtered.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;showFurigana=false;updateRanges();render()};$('rangeStart').onchange=()=>{stopAuto();stopTimer();const x=bounds();if(x.end<x.start)$('rangeEnd').value=$('rangeStart').value;index=bounds().start;back=false;showFurigana=false;render()};$('rangeEnd').onchange=()=>{stopAuto();stopTimer();const x=bounds();if(x.end<x.start)$('rangeStart').value=$('rangeEnd').value;index=bounds().start;back=false;showFurigana=false;render()};$('listView').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(DATA.find(c=>c.id==b.dataset.speak),false)};for(const x of DATA.map(c=>c.round))$('round').add(new Option(x,x));apply();
</script>
