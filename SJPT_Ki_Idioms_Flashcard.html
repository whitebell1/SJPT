  <style>
    .perspective-1000 {

    #backWordMini { font-size:20px; }
    #backMeaning { font-size:18px; }
    #backUsage { font-size:14px; font-weight:400; line-height:1.55; color:#475A4D; margin-top:4px; }
    #backMeaning[hidden] + #backUsage, #backUsage:empty { display:none; }
    #backExampleJapanese { font-size:19px; }
    .backWordRuby { ruby-position:over; ruby-align:center; }

/* Furigana is precomputed; audio continues to use the original sentence. */

#backExampleJapanese ruby, td[lang="ja"] ruby, td ruby { ruby-position:over; ruby-align:center; }
#backExampleJapanese rt, td rt { font-size:0.58em; font-weight:400; color:#c7d2fe; }
td div[lang="ja"] { line-height:2.4; }

@media(min-width:640px){ #cardContainer { aspect-ratio:16 / 8.075; } }

@media(max-width:480px){ #cardContainer.has-example { height:544px; } }
#cardInner > .backface-hidden { overflow-y:auto; overscroll-behavior:contain; }
/* Match the Level 5 sage palette across both faces and the word list. */
#cardInner > .backface-hidden {
  background: linear-gradient(135deg, #FBFCFA, #DCE5DA);
  color: var(--sjpt-text);
  border-color: var(--sjpt-border);
}
#cardInner > .rotate-y-180 {
  background: linear-gradient(135deg, #F0F4ED, #CFDCCF);

}
#flashcardView :is(.text-white,.text-slate-200,#backExampleJapanese),
#vocabTableContainer :is(.text-white,.text-slate-200),

#flashcardView .text-indigo-400,
#vocabTableContainer .text-indigo-300 { color: var(--sjpt-primary); }

#backExample { border-color:var(--sjpt-border); }
#vocabTableContainer { background:var(--sjpt-surface);border-color:var(--sjpt-border); }
#vocabTableContainer thead,
#cardInner .bg-slate-900\/60,#vocabTableBody .bg-slate-800 { background:var(--sjpt-muted); }
#progressBar { background:linear-gradient(90deg,var(--sjpt-primary),#A47A4D); }

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30 px-4 py-3 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
        <a href="https://whitebell1.github.io/SJPT/index.html" aria-label="SJPT 학습 목차로 돌아가기" title="목차로 돌아가기" class="menuLink w-8 h-8 p-0 inline-flex items-center justify-center rounded-lg bg-slate-700 text-slate-200 transition hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-300">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
          <h1 class="text-base font-bold tracking-wide" style="color:#000">気の慣用表現 暗記カード</h1>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4">
    <!-- 검색 및 필터 패널 -->
    <section class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/60 flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="단어, 읽는 법, 뜻, 번호(예: 01) 검색..." 
          class="w-full bg-slate-900/90 text-sm border border-slate-700 rounded-lg pl-9 pr-8 py-2 focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-500"
        />
        <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="studyFilters">
        <select id="probFilter" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-2 text-slate-300 focus:outline-none focus:border-indigo-500">
          <option value="ALL">전체 학습 구간</option>
        </select>
        <button id="shuffleBtn" title="단어 순서 섞기" aria-label="셔플" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs flex items-center gap-1.5 transition">
          <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        </button>
        <button id="resetOrderBtn" title="원래 순서로 초기화" class="px-2.5 py-2 bg-slate-700/80 hover:bg-slate-600 text-slate-300 rounded-lg text-xs transition">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="studyStarredBtn" class="px-3 rounded-lg border text-xs font-medium">
          <span aria-label="즐겨찾기">★ (<span id="starredCount">0</span>)</span>
        </button>
      </div>
    </section>

    <!-- 플래시카드 뷰 -->
    <div id="flashcardView" class="flex-1 flex flex-col items-center justify-center gap-4">
      <!-- 진행률 바 및 카운터 -->
      <div class="cardToolbar text-xs text-slate-400">
        <div class="cardToolbarActions">
          <button id="autoPlayBtn" class="w-11 h-11 inline-grid place-items-center rounded-lg bg-orange-600 hover:bg-orange-700 border border-orange-400 text-white transition text-base" aria-label="자동 넘김 시작" title="자동 넘김 시작" aria-pressed="false">▶</button>
          <button id="starToggleBtn" class="w-11 h-11 inline-grid place-items-center rounded-lg text-slate-400 hover:text-amber-400 transition text-base">
            <i class="fa-regular fa-star"></i>
          </button>
          <button id="ttsBtn" class="text-slate-400 hover:text-indigo-400 transition text-base" title="일본어 발음 듣기">
            <i class="fa-solid fa-volume-high"></i>
          </button>
        </div>
      </div>

      <!-- 플래시카드 컨테이너 -->
      <div class="w-full max-w-lg aspect-[16/10] sm:aspect-[16/9.5] perspective-1000 cursor-pointer select-none" id="cardContainer">
        <div id="cardInner" class="relative w-full h-full transform-style-3d transition-transform duration-500 ease-out shadow-2xl rounded-2xl">
          <!-- 카드 앞면 (일본어 단어 및 발음) -->
          <div class="absolute inset-0 backface-hidden bg-gradient-to-br from-slate-800 to-slate-850 border border-slate-700/80 rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between text-center shadow-indigo-950/20 shadow-xl">
            <div class="w-full flex justify-between items-center text-xs text-slate-400">
              <span class="font-mono text-indigo-400" id="frontCardId">No. 1</span>
              <span class="flex items-center gap-1 text-[11px] bg-slate-900/60 px-2.5 py-1 rounded-full text-slate-400">
                <i class="fa-solid fa-arrows-rotate text-[10px]"></i> 탭하여 뜻 확인
              </span>
            </div>

            <div class="my-auto flex flex-col items-center gap-2">
              <span id="frontReading" class="text-indigo-300 text-sm sm:text-base tracking-widest font-medium">いねむり(する)</span>
              <h2 id="frontWord" class="text-4xl sm:text-5xl font-bold text-white tracking-wider">居眠り(する)</h2>
              <p id="frontMeaning" class="meaning font-semibold" hidden></p>
            </div>

            <div class="w-full text-center">
              <span class="text-[11px] text-slate-500">Space 키: 뒤집기 | ← →: 이전/다음</span>
              <div><button type="button" class="furiganaControl" aria-pressed="true">후리가나 숨기기</button></div>
            </div>
          </div>

          <!-- 카드 뒷면 (한국어 뜻) -->
          <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-950/80 to-slate-900 border border-indigo-700/50 rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between text-center shadow-indigo-900/20 shadow-xl">
            <div class="w-full flex justify-between items-center text-xs text-slate-400">
              <span class="font-mono text-indigo-300" id="backCardId">No. 1</span>
              <span class="text-xs text-indigo-300 font-medium" id="backProbTag">구간: 01</span>
            </div>

            <div class="my-auto flex flex-col items-center gap-3">
              <div class="text-slate-400 text-sm flex items-center gap-2 font-mono">
                <ruby class="backWordRuby font-sans"><span id="backWordMini" class="font-semibold text-white">気になる</span><rt id="backReadingMini" class="text-indigo-300 font-normal">きになる</rt></ruby>
              </div>
              <h3 id="backMeaning" class="text-2xl sm:text-3xl font-extrabold text-emerald-400">졸다</h3><p id="backUsage"></p><div id="backExample" hidden><p id="backExampleJapanese" lang="ja"></p><p id="backExampleKorean"></p></div>
            </div>

            <div class="w-full text-center">
              <span class="text-[11px] text-slate-400">다시 탭하면 앞면으로 회전합니다</span>
              <div class="backCardActions"><button type="button" id="exampleAudioBtn" class="furiganaControl" hidden>듣기</button><button type="button" class="furiganaControl" aria-pressed="true">후리가나</button><button type="button" id="copyBackBtn" class="furiganaControl">복사</button><button type="button" id="highlightExampleBtn" class="furiganaControl" title="예문을 선택한 뒤 눌러 표시하거나 지웁니다" hidden>형광펜</button><span id="highlightStatus" class="sr-only" role="status"></span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 진행 프로그레스 바 -->
      <div class="w-full max-w-lg bg-slate-800 rounded-full h-1.5 overflow-hidden border border-slate-700/40">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
      </div>

      <!-- 조작 컨트롤 버튼 -->
      <div class="flex items-center gap-3 mt-1">
        <button id="prevBtn" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-200 transition active:scale-95">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <button id="flipBtn" class="px-6 h-12 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition active:scale-95 text-sm">
          <i class="fa-solid fa-repeat"></i> 뒤집기
        </button>
        <button id="nextBtn" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-200 transition active:scale-95">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>
      </div>
    </div>

  </main>

  <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800 mt-auto">
    気 관용 표현 38개 · 발음 듣기
  </footer>

      currentIndex = playable;
      renderCurrentCard(true);
      const card = displayedList[currentIndex];
      playJapaneseAudio(card.reading.replace(/^～/, ''), () => pause(() => {
        playJapaneseAudio(card.exJa, () => pause(() => {
          currentIndex = (currentIndex + 1) % displayedList.length;
          scheduleAuto();
        }), fail);
      }), fail);
    }

    function toggleAuto() {
      if (autoPlaying) { stopAuto(); return; }
      if (!displayedList.length) return;
      flashcardView.classList.remove('hidden');
      autoPlaying = true;
      updateAutoStatus();
      scheduleAuto();
    }

    // 필터링 적용 함수
    function applyFilters() {
      stopAuto();
      const query = searchInput.value.trim().toLowerCase();
      const selectedProb = probFilter.value;

      displayedList = RAW_VOCAB.filter(item => {
        if (onlyStarred && !starredIds.has(item.id)) return false;

        const matchesQuery = !query || 
          item.id.toString() === query ||
          item.word.toLowerCase().includes(query) ||
          item.reading.toLowerCase().includes(query) ||
          item.meaning.toLowerCase().includes(query) ||
          item.prob.toLowerCase().includes(query) || item.exJa.toLowerCase().includes(query) || item.exKo.toLowerCase().includes(query);

        const matchesProb = selectedProb === 'ALL' || item.prob.includes(selectedProb);

        return matchesQuery && matchesProb;
      });

      currentIndex = 0;
      isFlipped = false;
      renderCurrentCard();
      clearSearchBtn.classList.toggle('hidden', query === '');
    }

    // 현재 카드 렌더링
    function renderHighlightedExample(card) {
      const example = document.getElementById('backExampleJapanese');
      example.innerHTML = card.exRuby;
      const offsets = new Set(cardHighlights[card.id] || []);
      if (!offsets.size) return;
      const walker = document.createTreeWalker(example, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        if (!walker.currentNode.parentElement.closest('rt,rp')) nodes.push(walker.currentNode);
      }
      let offset = 0;
      for (const node of nodes) {
        const value = node.data;
        const fragment = document.createDocumentFragment();
        for (let start = 0, end; start < value.length; start = end) {
          const marked = offsets.has(offset + start);
          end = start + 1;
          while (end < value.length && offsets.has(offset + end) === marked) end++;
          const text = value.slice(start, end);
          if (marked) {
            const mark = document.createElement('mark');
            mark.textContent = text;
            fragment.append(mark);
          } else {
            fragment.append(text);
          }
        }
        node.replaceWith(fragment);
        offset += value.length;
      }
    }

    function getExampleSelection() {
      const selection = window.getSelection();
      if (!isFlipped || !selection?.rangeCount || selection.isCollapsed) return null;
      const example = document.getElementById('backExampleJapanese');
      const range = selection.getRangeAt(0);
      if (!example.contains(range.startContainer) || !example.contains(range.endContainer)) return null;
      const offsetAt = (node, offset) => {
        const prefix = document.createRange();
        prefix.selectNodeContents(example);
        const reading = (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement).closest('rt,rp');
        if (reading) prefix.setEndBefore(reading);
        else prefix.setEnd(node, offset);
        const content = prefix.cloneContents();
        content.querySelectorAll('rt,rp').forEach(element => element.remove());
        return content.textContent.length;
      };
      return {
        cardId: displayedList[currentIndex]?.id,
        start: offsetAt(range.startContainer, range.startOffset),
        end: offsetAt(range.endContainer, range.endOffset)
      };
    }

    function renderCurrentCard(keepBack = false) {
      pendingHighlightSelection = null;
      const highlighter = document.getElementById('highlightExampleBtn');
      highlighter.hidden = true;
      const example = document.getElementById('backExample');
      const exampleAudio = document.getElementById('exampleAudioBtn');
      example.hidden = true;
      exampleAudio.hidden = true;
      document.getElementById('cardContainer').classList.remove('has-example');
      if (displayedList.length === 0) {
        frontWord.textContent = "검색 결과 없음";
        frontReading.textContent = "-";
        frontCardId.textContent = "No. 0";
        backMeaning.textContent = "조건에 일치하는 단어가 없습니다";
        backUsage.textContent = "";
        frontMeaning.textContent = "";
        backWordMini.textContent = "-";
        backReadingMini.textContent = "";
        progressBar.style.width = '0%';
        starToggleBtn.innerHTML = '<i class="fa-regular fa-star"></i>';
        return;
      }

      const item = displayedList[currentIndex];
      frontCardId.textContent = `No. ${item.id}`;
      frontReading.textContent = item.reading;
      frontWord.textContent = item.word;

      backCardId.textContent = `No. ${item.id}`;
      backWordMini.textContent = item.word;
      backReadingMini.textContent = item.reading;
      const {gloss, usage} = splitMeaning(item);
      backMeaning.textContent = gloss;
      backUsage.textContent = usage;
      frontMeaning.textContent = gloss;
      if (item.exJa) {
        renderHighlightedExample(item);
        highlighter.hidden = false;
        document.getElementById('backExampleKorean').textContent = item.exKo;
        example.hidden = false;
        exampleAudio.hidden = false;
        document.getElementById('cardContainer').classList.add('has-example');
      }
      backProbTag.textContent = `구간: ${item.prob}`;


      const progress = ((currentIndex + 1) / displayedList.length) * 100;
      progressBar.style.width = `${progress}%`;

      // 별표 상태 업데이트
      const isStarred = starredIds.has(item.id);
      starToggleBtn.innerHTML = isStarred 
        ? '<i class="fa-solid fa-star text-amber-400"></i>' 
        : '<i class="fa-regular fa-star text-slate-400"></i>';

      // 카드 앞면 상태로 리셋
      setFlipped(keepBack);
    }

    // 카드 회전 함수
    function setFlipped(flipped) {
      isFlipped = flipped;
      if (isFlipped) {
        cardInner.classList.add('rotate-y-180');
      } else {
        cardInner.classList.remove('rotate-y-180');
      }
      const card = displayedList[currentIndex];
      if (card) {
        try {
          localStorage.setItem(STUDY_POSITION_KEY, JSON.stringify({ cardId: card.id, back: flipped }));
        } catch {
          // The card remains usable when browser storage is unavailable.
        }
      }
    }

    function restoreStudyPosition() {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(STUDY_POSITION_KEY));
      } catch {
        return false;
      }
      const savedIndex = displayedList.findIndex(card => card.id === saved?.cardId);
      if (savedIndex < 0) return false;
      currentIndex = savedIndex;
      return saved.back === true;
    }

    function toggleFlip() {
      if (displayedList.length === 0) return;
      if (getExampleSelection()) return;
      if (autoPlaying) stopAuto();
      setFlipped(!isFlipped);
    }

    // 별표 토글 및 로컬스토리지 동기화
    function toggleStar(id) {
      if (starredIds.has(id)) {
        starredIds.delete(id);
      } else {
        starredIds.add(id);
      }
      localStorage.setItem('sjpt_ki_idioms38_starred_v1', JSON.stringify([...starredIds]));
      starredCount.textContent = starredIds.size;
      renderCurrentCard();
    }

    // 이벤트 리스너 설정
    function setupEventListeners() {
      autoPlayBtn.addEventListener('click', toggleAuto);
      const highlighter = document.getElementById('highlightExampleBtn');
      const highlightStatus = document.getElementById('highlightStatus');
      highlighter.addEventListener('pointerdown', event => {
        pendingHighlightSelection = getExampleSelection();
        if (pendingHighlightSelection && event.pointerType === 'mouse') event.preventDefault();
      });
      highlighter.addEventListener('click', event => {
        event.stopPropagation();
        const selected = getExampleSelection() || pendingHighlightSelection;
        pendingHighlightSelection = null;
        const card = displayedList[currentIndex];
        if (!isFlipped || !card || selected?.cardId !== card.id || selected.start >= selected.end) {
          highlighter.textContent = '예문을 선택하세요';
          highlightStatus.textContent = highlighter.textContent;
          return;
        }
        const offsets = new Set(cardHighlights[card.id] || []);
        const selectedOffsets = Array.from({length: selected.end - selected.start}, (_, i) => selected.start + i);
        const erase = selectedOffsets.every(offset => offsets.has(offset));
        for (const offset of selectedOffsets) {
          if (erase) offsets.delete(offset);
          else offsets.add(offset);
        }
        if (offsets.size) cardHighlights[card.id] = [...offsets];
        else delete cardHighlights[card.id];
        highlighter.textContent = '형광펜';
        try {
          localStorage.setItem(HIGHLIGHTS_KEY, JSON.stringify(cardHighlights));
          highlightStatus.textContent = erase ? '형광펜 표시를 지웠습니다.' : '형광펜 표시를 저장했습니다.';
        } catch {
          highlightStatus.textContent = '이 브라우저에 형광펜 표시를 저장할 수 없습니다.';
        }
        window.getSelection()?.removeAllRanges();
        renderHighlightedExample(card);
      });
      const copyBackBtn = document.getElementById('copyBackBtn');
      let copyFeedbackTimer;
      copyBackBtn.addEventListener('click', async event => {
        event.stopPropagation();
        const card = displayedList[currentIndex];
        const text = card?.exJa;
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBackBtn.textContent = '복사 완료';
        } catch {
          copyBackBtn.textContent = '복사 실패';
        }
        clearTimeout(copyFeedbackTimer);
        copyFeedbackTimer = setTimeout(() => { copyBackBtn.textContent = '복사'; }, 1500);
      });
      const furiganaButtons = cardContainer.querySelectorAll('.furiganaControl[aria-pressed]');
      function toggleFurigana() {
        const hidden = cardContainer.classList.toggle('furigana-hidden');
        furiganaButtons.forEach(control => {
          if (!control.closest('.backCardActions')) {
            control.textContent = hidden ? '후리가나 보기' : '후리가나 숨기기';
          }
          control.setAttribute('aria-pressed', String(!hidden));
        });
      }
      furiganaButtons.forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        toggleFurigana();
      }));

      // 카드 뒤집기
      cardContainer.addEventListener('click', toggleFlip);
      let swipeStart = null;
      cardContainer.addEventListener('touchstart', event => {
        const touch = event.touches[0];
        swipeStart = event.touches.length === 1 && !event.target.closest('button')
          ? {id: touch.identifier, x: touch.clientX, y: touch.clientY, time: Date.now()}
          : null;
      }, {passive: true});
      cardContainer.addEventListener('touchcancel', () => { swipeStart = null; });
      cardContainer.addEventListener('touchend', event => {
        const start = swipeStart;
        swipeStart = null;
        if (!start || Date.now() - start.time > 500 || getExampleSelection()) return;
        const touch = Array.from(event.changedTouches).find(point => point.identifier === start.id);
        if (!touch) return;
        const dx = touch.clientX - start.x;
        const dy = touch.clientY - start.y;
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        if (event.cancelable) event.preventDefault();
        (dx < 0 ? nextBtn : prevBtn).click();
      }, {passive: false});
      flipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFlip();
      });

      // 이전 / 다음 탐색
      prevBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        currentIndex = (currentIndex - 1 + displayedList.length) % displayedList.length;
        if (autoPlaying) scheduleAuto();
        else renderCurrentCard(isFlipped);
      });

      nextBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        currentIndex = (currentIndex + 1) % displayedList.length;
        if (autoPlaying) scheduleAuto();
        else renderCurrentCard(isFlipped);
      });

      // 음성 듣기
      ttsBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, ''));
      });

      document.getElementById('exampleAudioBtn').addEventListener('click', (e) => { e.stopPropagation(); if(displayedList.length)playJapaneseAudio(displayedList[currentIndex].exJa); });
      // 현재 카드 별표 토글
      starToggleBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        toggleStar(displayedList[currentIndex].id);
      });

      // 검색창 입력
      searchInput.addEventListener('input', applyFilters);
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        applyFilters();
        searchInput.focus();
      });

      // 필터 변경
      probFilter.addEventListener('change', applyFilters);

      // 셔플 버튼
      shuffleBtn.addEventListener('click', () => {
        stopAuto();
        if (displayedList.length <= 1) return;
        for (let i = displayedList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [displayedList[i], displayedList[j]] = [displayedList[j], displayedList[i]];
        }
        currentIndex = 0;
        renderCurrentCard();
      });

      // 원래 순서 리셋
      resetOrderBtn.addEventListener('click', () => {
        applyFilters();
      });

      // 별표 모드 필터 토글
      studyStarredBtn.addEventListener('click', () => {
        onlyStarred = !onlyStarred;
        studyStarredBtn.classList.toggle('bg-amber-600', onlyStarred);
        studyStarredBtn.classList.toggle('text-white', onlyStarred);
        studyStarredBtn.classList.toggle('bg-slate-700', !onlyStarred);
        studyStarredBtn.classList.toggle('text-amber-300', !onlyStarred);
        applyFilters();
      });

      // 키보드 단축키
      window.addEventListener('keydown', (e) => {
        if (['input', 'select', 'textarea'].includes(document.activeElement.tagName.toLowerCase()) ||
            (e.code === 'Space' && document.activeElement.matches('.furiganaControl'))) {
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault();
          toggleFlip();
        } else if (e.code === 'ArrowUp' || e.code === 'ArrowDown') {
          if (flashcardView.classList.contains('hidden') || !displayedList.length ||
              e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
          e.preventDefault();
          if (e.repeat) return;
          if (e.code === 'ArrowUp') toggleFurigana();
          else {
            const meaning = isFlipped ? backMeaning : frontMeaning;
            meaning.hidden = !meaning.hidden;
          }
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevBtn.click();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextBtn.click();
        } else if (e.code === 'KeyS') {
          e.preventDefault();
          if (displayedList.length > 0) {
            toggleStar(displayedList[currentIndex].id);
          }
        } else if (e.code === 'KeyV') {
          e.preventDefault();
          if (displayedList.length > 0) {
            playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, ''));
          }
        }
      });
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      initProbOptions();
      starredCount.textContent = starredIds.size;
      setupEventListeners();
      renderCurrentCard(restoreStudyPosition());
    });
  </script>
</body>
</html>
