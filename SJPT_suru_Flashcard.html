    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">

          <i class="fa-solid fa-layer-group text-sm"></i>

          <i class="fa-solid fa-house mr-1"></i>목차

        <button id="modeFlashcardBtn" class="px-3 py-1.5 rounded-lg bg-indigo-600 font-semibold text-white transition hover:bg-indigo-500">

        </button>
        <button id="modeListBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 font-medium text-slate-300 transition hover:bg-slate-600">

        <button id="studyStarredBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 font-medium text-amber-300 transition hover:bg-slate-600">
          <i class="fa-solid fa-star mr-1"></i>별표(<span id="starredCount">0</span>)

    <!-- 검색 및 필터 패널 -->
    <section class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/60 flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="단어, 읽는 법, 뜻, 번호(예: 01) 검색..." 
          class="w-full bg-slate-900/90 text-sm border border-slate-700 rounded-lg pl-9 pr-8 py-2 focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-500"
        />
        <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">

      </div>
      
      <div class="flex items-center gap-2">
        <select id="probFilter" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-2 text-slate-300 focus:outline-none focus:border-indigo-500">

          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </section>

        <div class="flex items-center gap-2">
          <span class="font-semibold text-slate-200" id="currentNumBadge">Card 1 / 309</span>
          <span class="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-[11px] text-indigo-400" id="currentProbBadge">학습 구간: 01</span>
        </div>
        <div class="flex items-center gap-3">

              <div class="text-slate-400 text-sm flex items-center gap-2 font-mono">

                <span id="backReadingMini" class="text-indigo-300 font-normal">[いねむり(する)]</span>

        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = `${p}번`;
        probFilter.appendChild(opt);
      });
    }

    // TTS 음성 재생 (일본어)
    function playJapaneseAudio(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function clearAutoTimer() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }
    function updateAutoStatus() { autoPlayBtn.classList.toggle('ring-2', autoPlaying); autoPlayBtn.classList.toggle('ring-orange-200', autoPlaying); autoPlayBtn.textContent = autoPlaying ? '■' : '▶'; autoPlayBtn.setAttribute('aria-pressed', String(autoPlaying)); const label = autoPlaying ? '자동 넘김 정지' : '자동 넘김 시작'; autoPlayBtn.setAttribute('aria-label', label); autoPlayBtn.title = label; }
    function stopAuto() { autoPlaying = false; clearAutoTimer(); updateAutoStatus(); }
    function scheduleAuto() { clearAutoTimer(); if (!autoPlaying || !displayedList.length || flashcardView.classList.contains('hidden')) { stopAuto(); return; } autoTimer = setTimeout(() => { window.speechSynthesis?.cancel(); if (isFlipped) { currentIndex = (currentIndex + 1) % displayedList.length; renderCurrentCard(); playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, '')); } else { setFlipped(true); } scheduleAuto(); }, AUTO_DELAY); }
    function toggleAuto() { if (autoPlaying) { stopAuto(); window.speechSynthesis?.cancel(); return; } if (!displayedList.length) return; listView.classList.add('hidden'); flashcardView.classList.remove('hidden'); setFlipped(false); autoPlaying = true; updateAutoStatus(); playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, '')); scheduleAuto(); }

    // 필터링 적용 함수
    function applyFilters() {
      stopAuto();
      const query = searchInput.value.trim().toLowerCase();
      const selectedProb = probFilter.value;

      displayedList = RAW_VOCAB.filter(item => {
        if (onlyStarred && !starredIds.has(item.id)) return false;

        const matchesQuery = !query || 
          item.id.toString() === query ||
          item.word.toLowerCase().includes(query) ||
          item.reading.toLowerCase().includes(query) ||
          item.meaning.toLowerCase().includes(query) ||
          item.prob.toLowerCase().includes(query) || item.exJa.toLowerCase().includes(query) || item.exKo.toLowerCase().includes(query);

        const matchesProb = selectedProb === 'ALL' || item.prob.includes(selectedProb);

        return matchesQuery && matchesProb;
      });

      currentIndex = 0;
      isFlipped = false;
      renderCurrentCard();
      renderListView();
      clearSearchBtn.classList.toggle('hidden', query === '');
    }

    // 현재 카드 렌더링
    function renderCurrentCard() {
      const example = document.getElementById('backExample');
      example.hidden = true;
      document.getElementById('cardContainer').classList.remove('has-example');
      if (displayedList.length === 0) {
        frontWord.textContent = "검색 결과 없음";
        frontReading.textContent = "-";
        frontCardId.textContent = "No. 0";
        backMeaning.textContent = "조건에 일치하는 단어가 없습니다";
        backWordMini.textContent = "-";
        backReadingMini.textContent = "";
        currentNumBadge.textContent = "0 / 0";
        currentProbBadge.textContent = "-";
        progressBar.style.width = '0%';
        starToggleBtn.innerHTML = '<i class="fa-regular fa-star"></i>';
        return;
      }

      const item = displayedList[currentIndex];
      frontCardId.textContent = `No. ${item.id}`;
      frontReading.textContent = item.reading;
      frontWord.textContent = item.word;

      backCardId.textContent = `No. ${item.id}`;
      backWordMini.textContent = item.word;
      backReadingMini.textContent = `[${item.reading}]`;
      backMeaning.textContent = item.meaning;
      if (item.exJa) {
        document.getElementById('backExampleJapanese').innerHTML = item.exRuby;
        document.getElementById('backExampleKorean').textContent = item.exKo;
        example.hidden = false;
        document.getElementById('cardContainer').classList.add('has-example');
      }
      backProbTag.textContent = `구간: ${item.prob}`;

      currentNumBadge.textContent = `Card ${currentIndex + 1} / ${displayedList.length}`;
      currentProbBadge.textContent = `학습 구간: ${item.prob}`;

      const progress = ((currentIndex + 1) / displayedList.length) * 100;
      progressBar.style.width = `${progress}%`;

      // 별표 상태 업데이트
      const isStarred = starredIds.has(item.id);
      starToggleBtn.innerHTML = isStarred 
        ? '<i class="fa-solid fa-star text-amber-400"></i>' 
        : '<i class="fa-regular fa-star text-slate-400"></i>';

      // 카드 앞면 상태로 리셋
      setFlipped(false);
    }

    // 카드 회전 함수
    function setFlipped(flipped) {
      isFlipped = flipped;
      if (isFlipped) {
        cardInner.classList.add('rotate-y-180');
      } else {
        cardInner.classList.remove('rotate-y-180');
      }
    }

    function toggleFlip() {
      if (displayedList.length === 0) return;
      setFlipped(!isFlipped);
      if (autoPlaying) scheduleAuto();
    }

    // 목록 모드 렌더링
    function renderListView() {
      listTotalCount.textContent = displayedList.length;
      vocabTableBody.innerHTML = '';

      if (displayedList.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="7" class="py-6 text-center text-slate-500">조건에 맞는 단어가 없습니다.</td>`;
        vocabTableBody.appendChild(tr);
        return;
      }

      displayedList.forEach(item => {
        const isStarred = starredIds.has(item.id);
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-750/50 transition border-b border-slate-800/80 group";
        tr.innerHTML = `
          <td class="py-2.5 px-3 text-center">
            <button class="row-star-btn text-xs ${isStarred ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'}" data-id="${item.id}">
              <i class="fa-${isStarred ? 'solid' : 'regular'} fa-star"></i>
            </button>
          </td>
          <td class="py-2.5 px-3 text-center font-mono text-slate-400">${item.id}</td>
          <td class="py-2.5 px-3 font-bold text-white text-base">${item.word}</td>
          <td class="py-2.5 px-3 text-indigo-300">${item.reading}</td>
          <td class="py-2.5 px-3 text-emerald-300 font-medium">${item.meaning}<div class="mt-3 text-slate-200 font-normal leading-relaxed" lang="ja">${item.exRuby}</div><div class="mt-2 text-slate-400 font-normal leading-relaxed">${item.exKo}</div></td>
          <td class="py-2.5 px-3 text-center">
            <span class="inline-block px-2 py-0.5 rounded bg-slate-800 text-[11px] text-slate-300 border border-slate-700 font-mono">${item.prob}</span>
          </td>
          <td class="py-2.5 px-3 text-center">
            <button class="row-audio-btn text-slate-400 hover:text-indigo-400 transition" data-word="${item.word}">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </td>
        `;
        vocabTableBody.appendChild(tr);
      });
    }

    // 별표 토글 및 로컬스토리지 동기화
    function toggleStar(id) {
      if (starredIds.has(id)) {
        starredIds.delete(id);
      } else {
        starredIds.add(id);
      }
      localStorage.setItem('sjpt_suru309_starred_v1', JSON.stringify([...starredIds]));
      starredCount.textContent = starredIds.size;
      renderCurrentCard();
      renderListView();
    }

    // 이벤트 리스너 설정
    function setupEventListeners() {
      autoPlayBtn.addEventListener('click', toggleAuto);

      // 카드 뒤집기
      cardContainer.addEventListener('click', toggleFlip);
      flipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFlip();
      });

      // 이전 / 다음 탐색
      prevBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        currentIndex = (currentIndex - 1 + displayedList.length) % displayedList.length;
        if (autoPlaying) clearAutoTimer();
        renderCurrentCard();
        if (autoPlaying) scheduleAuto();
      });

      nextBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        currentIndex = (currentIndex + 1) % displayedList.length;
        if (autoPlaying) clearAutoTimer();
        renderCurrentCard();
        if (autoPlaying) scheduleAuto();
      });

      // 음성 듣기
      ttsBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, ''));
      });

      document.getElementById('exampleAudioBtn').addEventListener('click', (e) => { e.stopPropagation(); if(displayedList.length)playJapaneseAudio(displayedList[currentIndex].exJa); });
      // 현재 카드 별표 토글
      starToggleBtn.addEventListener('click', () => {
        if (displayedList.length === 0) return;
        toggleStar(displayedList[currentIndex].id);
      });

      // 검색창 입력
      searchInput.addEventListener('input', applyFilters);
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        applyFilters();
        searchInput.focus();
      });

      // 필터 변경
      probFilter.addEventListener('change', applyFilters);

      // 셔플 버튼
      shuffleBtn.addEventListener('click', () => {
        stopAuto();
        if (displayedList.length <= 1) return;
        for (let i = displayedList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [displayedList[i], displayedList[j]] = [displayedList[j], displayedList[i]];
        }
        currentIndex = 0;
        renderCurrentCard();
        renderListView();
      });

      // 원래 순서 리셋
      resetOrderBtn.addEventListener('click', () => {
        applyFilters();
      });

      // 별표 모드 필터 토글
      studyStarredBtn.addEventListener('click', () => {
        onlyStarred = !onlyStarred;
        studyStarredBtn.classList.toggle('bg-amber-600', onlyStarred);
        studyStarredBtn.classList.toggle('text-white', onlyStarred);
        studyStarredBtn.classList.toggle('bg-slate-700', !onlyStarred);
        studyStarredBtn.classList.toggle('text-amber-300', !onlyStarred);
        applyFilters();
      });

      // 모드 변경 (카드 vs 리스트)
      modeFlashcardBtn.addEventListener('click', () => {
        stopAuto();
        modeFlashcardBtn.className = "px-3 py-1.5 rounded-lg bg-indigo-600 font-semibold text-white transition";
        modeListBtn.className = "px-3 py-1.5 rounded-lg bg-slate-700 font-medium text-slate-300 transition hover:bg-slate-600";
        flashcardView.classList.remove('hidden');
        listView.classList.add('hidden');
      });

      modeListBtn.addEventListener('click', () => {
        stopAuto();
        modeListBtn.className = "px-3 py-1.5 rounded-lg bg-indigo-600 font-semibold text-white transition";
        modeFlashcardBtn.className = "px-3 py-1.5 rounded-lg bg-slate-700 font-medium text-slate-300 transition hover:bg-slate-600";
        listView.classList.remove('hidden');
        flashcardView.classList.add('hidden');
        renderListView();
      });

      // 테이블 내부 클릭 이벤트 (위임)
      vocabTableBody.addEventListener('click', (e) => {
        const starBtn = e.target.closest('.row-star-btn');
        if (starBtn) {
          const id = parseInt(starBtn.dataset.id);
          toggleStar(id);
          return;
        }

        const audioBtn = e.target.closest('.row-audio-btn');
        if (audioBtn) {
          const word = audioBtn.dataset.word;
          playJapaneseAudio(word);
        }
      });

      // 키보드 단축키
      window.addEventListener('keydown', (e) => {
        if (['input', 'select', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) {
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault();
          toggleFlip();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevBtn.click();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextBtn.click();
        } else if (e.code === 'KeyS') {
          e.preventDefault();
          if (displayedList.length > 0) {
            toggleStar(displayedList[currentIndex].id);
          }
        } else if (e.code === 'KeyV') {
          e.preventDefault();
          if (displayedList.length > 0) {
            playJapaneseAudio(displayedList[currentIndex].word.replace(/[()]/g, ''));
          }
        }
      });
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      initProbOptions();
      starredCount.textContent = starredIds.size;
      setupEventListeners();
      renderCurrentCard();
      renderListView();
    });
  </script>
</body>
</html>
