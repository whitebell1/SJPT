</style><header><div><div><h1>▣ JP Everyday Expressions</h1><small>일상회화 표현 · 총 7개 표현</small></div><nav class="row"><a class="menuLink" href="./index.html" aria-label="SJPT 학습 목차로 돌아가기" title="목차로 돌아가기">⌂</a><button id="cardsMode" class="active">카드 모드</button><button id="listMode">목록 모드</button><button id="starFilter" class="star">★ 별표 (0)</button></nav></div></header><main><section class="row filters"><input id="search" aria-label="검색" placeholder="일본어, 한국어, 읽는 법, 표현 검색…"><button id="clear">지우기</button><select id="part" aria-label="표현 분류"><option value="">전체 표현</option><option value="1">편하게</option><option value="2">격식 있게</option><option value="3">정중하게</option><option value="4">어느 쪽이든 괜찮음</option><option value="5">티켓 구매 문의</option><option value="6">매표소 위치 안내</option><option value="7">교통 IC 카드 이용 안내</option></select><select id="number" aria-label="문항 번호"><option value="">전체 번호</option></select><button id="shuffle">⇄ 셔플</button><button id="reset">↺ 순서 복원</button></section><div class="row status"><div class="row"><strong id="count" aria-live="polite"></strong><span id="tag" class="badge"></span></div><div class="row"><button id="autoPlay" aria-label="자동 넘김 시작" title="자동 넘김 시작" aria-pressed="false">▶</button><button id="star" class="star" aria-label="현재 문항 별표">☆</button><button id="speak">♫ 듣기</button></div></div><p id="message" role="status"></p><section id="cardView"><div id="card" class="card" role="button" tabindex="0" aria-label="카드 뒤집기"></div><div class="progress"><div id="progress"></div></div><div class="row controls"><button id="prev">← 이전</button><button id="flip" class="primary">↻ 뒤집기</button><button id="next">다음 →</button></div><p class="help">탭 또는 Space 키: 뒤집기 · ← →: 이전/다음<br>한국어를 보고 일본어로 말해 보세요. 뒷면에서 표현과 읽는 법을 확인하세요.</p></section><section id="listView" hidden aria-label="문항 목록"></section><div id="empty" class="empty" hidden>조건에 맞는 문항이 없습니다.<br>검색어 또는 필터를 변경해 주세요.</div></main><footer>일본어 일상회화 · 7가지 표현 · 요미가나 · 한국어 해석 · 일본어 발음 듣기</footer><script>
const DATA=[{"title": "편하게", "qko": "좀 더 편한 느낌으로 말하려면 어떻게 말하나요?", "a": "もう少しカジュアルに言うなら、どう言いますか？", "part": 1, "id": 1, "no": "01", "qr": "좀 더 편한 느낌으로 말하려면 어떻게 말하나요?", "q": "좀 더 편한 느낌으로 말하려면 어떻게 말하나요?", "ar": "もう少(すこ)しカジュアルに言(い)うなら、どう言(い)いますか？", "situation": "", "ako": "カジュアル: 격식 없는, 편안한"}, {"title": "격식 있게", "qko": "좀 더 공식적인 느낌으로 말하려면 어떻게 말하나요?", "a": "もう少しフォーマルに言うなら、どう言いますか？", "part": 2, "id": 2, "no": "02", "qr": "좀 더 공식적인 느낌으로 말하려면 어떻게 말하나요?", "q": "좀 더 공식적인 느낌으로 말하려면 어떻게 말하나요?", "ar": "もう少(すこ)しフォーマルに言(い)うなら、どう言(い)いますか？", "situation": "", "ako": "フォーマル: 격식을 갖춘, 공식적인"}, {"title": "정중하게", "qko": "좀 더 정중하게 말하려면 어떻게 말하나요?", "a": "もう少し丁寧に言うなら、どう言いますか？", "part": 3, "id": 3, "no": "03", "qr": "좀 더 정중하게 말하려면 어떻게 말하나요?", "q": "좀 더 정중하게 말하려면 어떻게 말하나요?", "ar": "もう少(すこ)し丁寧(ていねい)に言(い)うなら、どう言(い)いますか？", "situation": "", "ako": "丁寧（ていねい）: 정중함"}, {"id": 4, "part": 4, "no": "04", "title": "어느 쪽이든 괜찮음", "q": "어느 쪽을 사용해도 상관없습니다.", "a": "どちらを使っても構いません。", "qr": "어느 쪽을 사용해도 상관없습니다.", "ar": "どちらを使(つか)っても構(かま)いません。", "qko": "어느 쪽을 사용해도 상관없습니다.", "ako": "どちら: 어느 쪽 · ～ても構いません: ~해도 상관없습니다", "situation": ""}, {"id": 5, "part": 5, "no": "05", "title": "티켓 구매 문의", "q": "실례합니다. 저기요. 이거, 티켓은 어딘가에서 살 필요가 있나요?", "qr": "실례합니다. 저기요. 이거, 티켓은 어딘가에서 살 필요가 있나요?", "qko": "실례합니다. 저기요. 이거, 티켓은 어딘가에서 살 필요가 있나요?", "a": "すいません。あのう。これ、チケットって、どこかで買う必要がありますか", "ar": "すいません。あのう。これ、チケットって、どこかで買(か)う必要(ひつよう)がありますか", "situation": "Yuka가 직원에게 티켓 구매가 필요한지 묻는 상황", "ako": "～必要がありますか（ひつようがありますか）: ~할 필요가 있나요? · チケットって: 티켓 말인데요 / 티켓은 (화제 제시) · すいません: すみません의 구어 표현"}, {"id": 6, "part": 6, "no": "06", "title": "매표소 위치 안내", "q": "저기 말이죠. 만약 티켓을 사실 거라면, 나카우 입간판 아래에 매표소가 있어요.", "qr": "저기 말이죠. 만약 티켓을 사실 거라면, 나카우 입간판 아래에 매표소가 있어요.", "qko": "저기 말이죠. 만약 티켓을 사실 거라면, 나카우 입간판 아래에 매표소가 있어요.", "a": "あのね。もし買われるんやったら、「なか卯」の立て看板の下に切符売り場。", "ar": "あのね。もし買(か)われるんやったら、「なか卯(う)」の立(た)て看板(かんばん)の下(した)に切符売(きっぷう)り場(ば)。", "situation": "직원이 관서 사투리로 매표소 위치를 안내하는 상황", "ako": "買われる（かわれる）: 이 문맥에서는 존경 표현인 ‘사시다’ · ～んやったら: ~라면 (관서 방언; 표준어 ～んだったら) · なか卯（なかう）: 나카우 · 立て看板（たてかんばん）: 입간판 · 切符売り場（きっぷうりば）: 매표소 · 문장 끝의 があります가 생략된 구어 표현"}, {"id": 7, "part": 7, "no": "07", "title": "교통 IC 카드 이용 안내", "q": "혹시, 저기, 교통계 IC 카드를 가지고 계시다면, 탈 때 태그(터치)로도 가능합니다.", "qr": "혹시, 저기, 교통계 IC 카드를 가지고 계시다면, 탈 때 태그(터치)로도 가능합니다.", "qko": "혹시, 저기, 교통계 IC 카드를 가지고 계시다면, 탈 때 태그(터치)로도 가능합니다.", "a": "もし、あのう、交通系のICカードお持ちでしたら、乗るとき、タッチでもいけます。", "ar": "もし、あのう、交通系(こうつうけい)のICカードお持(も)ちでしたら、乗(の)るとき、タッチでもいけます。", "situation": "직원이 교통 IC 카드로 탑승할 수 있다고 안내하는 상황", "ako": "交通系（こうつうけい）: 교통계, 교통 관련 · ICカード（アイシーカード）: IC 카드 · お持ちでしたら（おもちでしたら）: 가지고 계시다면 (소지 여부를 높여 묻는 존경 표현) · 乗るとき（のるとき）: 탈 때 · タッチでも: 터치로도 · いけます: 가능합니다, 됩니다 (여기서는 이용 가능함을 나타내는 구어 표현)"}];
const $=id=>document.getElementById(id);const AUTO_DELAY=5000;let autoPlaying=false,autoTimer=null;let stars=new Set();try{stars=new Set(JSON.parse(localStorage.getItem('jp-everyday-expressions-stars-v1')||'[]'))}catch{}let filtered=[...DATA],index=0,back=false,onlyStars=false,mode='card';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ruby(s){return esc(s).replace(/([一-龯々〆ヵヶ][一-龯々〆ヵヶぁ-ゖー]*?)\(([ぁ-ゖー]+)\)/g,'<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>')}
function translation(c){return '<dl class="translations">'+(c.situation?'<dt>상황</dt><dd>'+esc(c.situation)+'</dd>':'')+'<dt>뜻</dt><dd>'+esc(c.qko)+'</dd><dt>어휘</dt><dd>'+esc(c.ako)+'</dd></dl>'}
function stop(){activeUtterance=null;if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
let activeUtterance=null;
function speak(c,answer){
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('message').textContent='이 브라우저는 음성 재생을 지원하지 않습니다. Chrome 등 다른 브라우저에서 열어 주세요.';return}
 const synth=window.speechSynthesis;
 synth.cancel();
 const u=new SpeechSynthesisUtterance(c.a);
 activeUtterance=u;
 u.lang='ja-JP';u.rate=.85;u.pitch=1;u.volume=1;
 const voices=synth.getVoices();
 const japanese=voices.filter(v=>/^ja(?:-|$)/i.test(v.lang));
 const voice=japanese.find(v=>v.default)||japanese.find(v=>v.localService)||japanese[0];
 if(voice)u.voice=voice;
 $('message').textContent='음성 재생을 요청했습니다…';
 u.onstart=()=>{if(activeUtterance===u)$('message').textContent='일본어 음성 재생 중…'};
 u.onend=()=>{if(activeUtterance===u){$('message').textContent='';activeUtterance=null}};
 u.onerror=e=>{if(activeUtterance!==u)return;activeUtterance=null;if(e.error==='canceled'||e.error==='interrupted'){$('message').textContent='';return}$('message').textContent='음성을 재생하지 못했습니다. 안드로이드 설정의 텍스트 음성 변환에서 일본어 음성 데이터를 설치한 뒤 Chrome에서 다시 시도해 주세요.'};
 try{if(synth.paused)synth.resume();synth.speak(u)}catch(e){activeUtterance=null;$('message').textContent='음성 재생을 시작하지 못했습니다. Chrome에서 열고 일본어 음성 설정을 확인해 주세요.'}
}

function clearAutoTimers(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}}
function updateAutoStatus(){const button=$('autoPlay');if(!button)return;button.classList.toggle('active',autoPlaying);button.setAttribute('aria-pressed',autoPlaying);button.textContent=autoPlaying?'■':'▶';const label=autoPlaying?'자동 넘김 정지':'자동 넘김 시작';button.setAttribute('aria-label',label);button.title=label}
function stopAuto(){autoPlaying=false;clearAutoTimers();updateAutoStatus()}
function scheduleAuto(){clearAutoTimers();if(!autoPlaying||!filtered.length||mode!=='card'){stopAuto();return}autoTimer=setTimeout(()=>{clearAutoTimers();stop();let movedToNext=false;if(back){index=(index+1)%filtered.length;back=false;movedToNext=true}else back=true;render();if(movedToNext)speak(filtered[index],false);scheduleAuto()},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stop();return}if(!filtered.length)return;mode='card';back=false;autoPlaying=true;render();speak(filtered[index],false);scheduleAuto()}

function toggleStar(id){stars.has(id)?stars.delete(id):stars.add(id);try{localStorage.setItem('jp-everyday-expressions-stars-v1',JSON.stringify([...stars]))}catch{$('message').textContent='이 브라우저에서는 별표를 영구 저장할 수 없습니다.'}if(onlyStars)apply();else render()}
function apply(){stopAuto();stop();const q=$('search').value.toLowerCase().trim();filtered=DATA.filter(c=>(!$('part').value||c.part==$('part').value)&&(!$('number').value||c.no==$('number').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;render()}
function render(){const c=filtered[index];$('starFilter').textContent='★ 별표 ('+stars.size+')';$('starFilter').classList.toggle('active',onlyStars);$('starFilter').setAttribute('aria-pressed',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('star').hidden=!c||mode!=='card';$('speak').hidden=!c||mode!=='card';$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}문항`):'0문항';$('tag').textContent=c?`${c.title} · ${c.no}번`:'';if(!c)return;
$('star').textContent=stars.has(c.id)?'★':'☆';$('star').setAttribute('aria-pressed',stars.has(c.id));$('card').classList.toggle('back',back);$('card').innerHTML=`<div class="cardTop"><span>${c.no} | ${esc(c.title)}</span><span>${back?'일본어':'한국어'}</span></div><div class="sentence ${(back?c.a:c.q).length>55?'long':''}" lang="${back?'ja':'ko'}">${ruby(back?c.ar:c.qr)}</div>${back?translation(c):''}<div class="hint">${back?'다시 탭하면 한국어로 돌아갑니다':'탭하여 일본어 표현과 읽는 법 확인'}</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';
if(mode==='list')$('listView').innerHTML=filtered.map(c=>`<article class="listitem"><div class="row"><h2>${c.no} | ${esc(c.title)}</h2><button class="star" data-star="${c.id}" aria-label="${c.no}번 별표" aria-pressed="${stars.has(c.id)}">${stars.has(c.id)?'★':'☆'}</button><button data-q="${c.id}">듣기</button></div><p class="listSentence" lang="ko">${ruby(c.qr)}</p><p class="listSentence" lang="ja">${ruby(c.ar)}</p>${translation(c)}</article>`).join('')}
function flip(){if(!filtered.length)return;stop();back=!back;render();if(autoPlaying)scheduleAuto()}
function move(n){if(!filtered.length)return;stop();index=(index+n+filtered.length)%filtered.length;back=false;render();if(autoPlaying)scheduleAuto()}
$('autoPlay').onclick=toggleAuto;$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('star').onclick=()=>toggleStar(filtered[index].id);$('speak').onclick=()=>speak(filtered[index],back);$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{stopAuto();stop();mode='card';render()};$('listMode').onclick=()=>{stopAuto();stop();mode='list';render()};$('search').oninput=apply;$('part').onchange=apply;$('number').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=apply;$('shuffle').onclick=()=>{stopAuto();stop();for(let i=filtered.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;back=false;render()};$('listView').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.star)toggleStar(+b.dataset.star);else speak(DATA.find(c=>c.id===+(b.dataset.q||b.dataset.a)),!!b.dataset.a)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)||mode!=='card')return;if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'){e.preventDefault();move(1)}});for(let i=1;i<=DATA.length;i++){const v=String(i).padStart(2,'0');$('number').add(new Option(v+'번',v))}render();updateAutoStatus();
</script></html>
