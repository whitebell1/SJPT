const $=id=>document.getElementById(id),AUTO_DELAY=3000,TTS_START_DELAY=0,MANUAL_TTS_START_DELAY=0;let filtered=[...DATA],index=0,back=false,showKorean=false,showFurigana=false,onlyStars=false,mode='card',autoPlaying=false,autoTimer=null,speechDelayTimer=null,speechRunId=0;let stars=new Set(JSON.parse(localStorage.getItem('sjpt-l45-vocab-stars-v1')||'[]'));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopSpeech(){speechRunId++;clearTimeout(speechDelayTimer);if('speechSynthesis'in window)speechSynthesis.cancel();$('message').textContent=''}
function speak(c,answer,done,delay=TTS_START_DELAY){if(!c||!('speechSynthesis'in window)){if(done)done();return}stopSpeech();const runId=speechRunId,text=answer?c.ex:c.r;$('message').textContent='음성 준비 중…';speechDelayTimer=setTimeout(()=>{if(runId!==speechRunId)return;const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.82;const voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));if(voices[0])u.voice=voices.find(v=>v.default)||voices[0];u.onstart=()=>{if(runId===speechRunId)$('message').textContent='일본어 음성 재생 중…'};u.onend=()=>{if(runId!==speechRunId)return;$('message').textContent='';if(done)done()};u.onerror=()=>{if(runId!==speechRunId)return;$('message').textContent='';if(done)done()};speechSynthesis.speak(u)},delay)}
function bounds(){let start=filtered.findIndex(c=>String(c.id)==$('rangeStart').value),end=filtered.findIndex(c=>String(c.id)==$('rangeEnd').value);return{start:start<0?0:start,end:end<0?Math.max(0,filtered.length-1):end}}
function updateRanges(){const a=$('rangeStart'),b=$('rangeEnd'),av=a.value,bv=b.value;a.innerHTML=b.innerHTML='';filtered.forEach(c=>{const label=String(c.id).padStart(2,'0');a.add(new Option(label,c.id));b.add(new Option(label,c.id))});a.disabled=b.disabled=!filtered.length;if(!filtered.length)return;a.value=filtered.some(c=>String(c.id)===av)?av:filtered[0].id;b.value=filtered.some(c=>String(c.id)===bv)?bv:filtered.at(-1).id;if(bounds().end<bounds().start)b.value=a.value}
function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);$('autoPlay').textContent='▶';$('autoPlay').classList.remove('active')}
function schedule(){clearTimeout(autoTimer);if(!autoPlaying||!filtered.length)return;autoTimer=setTimeout(()=>{if(back){const x=bounds();index=index>=x.end?x.start:index+1;back=false}else back=true;showKorean=false;showFurigana=false;render();speak(filtered[index],back,schedule)},AUTO_DELAY)}
function toggleAuto(){if(autoPlaying){stopAuto();stopSpeech();return}if(!filtered.length)return;const x=bounds();index=x.start;back=false;showKorean=false;showFurigana=false;autoPlaying=true;$('autoPlay').textContent='■';$('autoPlay').classList.add('active');render();speak(filtered[index],false,schedule)}
function apply(){stopAuto();stopSpeech();const q=$('search').value.trim().toLowerCase();filtered=DATA.filter(c=>(!$('round').value||c.round==$('round').value)&&(!onlyStars||stars.has(c.id))&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));index=0;back=false;showKorean=false;showFurigana=false;updateRanges();render()}
function render(){const c=filtered[index];$('starFilter').textContent=`★ 별표 (${stars.size})`;$('starFilter').classList.toggle('active',onlyStars);$('cardsMode').classList.toggle('active',mode==='card');$('listMode').classList.toggle('active',mode==='list');$('cardView').hidden=!c||mode!=='card';$('listView').hidden=!c||mode!=='list';$('empty').hidden=!!c;$('count').textContent=c?(mode==='card'?`Card ${index+1} / ${filtered.length}`:`총 ${filtered.length}개`):'0개';$('tag').textContent=c?`제${c.round}회 · ${c.theme}`:'';if(!c)return;$('star').textContent=stars.has(c.id)?'★':'☆';$('card').classList.toggle('back',back);$('koreanToggle').hidden=!back;$('koreanToggle').textContent=showKorean?'해석 숨기기':'해석';$('card').innerHTML=back?`<div class="cardTop"><span>No. ${String(c.id).padStart(2,'0')} · 제${c.round}회</span><span>${esc(c.theme)}</span></div><p class="backWord" lang="ja">${showFurigana?`<ruby>${esc(c.w)}<rt>${esc(c.r)}</rt></ruby>`:esc(c.w)}</p><p class="meaning">${esc(c.ko)}</p><p class="example" lang="ja">例. ${showFurigana?EXAMPLE_RUBY[c.id]:esc(c.ex)}</p>${showKorean?`<p class="korean">${esc(c.exko)}</p>`:''}<button id="furiganaToggle" class="furiganaToggle${showFurigana?' active':''}" type="button">${showFurigana?'후리가나 숨기기':'후리가나 보기'}</button><div class="hint">다시 탭하면 앞면으로 돌아갑니다</div>`:`<div class="cardTop"><span>No. ${String(c.id).padStart(2,'0')} · 제${c.round}회</span><span>${esc(c.theme)}</span></div><p class="word" lang="ja">${esc(c.w)}</p><div class="hint">탭하여 뜻과 예문 확인</div>`;$('progress').style.width=((index+1)/filtered.length*100)+'%';if(mode==='list')$('listView').innerHTML=filtered.map(x=>`<article class="listitem"><div class="row"><h2>${String(x.id).padStart(2,'0')}. ${esc(x.w)} [${esc(x.r)}]</h2><button data-speak="${x.id}">듣기</button></div><p>${esc(x.ko)}</p><p lang="ja">${esc(x.ex)}</p><p class="korean">${esc(x.exko)}</p></article>`).join('')}
function flip(){if(!filtered.length)return;stopSpeech();back=!back;showKorean=false;showFurigana=false;render()}
function move(n){if(!filtered.length)return;stopSpeech();index=(index+n+filtered.length)%filtered.length;back=false;showKorean=false;showFurigana=false;render()}
$('card').onclick=e=>{if(e.target.closest('#furiganaToggle')){showFurigana=!showFurigana;render();return}flip()};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('koreanToggle').onclick=()=>{showKorean=!showKorean;render()};$('speak').onclick=()=>speak(filtered[index],back,null,MANUAL_TTS_START_DELAY);$('autoPlay').onclick=toggleAuto;$('star').onclick=()=>{const id=filtered[index].id;stars.has(id)?stars.delete(id):stars.add(id);localStorage.setItem('sjpt-l45-vocab-stars-v1',JSON.stringify([...stars]));render()};$('starFilter').onclick=()=>{onlyStars=!onlyStars;apply()};$('cardsMode').onclick=()=>{mode='card';render()};$('listMode').onclick=()=>{stopAuto();mode='list';render()};$('search').oninput=apply;$('round').onchange=apply;$('clear').onclick=()=>{$('search').value='';apply()};$('reset').onclick=()=>{$('search').value='';$('round').value='';onlyStars=false;apply()};$('shuffle').onclick=()=>{stopAuto();for(let i=filtered.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;updateRanges();render()};$('rangeStart').onchange=()=>{stopAuto();const x=bounds();if(x.end<x.start)$('rangeEnd').value=$('rangeStart').value;index=bounds().start;back=false;render()};$('rangeEnd').onchange=()=>{stopAuto();const x=bounds();if(x.end<x.start)$('rangeStart').value=$('rangeEnd').value;index=bounds().start;back=false;render()};$('listView').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(DATA.find(c=>c.id==b.dataset.speak),false,null,MANUAL_TTS_START_DELAY)};for(let i=1;i<=8;i++)$('round').add(new Option(`제${i}회`,i));apply();
